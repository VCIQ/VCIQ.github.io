name: Read-only Research Agent live acceptance 20260911

on:
  push:
    branches:
      - audit/research-agent-live-acceptance-20260911
    paths:
      - .github/workflows/research-agent-live-acceptance-20260911.yml
      - tools/audit_research_agent_live_20260911.py

permissions:
  contents: read

concurrency:
  group: research-agent-live-acceptance-20260911
  cancel-in-progress: false

jobs:
  live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser test tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify production CDN bytes and fresh browser contexts
        run: python tools/audit_research_agent_live_20260911.py
      - name: Preserve audit results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-agent-live-acceptance-20260911
          path: work/research-agent-live-audit/
          if-no-files-found: error
          retention-days: 7
