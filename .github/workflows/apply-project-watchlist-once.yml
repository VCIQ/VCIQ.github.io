name: Apply project watchlist once

on:
  push:
    branches:
      - chore/user-tracking-projects-batch1
    paths:
      - .github/workflows/apply-project-watchlist-once.yml

permissions:
  contents: write

env:
  EXPECTED_REPOSITORY: VCIQ/VCIQ.github.io
  EXPECTED_REF: refs/heads/chore/user-tracking-projects-batch1

jobs:
  apply:
    if: github.repository == 'VCIQ/VCIQ.github.io' && github.ref == 'refs/heads/chore/user-tracking-projects-batch1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/user-tracking-projects-batch1
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require the exact repository and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF" = "$EXPECTED_REF"

      - name: Apply additive-only overlay to tracking config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          config_path = Path('config/user_tracking.json')
          overlay_path = Path('config/user_tracking.project_watchlist.v1.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          overlay = json.loads(overlay_path.read_text(encoding='utf-8'))

          if overlay.get('mode') != 'additive-only':
              raise SystemExit('overlay must be additive-only')
          guardrails = overlay.get('guardrails') or {}
          if any((
              guardrails.get('deleteExistingEntries') is not False,
              guardrails.get('addNewTracks') is not False,
              guardrails.get('addSources') is not False,
          )):
              raise SystemExit('overlay guardrails are not fail-closed')

          tracks = config.get('tracks')
          if not isinstance(tracks, list) or not tracks:
              raise SystemExit('user_tracking.json has no tracks array')
          by_slug = {
              str(track.get('slug') or ''): track
              for track in tracks
              if isinstance(track, dict) and str(track.get('slug') or '')
          }
          changes = overlay.get('trackChanges')
          if not isinstance(changes, dict) or not changes:
              raise SystemExit('overlay has no trackChanges')
          missing = sorted(set(changes) - set(by_slug))
          if missing:
              raise SystemExit(f'overlay references unknown tracks: {missing}')

          field_map = {
              'keywordsAdd': 'keywords',
              'peopleAdd': 'people',
              'sampleCompaniesAdd': 'sampleCompanies',
          }

          def identity(value: object) -> str:
              return ' '.join(str(value or '').split()).casefold()

          report: dict[str, dict[str, int]] = {}
          total_added = 0
          for slug, change in changes.items():
              if not isinstance(change, dict):
                  raise SystemExit(f'invalid change object for {slug}')
              unexpected = set(change) - set(field_map)
              if unexpected:
                  raise SystemExit(f'unexpected change keys for {slug}: {sorted(unexpected)}')
              track = by_slug[slug]
              track_report: dict[str, int] = {}
              for source_key, target_key in field_map.items():
                  additions = change.get(source_key, [])
                  if not isinstance(additions, list):
                      raise SystemExit(f'{slug}.{source_key} must be a list')
                  target = track.get(target_key)
                  if not isinstance(target, list):
                      raise SystemExit(f'{slug}.{target_key} must be a list')
                  seen = {identity(value) for value in target if identity(value)}
                  added = 0
                  for raw in additions:
                      value = ' '.join(str(raw or '').split())
                      key = identity(value)
                      if not value or not key or key in seen:
                          continue
                      target.append(value)
                      seen.add(key)
                      added += 1
                  track_report[target_key] = added
                  total_added += added
              report[slug] = track_report

          if total_added <= 0:
              raise SystemExit('overlay produced no new tracking signals')

          review = overlay.setdefault('review', {})
          review['branchApplied'] = True
          review['branchAppliedAt'] = datetime.now(UTC).replace(microsecond=0).isoformat()
          review['branchAppliedParentSha'] = os.environ.get('GITHUB_SHA', '')
          review['productionApplied'] = False
          review['appliedSignalCount'] = total_added

          config_path.write_text(
              json.dumps(config, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          overlay_path.write_text(
              json.dumps(overlay, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({'totalAdded': total_added, 'tracks': report}, ensure_ascii=False))
          PY

      - name: Validate tracking configuration before branch write
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          python -m unittest \
            tests.test_manual_tracking \
            tests.test_manual_tracking_batch \
            tests.test_manual_tracking_keyword \
            tests.test_manual_tracking_workflow \
            tests.test_tracking_manual_feedback \
            tests.test_expand_tracking_entities
          npm run validate:tracking
          npm run validate:taxonomy
          python tools/tracking_source_governance.py --check

      - name: Commit only the generated config and audit overlay to this branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          unexpected=$(git status --short | awk '{print $2}' | grep -v -E '^(config/user_tracking.json|config/user_tracking.project_watchlist.v1.json)$' || true)
          test -z "$unexpected" || {
            echo "unexpected generated files:"
            echo "$unexpected"
            exit 1
          }
          git add -- config/user_tracking.json config/user_tracking.project_watchlist.v1.json
          git diff --cached --quiet && {
            echo 'overlay produced no branch changes'
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'config: apply VCIQ project tracking batch 1'
          gh auth setup-git
          git push origin HEAD:chore/user-tracking-projects-batch1
