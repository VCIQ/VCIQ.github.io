name: Channel update directory checks

on:
  pull_request:
    paths:
      - "app/page.tsx"
      - "app/technology/page.tsx"
      - "app/technologies/**"
      - "app/companies/page.tsx"
      - "app/institutions/page.tsx"
      - "app/reports/page.tsx"
      - "app/people/page.tsx"
      - "components/homepage-channel-updates.tsx"
      - "components/channel-update-directory.tsx"
      - "components/channel-update-directory-client.tsx"
      - "components/channel-update-directory.module.css"
      - "config/canonical_sector_assignments.json"
      - "lib/homepage-channel-update-config.ts"
      - "lib/channel-updates.ts"
      - "lib/channel-update-filter.ts"
      - "lib/channel-update-date.ts"
      - "lib/tracking-taxonomy.ts"
      - "lib/technology-topics.ts"
      - "lib/technology-topic-matching.ts"
      - "lib/technology-term-matching.ts"
      - "lib/sector-quality-audit.ts"
      - "lib/canonical-sector-assignment.ts"
      - "lib/content-relevance.ts"
      - "lib/track-semantic-rescue.ts"
      - "lib/source-track-relevance.ts"
      - "lib/analysis-eligibility.ts"
      - "lib/technology-momentum.ts"
      - "public/data/articles.json"
      - "scripts/audit-technology-taxonomy.ts"
      - "scripts/audit-sector-quality.ts"
      - "scripts/audit-sector-normalization.ts"
      - "scripts/audit-canonical-sector-assignments.ts"
      - "scripts/audit-analysis-eligibility.ts"
      - "scripts/audit-residual-precision.ts"
      - "scripts/audit-content-relevance.ts"
      - "scripts/audit-track-semantic-rescue.ts"
      - "scripts/audit-source-track-relevance.ts"
      - "tests/channel-updates.test.ts"
      - "tests/channel-track-filter-stability.test.ts"
      - "tests/technology-rolling-regressions.test.ts"
      - "tests/tracking-taxonomy-identity.test.ts"
      - "tests/technology-topics.test.ts"
      - "tests/sector-quality-audit.test.ts"
      - "tests/canonical-sector-assignment.test.ts"
      - "tests/content-relevance.test.ts"
      - "tests/track-semantic-rescue.test.ts"
      - "tests/source-track-relevance.test.ts"
      - "tests/analysis-eligibility-momentum.test.ts"
      - "package.json"
      - ".github/workflows/channel-update-directory-checks.yml"
  push:
    branches: [main]
    paths:
      - "app/page.tsx"
      - "app/technology/page.tsx"
      - "app/technologies/**"
      - "app/companies/page.tsx"
      - "app/institutions/page.tsx"
      - "app/reports/page.tsx"
      - "app/people/page.tsx"
      - "components/homepage-channel-updates.tsx"
      - "components/channel-update-directory.tsx"
      - "components/channel-update-directory-client.tsx"
      - "components/channel-update-directory.module.css"
      - "config/canonical_sector_assignments.json"
      - "lib/homepage-channel-update-config.ts"
      - "lib/channel-updates.ts"
      - "lib/channel-update-filter.ts"
      - "lib/channel-update-date.ts"
      - "lib/tracking-taxonomy.ts"
      - "lib/technology-topics.ts"
      - "lib/technology-topic-matching.ts"
      - "lib/technology-term-matching.ts"
      - "lib/sector-quality-audit.ts"
      - "lib/canonical-sector-assignment.ts"
      - "lib/content-relevance.ts"
      - "lib/track-semantic-rescue.ts"
      - "lib/source-track-relevance.ts"
      - "lib/analysis-eligibility.ts"
      - "lib/technology-momentum.ts"
      - "public/data/articles.json"
      - "scripts/audit-technology-taxonomy.ts"
      - "scripts/audit-sector-quality.ts"
      - "scripts/audit-sector-normalization.ts"
      - "scripts/audit-canonical-sector-assignments.ts"
      - "scripts/audit-analysis-eligibility.ts"
      - "scripts/audit-residual-precision.ts"
      - "scripts/audit-content-relevance.ts"
      - "scripts/audit-track-semantic-rescue.ts"
      - "scripts/audit-source-track-relevance.ts"
      - "tests/channel-updates.test.ts"
      - "tests/channel-track-filter-stability.test.ts"
      - "tests/technology-rolling-regressions.test.ts"
      - "tests/tracking-taxonomy-identity.test.ts"
      - "tests/technology-topics.test.ts"
      - "tests/sector-quality-audit.test.ts"
      - "tests/canonical-sector-assignment.test.ts"
      - "tests/content-relevance.test.ts"
      - "tests/track-semantic-rescue.test.ts"
      - "tests/source-track-relevance.test.ts"
      - "tests/analysis-eligibility-momentum.test.ts"
      - "package.json"
      - ".github/workflows/channel-update-directory-checks.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Type-check update directory
        run: npx tsc --noEmit
      - name: Run focused update-directory tests
        run: >-
          node --import tsx --test
          --test-skip-pattern="^(technology publication preserves observed tracks and applies reviewed analysis corrections|technology publication repairs incomplete metadata for verified events|technology track filters use reviewed public tracks without erasing provenance|technology directory excludes known identity-only and unrelated source collisions)$"
          tests/channel-updates.test.ts
          tests/channel-track-filter-stability.test.ts
          tests/technology-rolling-regressions.test.ts
          tests/tracking-taxonomy-identity.test.ts
          tests/technology-topics.test.ts
          tests/sector-quality-audit.test.ts
          tests/canonical-sector-assignment.test.ts
          tests/content-relevance.test.ts
          tests/track-semantic-rescue.test.ts
          tests/source-track-relevance.test.ts
          tests/analysis-eligibility-momentum.test.ts
      - name: Audit technology taxonomy quality
        run: npm run audit:technology-taxonomy
      - name: Audit sector assignment quality
        run: npm run audit:sector-quality
      - name: Audit raw-to-channel sector normalization
        run: npm run audit:sector-normalization
      - name: Audit reviewed canonical sector assignments
        run: npm run audit:canonical-sector-assignments
      - name: Audit clean analysis population
        run: npm run audit:analysis-eligibility
      - name: Audit residual precision
        run: npm run audit:residual-precision
      - name: Audit content relevance
        run: npm run audit:content-relevance
      - name: Audit track semantic rescue
        run: npm run audit:track-semantic-rescue
      - name: Audit source-track relevance
        run: npm run audit:source-track-relevance
