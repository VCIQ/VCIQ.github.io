name: Assemble verified VC track repair branch

on:
  push:
    branches: [fix/vc-track-review-reconciliation]
    paths:
      - .github/workflows/finish-vc-track-source.yml
      - .github/diagnostics/vc-track-integration.patch

permissions:
  contents: write

jobs:
  assemble:
    if: github.repository == 'VCIQ/VCIQ.github.io' && github.ref == 'refs/heads/fix/vc-track-review-reconciliation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply the reviewed source-only patch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/vc-track-review-reconciliation
          git apply --check .github/diagnostics/vc-track-integration.patch
          git apply .github/diagnostics/vc-track-integration.patch
          git diff --check
      - name: Verify manual tracking and publication safety
        run: |
          python -m unittest -v \
            tests.test_manual_institution_intents \
            tests.test_entity_resolution \
            tests.test_entity_resolution_workflow \
            tests.test_legacy_manual_confirmed_tracking \
            tests.test_manual_company_trust \
            tests.test_resolved_company_candidates \
            tests.test_company_candidates \
            tests.test_manual_tracking \
            tests.test_manual_tracking_batch \
            tests.test_manual_tracking_reconciliation_workflow \
            tests.test_manual_tracking_ignore \
            tests.test_manual_tracking_remove
      - run: npm ci
      - name: Check cross-language identities and types
        run: |
          node --import tsx --test tests/institution-tracking-resolution.test.ts
          npx tsc --noEmit
      - name: Preview the real pending institution pins without writing data
        run: |
          python tools/reconcile_manual_institution_intents.py --track track-1ccjq49
          git diff --exit-code -- config/user_tracking.json config/tracking_intents.json config/tracking_capture_inbox.json config/tracking_auto_discovery.json
      - name: Commit tested source integration to the same repair branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/vc-track-review-reconciliation
          git rm .github/workflows/finish-vc-track-source.yml .github/diagnostics/vc-track-integration.patch
          git add \
            .github/workflows/company-candidate-discovery.yml \
            .github/workflows/track-review-state-audit.yml \
            lib/entity-resolution.ts \
            tests/test_legacy_manual_confirmed_tracking.py \
            tools/apply_manual_company_trust.py \
            tools/build_company_candidates.py \
            tools/entity_resolution.py \
            tools/resolved_company_captures.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: connect institutional identity, durable follow pins and publication boundaries'
          git push origin HEAD:fix/vc-track-review-reconciliation
