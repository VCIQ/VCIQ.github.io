name: Assemble verified VC track repair branch

on:
  push:
    branches: [fix/vc-track-review-reconciliation]
    paths:
      - .github/workflows/finish-vc-track-source.yml
      - .github/diagnostics/priority-source-edits.json

permissions:
  contents: write

jobs:
  assemble:
    if: github.repository == 'VCIQ/VCIQ.github.io' && github.ref == 'refs/heads/fix/vc-track-review-reconciliation'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply hash-verified source integration only
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('.github/diagnostics/priority-source-edits.json').read_text())
          proposed = {}
          for name, entry in manifest.items():
              path = Path(name)
              assert path.parts[0] in {'tools', 'lib', 'tests'} and '..' not in path.parts and not path.is_absolute(), name
              content = path.read_bytes()
              assert hashlib.sha256(content).hexdigest() == entry['before'], 'Source changed: ' + name
              lines = content.decode('utf-8').splitlines(keepends=True)
              for start, end, replacement in reversed(entry['edits']):
                  assert 0 <= start <= end <= len(lines), name
                  lines[start:end] = [replacement]
              result = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(result).hexdigest() == entry['after'], 'Patch mismatch: ' + name
              proposed[path] = result
          for path, result in proposed.items():
              path.write_bytes(result)
          print('Exact tested source hashes verified:', len(proposed))
          PY
          git diff --check
      - name: Verify manual tracking and publication safety
        run: |
          set -o pipefail
          python -m unittest -v \
            tests.test_manual_decision_first \
            tests.test_manual_institution_intents \
            tests.test_entity_resolution \
            tests.test_entity_resolution_workflow \
            tests.test_legacy_manual_confirmed_tracking \
            tests.test_manual_company_trust \
            tests.test_resolved_company_candidates \
            tests.test_company_candidates \
            tests.test_manual_tracking \
            tests.test_manual_tracking_batch \
            tests.test_manual_tracking_reconciliation_workflow \
            tests.test_manual_tracking_ignore \
            tests.test_manual_tracking_remove 2>&1 | tee /tmp/manual-decision-tests.log
      - run: npm ci
      - name: Check cross-language identities and types
        run: |
          node --import tsx --test tests/institution-tracking-resolution.test.ts
          npx tsc --noEmit
      - name: Preview pending institution pins without writing production data
        run: |
          python tools/reconcile_manual_institution_intents.py --track track-1ccjq49
          git diff --exit-code -- config public/data
      - name: Commit tested source integration to the same repair branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/vc-track-review-reconciliation
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          names = list(json.loads(Path('.github/diagnostics/priority-source-edits.json').read_text()))
          subprocess.run(['git', 'add', '--', *names], check=True)
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert set(staged) == set(names), staged
          assert not any(name.startswith('.github/workflows/') for name in staged)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make authenticated follow decisions authoritative across reconciliation'
          git push origin HEAD:fix/vc-track-review-reconciliation
          echo "Integrated source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-decision-first-tests
          path: /tmp/manual-decision-tests.log
          if-no-files-found: warn
          retention-days: 7
