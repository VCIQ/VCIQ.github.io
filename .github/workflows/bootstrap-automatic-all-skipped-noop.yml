name: Bootstrap automatic all-skipped no-op

on:
  push:
    branches:
      - fix/automatic-all-skipped-noop-20260816
    paths:
      - scripts/bootstrap-automatic-all-skipped-noop.py
      - .github/workflows/bootstrap-automatic-all-skipped-noop.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-automatic-all-skipped-noop
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: fix/automatic-all-skipped-noop-20260816
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply source migration
        run: python scripts/bootstrap-automatic-all-skipped-noop.py

      - name: Validate focused manual-tracking behavior
        run: |
          python -m py_compile \
            tools/manual_tracking.py \
            tools/manual_tracking_batch.py \
            tools/manual_tracking_keyword_support.py \
            tools/manual_tracking_batch_entrypoint.py
          python -m unittest \
            tests.test_manual_tracking \
            tests.test_manual_tracking_batch \
            tests.test_manual_tracking_workflow \
            tests.test_manual_tracking_keyword

      - name: Commit generated source changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && {
            echo "Migration produced no changes"
            exit 1
          }
          git commit -m "fix: treat all-skipped automatic batches as successful no-ops"
          git push origin HEAD:fix/automatic-all-skipped-noop-20260816
