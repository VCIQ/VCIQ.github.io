name: One-time compound capture replay hotfix

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/reconciliation-compound-capture-replay-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/reconciliation-compound-capture-replay-v1
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Patch resolver to reject compound person/company replay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/entity_resolution.py')
          text = path.read_text(encoding='utf-8')

          import_anchor = 'from typing import Any, Mapping\n\nROOT = Path(__file__).resolve().parents[1]\n'
          import_replacement = '''from typing import Any, Mapping

try:
    from .tracking_entity_integrity import split_compound_tracking_entity_name
except ImportError:
    from tracking_entity_integrity import split_compound_tracking_entity_name  # type: ignore

ROOT = Path(__file__).resolve().parents[1]
'''
          if text.count(import_anchor) != 1:
              raise SystemExit(f'import anchor count={text.count(import_anchor)}')
          text = text.replace(import_anchor, import_replacement, 1)

          guard_anchor = '''    if not key:
        return _result(
            requested_type=requested_type,
            name=name,
            status="rejected",
            entity_type=requested_type,
            canonical_name=name,
            reason="名称为空或无法形成稳定实体键。",
        )

    decisions = normalize_decision_manifest(
'''
          guard_replacement = '''    if not key:
        return _result(
            requested_type=requested_type,
            name=name,
            status="rejected",
            entity_type=requested_type,
            canonical_name=name,
            reason="名称为空或无法形成稳定实体键。",
        )

    # A person/company tracking entity must always represent one identity. Historical
    # capture records can outlive a later atomic data repair, so this guard must run
    # before human decisions, registries, or explicit-type fallback can resolve a
    # compound raw selection back into one persisted entity.
    if requested_type in {"person", "company"}:
        parts = split_compound_tracking_entity_name(name)
        if len(parts) > 1:
            label = "人物" if requested_type == "person" else "公司"
            return _result(
                requested_type=requested_type,
                name=name,
                status="review",
                entity_type=requested_type,
                canonical_name=name,
                confidence="low",
                source="compound-entity-guard",
                reason=(
                    f"{label}名称疑似包含多个实体：{name} → "
                    + "、".join(parts)
                    + "。请拆分为独立实体后再应用。"
                ),
            )

    decisions = normalize_decision_manifest(
'''
          if text.count(guard_anchor) != 1:
              raise SystemExit(f'guard anchor count={text.count(guard_anchor)}')
          text = text.replace(guard_anchor, guard_replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Prove current dirty inventory and run targeted resolver tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/entity_resolution.py \
            tools/reconcile_entity_resolution.py \
            tools/tracking_entity_integrity.py
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.tracking_entity_integrity import find_compound_tracking_entities
          payload = json.loads(Path('config/user_tracking.json').read_text(encoding='utf-8'))
          issues = find_compound_tracking_entities(payload)
          print('beforeCompoundOccurrences=', len(issues))
          for issue in issues:
              print(issue['trackSlug'], issue['entityType'], issue['value'])
          if len(issues) != 10:
              raise SystemExit(f'expected exact current dirty inventory of 10, got {len(issues)}')
          PY
          python -m unittest \
            tests.test_compound_capture_reconciliation \
            tests.test_entity_resolution \
            tests.test_entity_resolution_workflow \
            tests.test_tracking_entity_integrity

      - name: Reconcile historical captures with the new guard
        env:
          CANDIDATE_QUEUE: config/company_candidate_review_queue.json
        shell: bash
        run: |
          set -euo pipefail
          python tools/reconcile_entity_resolution.py
          python tools/build_resolved_company_candidates.py --output "$CANDIDATE_QUEUE"
          python tools/apply_manual_company_trust.py --candidates "$CANDIDATE_QUEUE"
          python tools/build_resolved_company_candidates.py --output "$CANDIDATE_QUEUE"
          python tools/reconcile_entity_resolution.py --check
          python tools/tracking_entity_integrity.py
          python tools/apply_manual_company_trust.py \
            --candidates "$CANDIDATE_QUEUE" \
            --check
          python tools/build_resolved_company_candidates.py \
            --output "$CANDIDATE_QUEUE" \
            --check

      - name: Verify raw 10 to 0 and historical capture quarantine
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.tracking_entity_integrity import find_compound_tracking_entities

          config = json.loads(Path('config/user_tracking.json').read_text(encoding='utf-8'))
          issues = find_compound_tracking_entities(config)
          if issues:
              raise SystemExit(f'after-state still contains {len(issues)} compounds: {issues}')

          inbox = json.loads(Path('config/tracking_capture_inbox.json').read_text(encoding='utf-8'))
          known = {
              'capture-6d54x',
              'capture-tjones',
              'capture-yb7hq4',
          }
          compound_records = []
          for record in inbox.get('records', []):
              if not isinstance(record, dict) or record.get('entityType') not in {'person', 'company'}:
                  continue
              resolution = record.get('resolution') if isinstance(record.get('resolution'), dict) else {}
              if resolution.get('source') == 'compound-entity-guard':
                  compound_records.append(record)

          ids = {str(record.get('id')) for record in compound_records}
          if not known.issubset(ids):
              raise SystemExit(f'known historical compound records were not quarantined: {sorted(ids)}')
          for record in compound_records:
              if record.get('status') != 'queued' or record.get('appliedTo') != []:
                  raise SystemExit(f'compound capture still applied: {record.get("id")}')

          print(
              json.dumps(
                  {
                      'beforeOccurrences': 10,
                      'afterOccurrences': 0,
                      'quarantinedCompoundCaptures': len(compound_records),
                      'knownQuarantinedIds': sorted(known),
                  },
                  ensure_ascii=False,
                  sort_keys=True,
              )
          )
          PY

      - name: Commit only the durable source and reconciled state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            tools/entity_resolution.py \
            config/user_tracking.json \
            config/tracking_capture_inbox.json \
            config/company_candidate_review_queue.json \
            config/company_candidate_decisions.json

          unexpected=$(git status --porcelain | awk '{print $2}' | grep -vE '^(.github/workflows/apply-compound-capture-replay-hotfix.yml|tests/test_compound_capture_reconciliation.py|tools/entity_resolution.py|config/user_tracking.json|config/tracking_capture_inbox.json|config/company_candidate_review_queue.json|config/company_candidate_decisions.json)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed paths:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

          git diff --cached --quiet && {
            echo 'expected reconciliation repair produced no staged changes' >&2
            exit 1
          }
          git commit -m 'fix: prevent historical compound capture replay'
          git push origin HEAD:fix/reconciliation-compound-capture-replay-v1
