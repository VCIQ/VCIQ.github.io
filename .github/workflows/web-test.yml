name: Frontend checks
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "public/data/**"
      - "public/research-reports/**"
      - "diagnostics/**"
      - ".github/diagnostics/**"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run manual tracking unit tests
        run: |
          python -m unittest \
            tests.test_manual_tracking \
            tests.test_manual_tracking_batch \
            tests.test_manual_tracking_keyword \
            tests.test_manual_tracking_workflow \
            tests.test_tracking_manual_feedback \
            tests.test_expand_tracking_entities
      - run: npm ci
      - run: npm run lint
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee unit-test.log
      - name: Upload unit test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: unit-test.log
          retention-days: 3
      - run: npm run test:crawler
      - name: Rebuild tracking-derived snapshot for candidate PR config
        if: github.event_name == 'pull_request'
        run: python tools/enrich_tracking_snapshot.py
      - name: Build Pages candidate or defer a main-only tracking refresh
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set +e
          set -o pipefail
          npm run build:pages 2>&1 | tee /tmp/frontend-build-pages.log
          build_status=${PIPESTATUS[0]}
          set -e

          if [ "$build_status" -eq 0 ]; then
            exit 0
          fi

          # Pull requests remain strict. On main, however, a tracking-config push can
          # legitimately arrive before the long full refresh has committed the matching
          # article snapshot. Pages already treats exactly this signature as deferred.
          if [ "$EVENT_NAME" = "push" ]; then
            tracking_errors="$(grep '^TRACKING_SNAPSHOT_ERROR:' /tmp/frontend-build-pages.log || true)"
            if printf '%s\n' "$tracking_errors" | grep -Fq "tracking configuration is newer than the article snapshot"; then
              unexpected_tracking_errors="$(
                printf '%s\n' "$tracking_errors" \
                  | grep -Fv "tracking configuration is newer than the article snapshot" \
                  | grep -Fv "missing crawler coverage record" \
                  || true
              )"
              if [ -z "$unexpected_tracking_errors" ]; then
                echo "::notice title=Frontend build deferred::Tracking configuration is waiting for Refresh public intelligence; this is not a frontend regression."
                exit 0
              fi
            fi
          fi

          exit "$build_status"
