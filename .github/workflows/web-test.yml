name: Frontend checks
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "public/data/**"
      - "public/research-reports/**"
      - "diagnostics/**"
      - ".github/diagnostics/**"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run manual tracking unit tests
        run: |
          python -m unittest \
            tests.test_manual_tracking \
            tests.test_manual_tracking_batch \
            tests.test_manual_tracking_keyword \
            tests.test_manual_tracking_workflow \
            tests.test_tracking_manual_feedback \
            tests.test_expand_tracking_entities \
            tests.test_pipeline_health_runtime
      - name: Run person identity unit tests
        run: python -m unittest tests.test_jensen_canonical_identity_anchor
      - name: Require a normalized automatic source registry
        run: python tools/tracking_source_governance.py --check
      - run: npm ci
      - run: npm run lint
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee unit-test.log
      - name: Upload unit test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: unit-test.log
          retention-days: 3
      - run: npm run test:crawler
      - name: Rebuild tracking-derived snapshot for candidate PR config
        if: github.event_name == 'pull_request'
        run: python tools/enrich_tracking_snapshot.py
      - name: Build Pages candidate or defer a main-only tracking refresh
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set +e
          set -o pipefail
          npm run build:pages 2>&1 | tee /tmp/frontend-build-pages.log
          build_status=${PIPESTATUS[0]}
          set -e

          if [ "$build_status" -eq 0 ]; then
            exit 0
          fi

          # Pull requests remain strict. On main, however, a tracking-config push can
          # legitimately arrive before the long full refresh has committed the matching
          # article snapshot. Pages already treats exactly this signature as deferred.
          if [ "$EVENT_NAME" = "push" ]; then
            tracking_errors="$(grep '^TRACKING_SNAPSHOT_ERROR:' /tmp/frontend-build-pages.log || true)"
            if printf '%s\n' "$tracking_errors" | grep -Fq "tracking configuration is newer than the article snapshot"; then
              unexpected_tracking_errors="$(
                printf '%s\n' "$tracking_errors" \
                  | grep -Fv "tracking configuration is newer than the article snapshot" \
                  | grep -Fv "missing crawler coverage record" \
                  || true
              )"
              if [ -z "$unexpected_tracking_errors" ]; then
                echo "::notice title=Frontend build deferred::Tracking configuration is waiting for Refresh public intelligence; this is not a frontend regression."
                exit 0
              fi
            fi
          fi

          exit "$build_status"

  venture-profile-preflight:
    name: Venture profile preflight (${{ matrix.order }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        order: [production, reversed]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile profile pipeline and regression tests
        run: |
          python -m py_compile \
            tools/company_profile_refresh_queue.py \
            tools/ensure_venture_profile_coverage.py \
            tools/normalize_venture_publication.py \
            tools/guard_venture_cross_field_noise.py \
            tools/stabilize_venture_research_evidence.py \
            tools/stabilize_venture_publication_pipeline.py \
            tools/stabilize_venture_guarded_publication.py \
            tools/crawl_venture_profiles.py \
            tools/enrich_venture_profiles.py \
            tools/publish_verified_company_candidates.py \
            tests/test_verified_company_publication.py \
            tests/test_venture_financing_contract.py
      - name: Run complete profile preflight with shared-rule regressions
        shell: bash
        env:
          TEST_ORDER: ${{ matrix.order }}
        run: |
          set -euo pipefail
          # Mirror the complete preflight in company-profile-incremental-refresh.yml,
          # then include regressions that explicitly install the shared rules.
          modules=(
            tests.test_company_profile_refresh_queue
            tests.test_ensure_venture_profile_coverage
            tests.test_stabilize_venture_research_evidence
            tests.test_stabilize_venture_publication_pipeline
            tests.test_stabilize_venture_guarded_publication
            tests.test_venture_cross_field_guard
            tests.test_venture_profile_extraction
            tests.test_venture_profile_enrichment
            tests.test_venture_profile_postprocess
            tests.test_finalize_venture_profiles
            tests.test_venture_entity_semantics
            tests.test_stabilize_venture_profiles
            tests.test_venture_financing_contract
            tests.test_onboard_company_candidates
            tests.test_prepare_company_candidate_onboarding
            tests.test_entity_resolution_workflow
            tests.test_verified_company_publication
          )
          if [ "$TEST_ORDER" = reversed ]; then
            reverse_modules=()
            for ((i=${#modules[@]}-1; i>=0; i--)); do
              reverse_modules+=("${modules[i]}")
            done
            modules=("${reverse_modules[@]}")
          fi
          python -m unittest -v "${modules[@]}" 2>&1 | tee venture-profile-preflight.log
      - name: Retain profile preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venture-profile-preflight-${{ matrix.order }}
          path: venture-profile-preflight.log
          if-no-files-found: warn
          retention-days: 7
