name: Validate homepage intelligence

on:
  pull_request:
    paths:
      - components/dashboard.tsx
      - components/homepage-channel-updates.tsx
      - components/homepage-news-feed.tsx
      - components/homepage-news-feed.module.css
      - app/page.tsx
      - .github/workflows/refresh-homepage-intelligence.yml
      - .github/workflows/validate-homepage-intelligence.yml
      - .maintenance/homepage-freshness-validation.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile tracking metadata
        run: |
          python3 tools/migrate_article_entities.py
          python3 tools/refine_eastmoney_snapshot.py
          python3 tools/enrich_tracking_snapshot.py
          python3 tools/crawl_articles.py --validate-only
          python3 tools/validate_eastmoney_snapshot.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked project dependencies
        run: npm ci
      - name: Lint homepage implementation
        id: homepage-lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx eslint components/dashboard.tsx components/homepage-channel-updates.tsx components/homepage-news-feed.tsx app/page.tsx 2>&1 | tee homepage-eslint.log
      - name: Upload homepage lint diagnostics
        if: steps.homepage-lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: homepage-eslint-log
          path: homepage-eslint.log
          if-no-files-found: error
      - name: Enforce homepage lint result
        if: steps.homepage-lint.outcome == 'failure'
        run: exit 1
      - name: Type-check application
        run: npx tsc --noEmit
      - name: Build GitHub Pages output
        id: pages-build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build:pages 2>&1 | tee homepage-pages-build.log
      - name: Upload Pages build diagnostics
        if: steps.pages-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: homepage-pages-build-log
          path: homepage-pages-build.log
          if-no-files-found: error
      - name: Enforce Pages build result
        if: steps.pages-build.outcome == 'failure'
        run: exit 1
