name: Validate WeChat and Toutiao

on:
  pull_request:
    paths:
      - tools/crawl_with_wechat_registry.py
      - tools/search_index_feed_redirects.py
      - tools/toutiao_public_feed.py
      - tools/wechat_*.py
      - tools/validate_wechat_toutiao_live.py
      - tools/tracking_taxonomy.py
      - tests/test_crawl_with_wechat_registry.py
      - tests/test_search_index_feed_redirects.py
      - tests/test_toutiao_public_feed.py
      - tests/test_wechat_public_aggregator.py
      - tests/test_wechat_sogou_redirect_compat.py
      - tests/test_wechat_official_index_bridge.py
      - tests/test_wechat_crossplatform_registry.py
      - config/wechat_sources.json
      - config/wechat_public_indexes.json
      - .github/workflows/validate-wechat-toutiao.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-wechat-toutiao-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile focused adapters
        run: |
          python -m py_compile \
            tools/search_index_feed_redirects.py \
            tools/toutiao_public_feed.py \
            tools/wechat_public_aggregator.py \
            tools/wechat_sogou_redirect_compat.py \
            tools/wechat_official_index_bridge.py \
            tools/crawl_with_wechat_registry.py \
            tools/validate_wechat_toutiao_live.py
      - name: Run focused unit tests
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v \
            tests.test_crawl_with_wechat_registry \
            tests.test_search_index_feed_redirects \
            tests.test_toutiao_public_feed \
            tests.test_wechat_public_aggregator \
            tests.test_wechat_sogou_redirect_compat \
            tests.test_wechat_official_index_bridge \
            tests.test_wechat_crossplatform_registry \
            2>&1 | tee focused-unit-tests.log
      - name: Require verified media and Toutiao articles
        id: live
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tools/validate_wechat_toutiao_live.py \
            --output wechat-toutiao-live-report.json \
            2>&1 | tee focused-live-validation.log
      - name: Upload focused validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wechat-toutiao-live-report
          path: |
            focused-unit-tests.log
            focused-live-validation.log
            wechat-toutiao-live-report.json
          if-no-files-found: warn
      - name: Enforce focused validation result
        if: always()
        run: |
          test "${{ steps.unit.outcome }}" = "success"
          test "${{ steps.live.outcome }}" = "success"
