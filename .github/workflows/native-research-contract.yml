name: Native research contract
on:
  pull_request:
    paths:
      - 'tools/native_event_research*.py'
      - 'tools/validate_native_research_reports.py'
      - 'tests/test_native_event_research*.py'
      - 'tests/native-research*.test.ts'
      - 'lib/native-research*.ts'
      - 'lib/research-workspace-handoff.ts'
      - 'app/research-agent/**'
      - 'components/use-native-research-reports.ts'
      - '.github/workflows/native*.yml'
      - 'config/automation_jobs.json'
      - 'config/native_research_event_archives.json'
  push:
    branches: [main]
    paths:
      - 'tools/native_event_research*.py'
      - 'tools/validate_native_research_reports.py'
      - 'tests/test_native_event_research*.py'
      - 'tests/native-research*.test.ts'
      - 'lib/native-research*.ts'
      - '.github/workflows/native*.yml'
      - 'config/native_research_event_archives.json'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: python -m unittest discover -s tests -p 'test_native_event_research*.py'
      - run: node --import tsx --test tests/native-research-flow.test.ts tests/native-research-event-archive.test.ts tests/research-workspace-handoff.test.ts tests/research-investigation-event-consistency.test.ts
      - run: python tools/validate_native_research_reports.py
      - name: Build auditable control-plane bootstrap (no model execution)
        run: |
          python tools/run_pipeline.py refresh --lineage-output work/native-control/data_lineage.json --health-output work/native-control/pipeline_health.json
          python tools/run_pipeline.py check --lineage work/native-control/data_lineage.json --health work/native-control/pipeline_health.json
      - name: Retain canonical control-plane bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: native-control-plane-bootstrap
          path: work/native-control/*.json
          retention-days: 3
      - name: Require committed control-plane coverage
        run: python tools/run_pipeline.py check
