name: One-time source governance freshness query verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-source-governance-validation.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate one low-rate freshness-biased query per account
        run: |
          python - <<'PY'
          import json
          from datetime import UTC, datetime
          from tools import crawl_with_wechat_registry as app

          base = app.base
          crawler = base.tracking.crawler
          app.http_policy_bridge.install(crawler)
          app.wechat_registry_bridge.install(app.wechat_public_sources)

          tracking_config = base.tracking.load_tracking()
          tracks = base.tracking._enabled_tracks(tracking_config)
          specs = app.wechat_public_sources.generated_wechat_sources(tracks, base.tracking)
          targets = {
              "user-track-wechat-cbea-battery-energy",
              "user-track-wechat-chiptrend-ic-semiconductor",
              "user-track-wechat-eefocus-semiconductor",
              "user-track-wechat-gg-lithium-energy",
              "user-track-wechat-gg-robot-robotics",
              "user-track-wechat-icbank-semiconductor",
              "user-track-wechat-ijiwei-semiconductor",
              "user-track-wechat-robospeak-robotics",
              "user-track-wechat-semiconductor-technology-semiconductor",
          }
          selected = [s for s in specs if s.get("id") in targets]
          print("SELECTED_COUNT", len(selected))
          now = datetime.now(UTC)

          for spec in selected:
              identity = str(spec.get("queryIdentity") or spec.get("name") or "")
              query = f"{identity} {now.year} {now.month}月"
              url = app.wechat_sogou_index.build_search_url(spec, query=query)
              try:
                  body = app.wechat_sogou_index._request(url)
                  rows = app.wechat_sogou_index.parse_search_results(body, url)
                  print("FRESH_QUERY " + json.dumps({
                      "id": spec.get("id"),
                      "name": spec.get("name"),
                      "query": query,
                      "count": len(rows),
                      "dates": [r.get("publishedAt") for r in rows],
                      "titles": [r.get("title") for r in rows[:5]],
                  }, ensure_ascii=False, sort_keys=True))
              except Exception as exc:
                  print("FRESH_ERROR " + json.dumps({
                      "id": spec.get("id"), "name": spec.get("name"),
                      "query": query, "error": f"{type(exc).__name__}: {exc}",
                  }, ensure_ascii=False, sort_keys=True))
          PY