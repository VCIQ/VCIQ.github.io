name: One-time source governance endpoint verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-source-governance-validation.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect public publisher search contract
        run: |
          python - <<'PY'
          import html
          import json
          import re
          from urllib.parse import quote, urljoin
          from tools import crawl_articles as crawler

          ROOT = "https://www.jintiankansha.com/"
          publishers = [
              "高工机器人", "机器人大讲堂", "集微网", "半导体行业观察", "半导体技术",
              "芯潮IC", "与非网", "高工锂电", "电池中国",
          ]

          def clean(value):
              return re.sub(r"\s+", " ", html.unescape(re.sub(r"(?is)<[^>]+>", " ", value or ""))).strip()

          home = crawler.fetch_text(ROOT, crawler.DEFAULT_USER_AGENT)
          form = re.search(r'(?is)<form\b[^>]*action=["\']/search["\'][^>]*>.*?</form>', home or "")
          if form:
              raw = form.group(0)
              inputs = []
              for tag in re.findall(r"(?is)<input\b[^>]*>", raw):
                  attrs = {}
                  for key, _, quoted, bare in re.findall(r'''(?is)([\w:-]+)\s*=\s*(["'])(.*?)\2|([\w:-]+)\s*=\s*([^\s>]+)''', tag):
                      pass
                  def attr(name):
                      m = re.search(rf'''(?is)\b{name}\s*=\s*(?:["']([^"']*)["']|([^\s>]+))''', tag)
                      return (m.group(1) if m and m.group(1) is not None else m.group(2) if m else "")
                  inputs.append({
                      "name": attr("name"),
                      "type": attr("type"),
                      "value": html.unescape(attr("value")),
                      "placeholder": html.unescape(attr("placeholder")),
                  })
              print("SEARCH_FORM_RAW " + json.dumps({"html": clean(raw)[:3000], "inputs": inputs}, ensure_ascii=False, sort_keys=True))

          variants = [
              ("omitted", ""),
              ("column", "column"),
              ("article", "article"),
              ("0", "0"),
              ("1", "1"),
              ("2", "2"),
          ]

          for publisher in publishers:
              for label, search_type in variants:
                  params = f"keyword={quote(publisher)}"
                  if search_type:
                      params += f"&search_type={quote(search_type)}"
                  url = ROOT.rstrip("/") + "/search?" + params
                  try:
                      body = crawler.fetch_text(url, crawler.DEFAULT_USER_AGENT)
                  except Exception as exc:
                      print("SEARCH_ERROR " + json.dumps({"publisher": publisher, "variant": label, "error": f"{type(exc).__name__}: {exc}"}, ensure_ascii=False, sort_keys=True))
                      continue

                  columns = []
                  for match in re.finditer(r'''(?is)<a\b([^>]*)href=["']([^"']*/column/[A-Za-z0-9_-]+[^"']*)["']([^>]*)>(.*?)</a>''', body or ""):
                      href = urljoin(url, html.unescape(match.group(2)))
                      text = clean(match.group(4))
                      if href not in [item["url"] for item in columns]:
                          columns.append({"url": href, "text": text})
                  details = []
                  for match in re.finditer(r'''(?is)<a\b([^>]*)href=["']([^"']*/t/[A-Za-z0-9_-]+[^"']*)["']([^>]*)>(.*?)</a>''', body or ""):
                      href = urljoin(url, html.unescape(match.group(2)))
                      text = clean(match.group(4))
                      if href not in [item["url"] for item in details]:
                          details.append({"url": href, "text": text})

                  page_title = clean(re.search(r"(?is)<title[^>]*>(.*?)</title>", body).group(1)) if re.search(r"(?is)<title[^>]*>(.*?)</title>", body or "") else ""
                  print("SEARCH_RESULT " + json.dumps({
                      "publisher": publisher,
                      "variant": label,
                      "url": url,
                      "bytes": len(body or ""),
                      "pageTitle": page_title,
                      "columnCount": len(columns),
                      "columns": columns[:8],
                      "detailCount": len(details),
                      "details": details[:5],
                  }, ensure_ascii=False, sort_keys=True))
                  if columns:
                      break
          PY