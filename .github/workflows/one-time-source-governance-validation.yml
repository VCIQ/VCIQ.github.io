name: One-time source governance endpoint verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-source-governance-validation.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect Sogou result accounts against WeChat originals
        run: |
          python - <<'PY'
          import json
          from tools import crawl_articles as crawler
          from tools import wechat_public_sources as wechat
          from tools import wechat_sogou_index as sogou
          from tools import wechat_source_registry as registry

          cases = [
              {"name": "高工机器人", "sector": "机器人", "keywords": ["机器人", "具身智能"]},
              {"name": "电池中国", "sector": "能源", "keywords": ["电池", "储能"]},
              {"name": "量子位", "sector": "人工智能", "keywords": ["人工智能", "大模型"]},
          ]

          for case in cases:
              spec = {
                  "id": "diagnostic-" + case["name"],
                  "name": case["name"],
                  "expectedAccounts": [case["name"]],
                  "queryIdentity": case["name"],
                  "sector": case["sector"],
                  "keywords": case["keywords"],
                  "maxItems": 6,
                  "maxArticleAgeDays": 45,
              }
              rows, meta = sogou.discover(spec)
              print("CASE_META " + json.dumps({"name": case["name"], **meta}, ensure_ascii=False, sort_keys=True))
              for index, row in enumerate(rows[:5]):
                  direct = str(row.get("directUrl") or "")
                  page_account = ""
                  page_title = ""
                  blocked = None
                  fetch_error = None
                  if direct:
                      try:
                          body = wechat.fetch_public_wechat_page(direct)
                          parser = wechat.WeChatPageParser()
                          parser.feed(body or "")
                          page_account = parser.account or wechat._js_value(
                              body or "", ("nickname", "profile_nickname", "account_name")
                          )
                          page_title = (
                              parser.meta.get("og:title")
                              or parser.meta.get("twitter:title")
                              or parser.title
                              or wechat._js_value(body or "", ("msg_title", "title"))
                          )
                          blocked = any(marker in body for marker in wechat.BLOCK_PAGE_MARKERS)
                      except Exception as exc:
                          fetch_error = f"{type(exc).__name__}: {exc}"
                  print(
                      "ROW_DIAGNOSTIC "
                      + json.dumps(
                          {
                              "queryName": case["name"],
                              "index": index,
                              "searchTitle": row.get("title"),
                              "searchAccount": row.get("account"),
                              "directUrl": direct,
                              "pageAccount": page_account,
                              "pageTitle": page_title,
                              "accountMatches": registry.account_matches(spec, page_account),
                              "blocked": blocked,
                              "fetchError": fetch_error,
                          },
                          ensure_ascii=False,
                          sort_keys=True,
                      )
                  )
          PY