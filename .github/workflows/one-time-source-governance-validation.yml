name: One-time source governance endpoint verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-source-governance-validation.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect public publisher search contract
        run: |
          python - <<'PY'
          import html
          import json
          import re
          from urllib.parse import quote, urljoin
          from tools import crawl_articles as crawler

          ROOT = "https://www.jintiankansha.com/"
          publishers = [
              "高工机器人", "机器人大讲堂", "集微网", "半导体行业观察", "半导体技术",
              "芯潮IC", "与非网", "高工锂电", "电池中国",
          ]

          def clean(value):
              return re.sub(r"\s+", " ", html.unescape(re.sub(r"(?is)<[^>]+>", " ", value or ""))).strip()

          def attr(tag, name):
              m = re.search(rf'''(?is)\b{name}\s*=\s*(?:["']([^"']*)["']|([^\s>]+))''', tag)
              if not m:
                  return ""
              return m.group(1) if m.group(1) is not None else m.group(2)

          home = crawler.fetch_text(ROOT, crawler.DEFAULT_USER_AGENT)
          form = re.search(r'''(?is)<form\b[^>]*action=["']/search["'][^>]*>.*?</form>''', home or "")
          hidden_default = ""
          if form:
              raw = form.group(0)
              inputs = []
              for tag in re.findall(r"(?is)<input\b[^>]*>", raw):
                  item = {
                      "name": attr(tag, "name"),
                      "type": attr(tag, "type"),
                      "value": html.unescape(attr(tag, "value")),
                      "placeholder": html.unescape(attr(tag, "placeholder")),
                  }
                  inputs.append(item)
                  if item["name"] == "search_type":
                      hidden_default = item["value"]
              print("SEARCH_FORM_RAW " + json.dumps({
                  "html": re.sub(r"\s+", " ", raw)[:4000],
                  "inputs": inputs,
                  "hiddenDefault": hidden_default,
              }, ensure_ascii=False, sort_keys=True))

          variants = [("omitted", "")]
          if hidden_default:
              variants.append(("hidden-default", hidden_default))
          variants.extend([
              ("column", "column"),
              ("article", "article"),
              ("0", "0"),
              ("1", "1"),
              ("2", "2"),
          ])
          deduped_variants = []
          seen_variants = set()
          for label, value in variants:
              key = value
              if key in seen_variants:
                  continue
              seen_variants.add(key)
              deduped_variants.append((label, value))

          for publisher in publishers:
              found = False
              for label, search_type in deduped_variants:
                  params = f"keyword={quote(publisher)}"
                  if search_type:
                      params += f"&search_type={quote(search_type)}"
                  url = ROOT.rstrip("/") + "/search?" + params
                  try:
                      body = crawler.fetch_text(url, crawler.DEFAULT_USER_AGENT)
                  except Exception as exc:
                      print("SEARCH_ERROR " + json.dumps({
                          "publisher": publisher,
                          "variant": label,
                          "error": f"{type(exc).__name__}: {exc}",
                      }, ensure_ascii=False, sort_keys=True))
                      continue

                  columns = []
                  seen_columns = set()
                  for match in re.finditer(r'''(?is)<a\b([^>]*)href=["']([^"']*/column/[A-Za-z0-9_-]+[^"']*)["']([^>]*)>(.*?)</a>''', body or ""):
                      href = urljoin(url, html.unescape(match.group(2)))
                      if href in seen_columns:
                          continue
                      seen_columns.add(href)
                      columns.append({"url": href, "text": clean(match.group(4))})

                  details = []
                  seen_details = set()
                  for match in re.finditer(r'''(?is)<a\b([^>]*)href=["']([^"']*/t/[A-Za-z0-9_-]+[^"']*)["']([^>]*)>(.*?)</a>''', body or ""):
                      href = urljoin(url, html.unescape(match.group(2)))
                      if href in seen_details:
                          continue
                      seen_details.add(href)
                      details.append({"url": href, "text": clean(match.group(4))})

                  title_match = re.search(r"(?is)<title[^>]*>(.*?)</title>", body or "")
                  result = {
                      "publisher": publisher,
                      "variant": label,
                      "url": url,
                      "bytes": len(body or ""),
                      "pageTitle": clean(title_match.group(1)) if title_match else "",
                      "columnCount": len(columns),
                      "columns": columns[:10],
                      "detailCount": len(details),
                      "details": details[:5],
                  }
                  print("SEARCH_RESULT " + json.dumps(result, ensure_ascii=False, sort_keys=True))
                  if columns:
                      found = True
                      break
              print("SEARCH_FINAL " + json.dumps({
                  "publisher": publisher,
                  "foundColumn": found,
              }, ensure_ascii=False, sort_keys=True))
          PY