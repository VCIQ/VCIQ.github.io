name: One-time source governance endpoint verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-source-governance-validation.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test recent publisher-only Sogou queries
        run: |
          python - <<'PY'
          import html
          import json
          import re
          from urllib.parse import quote
          from tools import wechat_sogou_index as sogou
          from tools import wechat_source_registry as registry

          publishers = ["高工机器人", "半导体技术", "电池中国"]

          def clean(value):
              return re.sub(r"\s+", " ", html.unescape(re.sub(r"(?is)<[^>]+>", " ", value or ""))).strip()

          for publisher in publishers:
              spec = {"expectedAccounts": [publisher]}
              variants = {
                  "default": f"https://weixin.sogou.com/weixin?type=2&s_from=input&query={quote(publisher)}&ie=utf8&page=1",
                  "recent": f"https://weixin.sogou.com/weixin?type=2&s_from=input&query={quote(publisher)}&ie=utf8&page=1&tsn=1",
              }
              for label, url in variants.items():
                  try:
                      body = sogou._request(url)
                  except Exception as exc:
                      print("RECENT_QUERY_ERROR " + json.dumps({
                          "publisher": publisher,
                          "variant": label,
                          "error": f"{type(exc).__name__}: {exc}",
                      }, ensure_ascii=False, sort_keys=True))
                      continue
                  rows = []
                  for index, block in enumerate(sogou._result_blocks(body)):
                      account = clean(sogou._first_match(
                          r'<span[^>]*class="[^"]*all-time-y2[^"]*"[^>]*>(.*?)</span>', block
                      ))
                      title = clean(sogou._first_match(
                          r'<a(?=[^>]*(?:id="sogou_vr_11002601_title_\d+"|uigs="article_title_\d+"))[^>]*>(.*?)</a>', block
                      ))
                      timestamp = (
                          sogou._first_match(r"timeConvert\(\s*['\"]?(\d{10,13})['\"]?\s*\)", block)
                          or sogou._first_match(r'\b(?:t|time)="(\d{10,13})"', block)
                      )
                      rows.append({
                          "index": index,
                          "title": title,
                          "account": account,
                          "matched": registry.account_matches(spec, account),
                          "timestamp": timestamp,
                      })
                  print("RECENT_QUERY_SUMMARY " + json.dumps({
                      "publisher": publisher,
                      "variant": label,
                      "resultCount": len(rows),
                      "matchedCount": sum(row["matched"] for row in rows),
                      "rows": rows,
                  }, ensure_ascii=False, sort_keys=True))
          PY