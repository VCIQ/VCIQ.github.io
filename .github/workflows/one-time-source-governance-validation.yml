name: One-time source governance public-index title verification

on:
  push:
    branches:
      - fix/wechat-public-index-title-fallback
    paths:
      - ".github/workflows/one-time-source-governance-validation.yml"
      - "tools/crawl_articles.py"
      - "tools/refresh_wechat_snapshot.py"
      - "tools/wechat_public_index_title_fallback.py"
      - "tools/wechat_public_sources.py"
      - "tools/wechat_fetch_compat.py"
      - "tools/wechat_registry_bridge.py"
      - "tools/wechat_source_registry.py"
      - "tools/wechat_index_context_guard.py"
      - "tools/wechat_original_redirect_bridge.py"
      - "tools/wechat_public_aggregator.py"
      - "tools/wechat_sogou_bridge.py"
      - "tools/wechat_sogou_index.py"
      - "tools/wechat_sogou_link_compat.py"
      - "tools/wechat_sogou_redirect_compat.py"
      - "tools/wechat_url_compat.py"
      - "tools/crawl_with_wechat_registry.py"
      - "config/wechat_public_indexes.json"
      - "tests/test_crawler.py"
      - "tests/test_wechat_public_index_title_fallback.py"
      - "tests/test_wechat_public_index_fallback.py"
      - "tests/test_wechat_registry_bridge.py"
      - "tests/test_wechat_original_redirect_bridge.py"
      - "tests/test_wechat_public_aggregator.py"
      - "tests/test_wechat_sogou_bridge.py"
      - "tests/test_wechat_sogou_redirect_compat.py"
      - "tests/test_wechat_fetch_compat.py"
      - "tests/test_wechat_source_registry.py"
      - "tests/test_refresh_wechat_snapshot.py"
      - "tests/test_crawl_with_wechat_registry.py"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and validate title and URL helpers
        run: |
          python -m py_compile \
            tools/crawl_articles.py \
            tools/refresh_wechat_snapshot.py \
            tools/wechat_fetch_compat.py \
            tools/wechat_index_context_guard.py \
            tools/wechat_original_redirect_bridge.py \
            tools/wechat_public_aggregator.py \
            tools/wechat_public_index_title_fallback.py \
            tools/wechat_registry_bridge.py \
            tools/wechat_sogou_bridge.py \
            tools/wechat_sogou_link_compat.py \
            tools/wechat_sogou_redirect_compat.py \
            tools/wechat_url_compat.py \
            tools/crawl_with_wechat_registry.py
          python -m unittest \
            tests.test_crawler.CrawlerTests.test_normalize_url_preserves_signed_timestamp_query \
            tests.test_wechat_public_index_title_fallback \
            tests.test_wechat_public_index_fallback \
            tests.test_wechat_registry_bridge \
            tests.test_wechat_original_redirect_bridge \
            tests.test_wechat_public_aggregator \
            tests.test_wechat_sogou_bridge \
            tests.test_wechat_sogou_redirect_compat \
            tests.test_wechat_fetch_compat \
            tests.test_wechat_source_registry \
            tests.test_refresh_wechat_snapshot \
            tests.test_crawl_with_wechat_registry
          python - <<'PY'
          from urllib.parse import parse_qs, urlsplit

          from tools import crawl_articles
          from tools import wechat_public_index_title_fallback as fallback
          from tools import wechat_sogou_redirect_compat as redirect

          robot = "进击的微米级战场：手术机器人的国产化下半场，谁在“硬卡”我们的脖子？"
          icbank = "独家丨腾讯芯片一号位，离职创业，投身AI CPU"
          variants_robot = fallback._query_variants(robot)
          variants_icbank = fallback._query_variants(icbank)
          print("ROBOT_VARIANTS", variants_robot)
          print("ICBANK_VARIANTS", variants_icbank)
          assert len(variants_robot) == 2
          assert any("手术机器人" in query for query in variants_robot)
          assert len(variants_icbank) == 2
          assert any("腾讯芯片" in query for query in variants_icbank)

          expected = "投资10亿元的具身机器人制造基地落地常州；宇树发布9900元7轴力控臂；超150款新品WRC集中发布 | 市场观察"
          sogou = "投资10亿元的具身机器人制造基地落地常州;宇树发布9900元7轴力控臂;超 1 50款新品WRC集中发布 | 市场观察"
          false_match = "四万字详解：这家来自荷兰的企业，是如何拿捏芯片制造命脉的？"
          good = fallback._title_score(expected, sogou, expected[:30])
          bad = fallback._title_score(robot, false_match, variants_robot[-1])
          print("TITLE_SCORES", {"good": good, "bad": bad})
          assert good >= fallback.MIN_TITLE_SCORE
          assert bad < fallback.MIN_TITLE_SCORE

          signed = "https://mp.weixin.qq.com/s?src=11&timestamp=1788018564&ver=6934&signature=a%2Ab"
          escaped = "https://mp.weixin.qq.com/s?src=11&amp;timestamp=1788018564&amp;ver=6934&amp;signature=a%2Ab"
          decoded_signed = redirect._decode(signed)
          decoded_escaped = redirect._decode(escaped)
          normalized_signed = crawl_articles.normalize_url(decoded_signed)
          normalized_escaped = crawl_articles.normalize_url(decoded_escaped)
          print("SIGNED_URL", normalized_signed)
          print("ESCAPED_URL", normalized_escaped)
          for value in (normalized_signed, normalized_escaped):
              query = parse_qs(urlsplit(value).query, keep_blank_values=True)
              assert query["src"] == ["11"]
              assert query["timestamp"] == ["1788018564"]
              assert query["ver"] == ["6934"]
              assert query["signature"] == ["a*b"]
              assert "×tamp" not in value
              assert "%C3%97" not in value.upper()
          PY
      - name: Require productive crawls for all nine WeChat endpoints
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import UTC, datetime, timedelta
          from urllib.parse import parse_qsl, urlsplit

          from tools import crawl_with_wechat_registry as app
          from tools import wechat_source_registry

          def safe_url(value):
              raw = str(value or "")
              parts = urlsplit(raw)
              path = parts.path
              if (parts.hostname or "").casefold() == "mp.weixin.qq.com" and path.startswith("/s/"):
                  path = "/s/<redacted>"
              return {
                  "location": f"{parts.scheme}://{parts.netloc}{path}",
                  "queryKeys": sorted({key for key, _value in parse_qsl(parts.query, keep_blank_values=True)}),
                  "sha256": hashlib.sha256(raw.encode("utf-8")).hexdigest()[:12],
              }

          base = app.base
          crawler = base.tracking.crawler
          app.http_policy_bridge.install(crawler)
          app.wechat_fetch_compat.install(app.wechat_public_sources)
          app.wechat_registry_bridge.install(app.wechat_public_sources)
          app.wechat_original_redirect_bridge.install(
              app.wechat_public_sources,
              app.wechat_registry_bridge,
          )
          app.wechat_index_context_guard.install(app.wechat_registry_bridge)
          app.wechat_index_record_fallback.install(
              app.wechat_public_sources,
              app.wechat_registry_bridge,
          )
          app.wechat_sogou_redirect_compat.install(app.wechat_sogou_index)
          app.wechat_sogou_link_compat.install(app.wechat_sogou_index)
          app.wechat_public_index_title_fallback.install(
              app.wechat_registry_bridge,
              app.wechat_sogou_index,
          )
          app.wechat_public_aggregator.install(app.wechat_sogou_index)
          app.wechat_sogou_bridge.install(app.wechat_public_sources)

          tracking_config = base.tracking.load_tracking()
          tracks = base.tracking._enabled_tracks(tracking_config)
          specs = app.wechat_public_sources.generated_wechat_sources(tracks, base.tracking)
          targets = {
              "user-track-wechat-robospeak-robotics",
              "user-track-wechat-gg-robot-robotics",
              "user-track-wechat-icbank-semiconductor",
              "user-track-wechat-ijiwei-semiconductor",
              "user-track-wechat-icsmart-semiconductor",
              "user-track-wechat-eetop-semiconductor",
              "user-track-wechat-icrank-semiconductor",
              "user-track-wechat-gg-lithium-energy",
              "user-track-wechat-cbea-battery-energy",
          }
          spec_by_id = {spec.get("id"): spec for spec in specs}
          missing = sorted(targets - spec_by_id.keys())
          assert not missing, f"Missing configured WeChat sources: {missing}"

          statuses = {}
          current_articles = {}
          for source_id in sorted(targets):
              spec = spec_by_id[source_id]
              try:
                  articles, status = app.wechat_public_sources.crawl_wechat_source(
                      spec,
                      crawler.DEFAULT_USER_AGENT,
                      crawler,
                  )
              except Exception as exc:
                  articles = []
                  status = {
                      "id": source_id,
                      "name": spec.get("name"),
                      "status": "error",
                      "scanned": 0,
                      "accepted": 0,
                      "error": f"{type(exc).__name__}: {exc}",
                  }
              statuses[source_id] = status
              current_articles[source_id] = articles
              print("ENDPOINT_CRAWL " + json.dumps({
                  "id": source_id,
                  "name": spec.get("name"),
                  "publicIndexUrls": spec.get("publicIndexUrls"),
                  "status": status,
                  "articles": [
                      {
                          "title": article.get("title"),
                          "publishedAt": article.get("publishedAt"),
                          "wechatAccount": article.get("wechatAccount"),
                          "sourceUrl": safe_url((article.get("source") or {}).get("url")),
                      }
                      for article in articles[:3]
                  ],
              }, ensure_ascii=False, sort_keys=True), flush=True)

          unhealthy = {
              source_id: {
                  "status": statuses[source_id].get("status"),
                  "scanned": statuses[source_id].get("scanned", 0),
                  "accepted": statuses[source_id].get("accepted", 0),
                  "error": statuses[source_id].get("error"),
              }
              for source_id in sorted(targets)
              if int(statuses[source_id].get("scanned", 0) or 0) <= 0
              or int(statuses[source_id].get("accepted", 0) or 0) <= 0
          }
          contract_violations = {
              source_id: {
                  "articleCount": len(current_articles[source_id]),
                  "status": statuses[source_id].get("status"),
                  "scanned": statuses[source_id].get("scanned", 0),
                  "accepted": statuses[source_id].get("accepted", 0),
                  "retainedPrevious": bool(statuses[source_id].get("retainedPrevious")),
              }
              for source_id in sorted(targets)
              if len(current_articles[source_id]) <= 0
              or int(statuses[source_id].get("accepted", 0) or 0) != len(current_articles[source_id])
              or int(statuses[source_id].get("scanned", 0) or 0) < int(statuses[source_id].get("accepted", 0) or 0)
              or statuses[source_id].get("status") not in {"ok", "partial"}
              or bool(statuses[source_id].get("retainedPrevious"))
          }
          budget_violations = {
              source_id: {
                  "queries": int(spec_by_id[source_id].get("_publicIndexTitleSearchQueries", 0) or 0),
                  "redirects": int(spec_by_id[source_id].get("_publicIndexTitleRedirectAttempts", 0) or 0),
                  "titles": list(spec_by_id[source_id].get("_publicIndexTitleLookupTitles", [])),
                  "failureKinds": list(spec_by_id[source_id].get("_publicIndexTitleFailureKinds", [])),
                  "candidateAccounts": list(spec_by_id[source_id].get("_publicIndexTitleCandidateAccounts", [])),
                  "accountMismatches": int(spec_by_id[source_id].get("_publicIndexTitleAccountMismatches", 0) or 0),
                  "fetchFailureKinds": list(statuses[source_id].get("publicIndexOriginalFetchFailureKinds", [])),
                  "articleRejectKinds": list(statuses[source_id].get("publicIndexArticleRejectKinds", [])),
                  "observedAccounts": list(statuses[source_id].get("publicIndexObservedAccounts", [])),
              }
              for source_id in sorted(targets)
              if int(spec_by_id[source_id].get("_publicIndexTitleSearchQueries", 0) or 0) > 2
              or int(spec_by_id[source_id].get("_publicIndexTitleRedirectAttempts", 0) or 0) > 2
          }
          verification_violations = {}
          today = datetime.now(UTC).date()
          # Inspect only the current-run article lists captured above; retained
          # snapshot data never participates in these acceptance assertions.
          for source_id, articles in current_articles.items():
              spec = spec_by_id[source_id]
              max_age = max(1, int(spec.get("maxArticleAgeDays", 45) or 45))
              reasons = []
              for article in articles:
                  source_url = str((article.get("source") or {}).get("url") or "")
                  parts = urlsplit(source_url)
                  path = parts.path.rstrip("/")
                  if parts.scheme.casefold() != "https" or (parts.hostname or "").casefold() != "mp.weixin.qq.com" or not (
                      path == "/s" or path.startswith("/s/")
                  ):
                      reasons.append("not_original_wechat_url")
                  if article.get("wechatContentMode") != "original-page":
                      reasons.append("not_original_page_content")
                  try:
                      published = datetime.fromisoformat(str(article.get("publishedAt") or "")).date()
                  except ValueError:
                      reasons.append("missing_original_date")
                  else:
                      if published < today - timedelta(days=max_age):
                          reasons.append("stale_original_date")
                      if published > today + timedelta(days=1):
                          reasons.append("future_original_date")
                  if not wechat_source_registry.account_matches(
                      spec,
                      str(article.get("wechatAccount") or ""),
                  ):
                      reasons.append("account_mismatch")
                  if not (
                      article.get("mentionedCompanies")
                      or article.get("mentionedPeople")
                      or article.get("matchedTrackingTerms")
                  ):
                      reasons.append("entity_irrelevant")
              if reasons:
                  verification_violations[source_id] = sorted(set(reasons))
          print("NINE_ENDPOINT_HEALTH " + json.dumps({
              source_id: {
                  "scanned": statuses[source_id].get("scanned", 0),
                  "accepted": statuses[source_id].get("accepted", 0),
                  "status": statuses[source_id].get("status"),
              }
              for source_id in sorted(targets)
          }, ensure_ascii=False, sort_keys=True), flush=True)
          print("TITLE_LOOKUP_BUDGET " + json.dumps({
              source_id: {
                  "queries": int(spec_by_id[source_id].get("_publicIndexTitleSearchQueries", 0) or 0),
                  "redirects": int(spec_by_id[source_id].get("_publicIndexTitleRedirectAttempts", 0) or 0),
                  "titles": list(spec_by_id[source_id].get("_publicIndexTitleLookupTitles", [])),
                  "failureKinds": list(spec_by_id[source_id].get("_publicIndexTitleFailureKinds", [])),
                  "candidateAccounts": list(spec_by_id[source_id].get("_publicIndexTitleCandidateAccounts", [])),
                  "accountMismatches": int(spec_by_id[source_id].get("_publicIndexTitleAccountMismatches", 0) or 0),
                  "fetchFailureKinds": list(statuses[source_id].get("publicIndexOriginalFetchFailureKinds", [])),
                  "articleRejectKinds": list(statuses[source_id].get("publicIndexArticleRejectKinds", [])),
                  "observedAccounts": list(statuses[source_id].get("publicIndexObservedAccounts", [])),
              }
              for source_id in sorted(targets)
          }, ensure_ascii=False, sort_keys=True), flush=True)
          assert not budget_violations, (
              "Per-source title lookup and redirect budgets must stay <= 2: "
              + json.dumps(budget_violations, ensure_ascii=False, sort_keys=True)
          )
          assert not contract_violations, (
              "Current-run articles and crawl statuses must agree: "
              + json.dumps(contract_violations, ensure_ascii=False, sort_keys=True)
          )
          assert not verification_violations, (
              "Accepted rows must pass original URL/date/account/entity checks: "
              + json.dumps(verification_violations, ensure_ascii=False, sort_keys=True)
          )
          assert not unhealthy, (
              "Each target must satisfy scanned > 0 and accepted > 0: "
              + json.dumps(unhealthy, ensure_ascii=False, sort_keys=True)
          )
          PY
