name: One-time source governance recent candidate verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-source-governance-validation.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect recent target candidates only
        run: |
          python - <<'PY'
          import json
          from tools import crawl_with_wechat_registry as app
          from tools import wechat_source_registry

          base = app.base
          crawler = base.tracking.crawler
          app.http_policy_bridge.install(crawler)
          app.wechat_fetch_compat.install(app.wechat_public_sources)
          app.wechat_registry_bridge.install(app.wechat_public_sources)
          app.wechat_sogou_redirect_compat.install(app.wechat_sogou_index)
          app.wechat_sogou_link_compat.install(app.wechat_sogou_index)

          tracking_config = base.tracking.load_tracking()
          tracks = base.tracking._enabled_tracks(tracking_config)
          specs = app.wechat_public_sources.generated_wechat_sources(tracks, base.tracking)
          target_ids = {
              "user-track-wechat-robospeak-robotics",
              "user-track-wechat-gg-robot-robotics",
          }

          for spec in [s for s in specs if s.get("id") in target_ids]:
              rows, meta = app.wechat_sogou_index.discover(spec)
              print("DISCOVERY_META " + json.dumps({
                  "id": spec.get("id"),
                  "name": spec.get("name"),
                  **meta,
              }, ensure_ascii=False, sort_keys=True))
              recent_count = 0
              for i, row in enumerate(rows):
                  recent = app.wechat_sogou_bridge._is_recent(
                      row.get("publishedAt"), int(spec.get("maxArticleAgeDays", 45)), crawler
                  )
                  print("ROW_DATE " + json.dumps({
                      "id": spec.get("id"), "i": i,
                      "title": row.get("title"),
                      "publishedAt": row.get("publishedAt"),
                      "recent": recent,
                      "searchAccount": row.get("account"),
                      "hasDirect": bool(row.get("directUrl")),
                  }, ensure_ascii=False, sort_keys=True))
                  if not recent or not row.get("directUrl"):
                      continue
                  recent_count += 1
                  info = {"id": spec.get("id"), "i": i, "title": row.get("title")}
                  try:
                      body = app.wechat_public_sources.fetch_public_wechat_page(str(row["directUrl"]))
                      parser = app.wechat_public_sources.WeChatPageParser()
                      parser.feed(body or "")
                      observed = parser.account or app.wechat_public_sources._js_value(
                          body or "", ("nickname", "profile_nickname", "account_name")
                      )
                      companies, people, keywords = app.wechat_public_sources._relevance_entities(
                          parser.title or str(row.get("title") or ""),
                          str(row.get("summary") or ""),
                          parser.content,
                          spec,
                          crawler,
                      )
                      info.update({
                          "observedAccount": observed,
                          "accountMatch": wechat_source_registry.account_matches(spec, observed),
                          "pageTitle": parser.title,
                          "contentChars": len(parser.content),
                          "matchedCompanies": companies,
                          "matchedPeople": people,
                          "matchedKeywords": keywords,
                      })
                  except Exception as exc:
                      info["fetchError"] = f"{type(exc).__name__}: {exc}"
                  print("RECENT_FETCH " + json.dumps(info, ensure_ascii=False, sort_keys=True))
              print("RECENT_COUNT " + json.dumps({"id": spec.get("id"), "count": recent_count}, ensure_ascii=False))
          PY