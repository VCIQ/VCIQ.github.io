name: One-time source governance account-search verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-source-governance-validation.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect public Sogou account-search result shape
        run: |
          python - <<'PY'
          import html
          import json
          import re
          from urllib.parse import quote
          from tools import crawl_with_wechat_registry as app

          app.http_policy_bridge.install(app.base.tracking.crawler)
          for account in ["机器人大讲堂", "高工机器人"]:
              url = f"https://weixin.sogou.com/weixin?type=1&s_from=input&query={quote(account)}&ie=utf8"
              try:
                  body = app.wechat_sogou_index._request(url)
              except Exception as exc:
                  print("ACCOUNT_SEARCH_ERROR " + json.dumps({"account": account, "error": f"{type(exc).__name__}: {exc}"}, ensure_ascii=False))
                  continue
              print("ACCOUNT_PAGE " + json.dumps({
                  "account": account,
                  "bytes": len(body),
                  "antispider": "antispider" in body.casefold(),
                  "captcha": "验证码" in body,
                  "accountMarkers": body.count("account_name_"),
                  "profileMarkers": body.count("weixin_account"),
                  "articleTitleMarkers": body.count("article_title_"),
              }, ensure_ascii=False, sort_keys=True))
              anchors = re.findall(r'(?is)<a\b([^>]*)>(.*?)</a>', body)
              shown = 0
              for attrs, inner in anchors:
                  text = re.sub(r'(?is)<[^>]+>', ' ', inner)
                  text = re.sub(r'\s+', ' ', html.unescape(text)).strip()
                  hrefm = re.search(r'''href\s*=\s*["']([^"']+)["']''', attrs, flags=re.I)
                  href = html.unescape(hrefm.group(1)) if hrefm else ""
                  hay = (text + " " + attrs + " " + href).casefold()
                  if account in text or "account" in hay or "profile" in hay or "/link?" in href or "mp.weixin.qq.com" in href:
                      print("ACCOUNT_ANCHOR " + json.dumps({
                          "account": account,
                          "text": text[:300],
                          "href": href[:800],
                          "attrs": re.sub(r'\s+', ' ', attrs).strip()[:800],
                      }, ensure_ascii=False, sort_keys=True))
                      shown += 1
                      if shown >= 25:
                          break
              for marker in ["最近文章", "最新文章", "认证", "微信号", "月发文", "last_article", "recent"]:
                  if marker.casefold() in body.casefold():
                      print("ACCOUNT_MARKER " + json.dumps({"account": account, "marker": marker}, ensure_ascii=False))
          PY