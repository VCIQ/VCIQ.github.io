name: One-time source governance endpoint verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-source-governance-validation.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect redirect and search form
        run: |
          python - <<'PY'
          import re
          from urllib.error import HTTPError
          from urllib.request import HTTPRedirectHandler, Request, build_opener, urlopen

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = build_opener(NoRedirect)
          for endpoint in [
              "https://www.jintiankansha.com/t_original/McBR6khl8D",
              "https://www.jintiankansha.com/t_original/9IpnSXWyyd",
              "https://www.jintiankansha.com/t_original/T2X1uYMP8k",
          ]:
              req = Request(endpoint, headers={"User-Agent": UA, "Accept-Language": "zh-CN,zh;q=0.9", "Referer": endpoint.replace("/t_original/", "/t/")})
              try:
                  with opener.open(req, timeout=18) as response:
                      body = response.read(200_000).decode(response.headers.get_content_charset() or "utf-8", errors="replace")
                      print(f"ORIGINAL_RESPONSE endpoint={endpoint} status={response.status} final={response.geturl()} location={response.headers.get('Location')} bytes={len(body)}")
                      print("ORIGINAL_BODY " + repr(body[:1200]))
              except HTTPError as exc:
                  body = exc.read(200_000).decode(exc.headers.get_content_charset() or "utf-8", errors="replace")
                  print(f"ORIGINAL_HTTP_ERROR endpoint={endpoint} status={exc.code} location={exc.headers.get('Location')} bytes={len(body)}")
                  print("ORIGINAL_ERROR_BODY " + repr(body[:1200]))
              except Exception as exc:
                  print(f"ORIGINAL_EXCEPTION endpoint={endpoint} error={type(exc).__name__}: {exc}")

          root_req = Request("https://www.jintiankansha.com/", headers={"User-Agent": UA, "Accept-Language": "zh-CN,zh;q=0.9"})
          with urlopen(root_req, timeout=18) as response:
              root = response.read(500_000).decode(response.headers.get_content_charset() or "utf-8", errors="replace")
          match = re.search(r'(<form\b[^>]*action=[\"\']/search[\"\'][\s\S]*?</form>)', root, flags=re.I)
          print("SEARCH_FORM " + repr(match.group(1)[:3000] if match else ""))
          PY