name: One-time source governance endpoint verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-source-governance-validation.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect raw Sogou search response shape
        run: |
          python - <<'PY'
          import html
          import re
          from tools import wechat_sogou_index as sogou

          for publisher in ["高工机器人", "量子位"]:
              spec = {"name": publisher, "expectedAccounts": [publisher], "queryIdentity": publisher, "sector": "人工智能", "keywords": ["机器人"]}
              url = sogou.build_search_url(spec, query=publisher)
              try:
                  body = sogou._request(url)
              except Exception as exc:
                  print(f"RAW_REQUEST_ERROR publisher={publisher} error={type(exc).__name__}: {exc}")
                  continue
              lower = body.casefold()
              print(f"RAW_PAGE publisher={publisher} bytes={len(body)} antispider={'antispider' in lower} captcha={'验证码' in body}")
              print(f"LEGACY_MARKERS id={body.count('sogou_vr_11002601_title_')} uigs={body.count('article_title_')}")
              title = re.search(r'(?is)<title[^>]*>(.*?)</title>', body)
              print("PAGE_TITLE " + (re.sub(r'\s+', ' ', html.unescape(title.group(1))).strip() if title else ''))
              anchors = re.findall(r'(?is)<a\b([^>]*)>(.*?)</a>', body)
              interesting = []
              for attrs, inner in anchors:
                  text = re.sub(r'(?is)<[^>]+>', ' ', inner)
                  text = re.sub(r'\s+', ' ', html.unescape(text)).strip()
                  href = re.search(r'''href\s*=\s*["']([^"']+)["']''', attrs, flags=re.I)
                  if href and (publisher in text or '/link?' in href.group(1) or 'weixin' in href.group(1).lower() or 'article' in attrs.lower()):
                      interesting.append((re.sub(r'\s+', ' ', attrs).strip()[:500], text[:220], html.unescape(href.group(1))[:500]))
              print(f"ANCHOR_COUNT total={len(anchors)} interesting={len(interesting)}")
              for attrs, text, href in interesting[:20]:
                  print(f"ANCHOR attrs={attrs!r} text={text!r} href={href!r}")
              for marker in ['news-box', 'txt-box', 'results', 'search_no_result', 'no-result', 'sogou_vr_11002601']:
                  print(f"MARKER {marker} count={lower.count(marker.casefold())}")
              print("BODY_HEAD " + repr(re.sub(r'\s+', ' ', body[:12000])[:5000]))
          PY