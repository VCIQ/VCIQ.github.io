name: One-time source governance final verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-source-governance-validation.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect final WeChat production recovery state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          targets = {
              "user-track-wechat-cbea-battery-energy",
              "user-track-wechat-chiptrend-ic-semiconductor",
              "user-track-wechat-eefocus-semiconductor",
              "user-track-wechat-gg-lithium-energy",
              "user-track-wechat-gg-robot-robotics",
              "user-track-wechat-icbank-semiconductor",
              "user-track-wechat-ijiwei-semiconductor",
              "user-track-wechat-robospeak-robotics",
              "user-track-wechat-semiconductor-technology-semiconductor",
          }

          articles = json.loads(Path("public/data/articles.json").read_text(encoding="utf-8"))
          health = json.loads(Path("public/data/source_health.json").read_text(encoding="utf-8"))

          print("HEALTH_GENERATED_AT " + str(health.get("generatedAt")))

          statuses = {
              str(row.get("id") or row.get("sourceId") or ""): row
              for row in articles.get("sourceStatus", [])
              if isinstance(row, dict)
          }
          health_sources = health.get("sources", {}) if isinstance(health.get("sources"), dict) else {}

          missing = []
          for source_id in sorted(targets):
              status = statuses.get(source_id)
              h = health_sources.get(source_id)
              if status is None:
                  missing.append(source_id)
              srow = {
                  "id": source_id,
                  "name": (status or {}).get("name"),
                  "status": (status or {}).get("status"),
                  "scanned": (status or {}).get("scanned"),
                  "accepted": (status or {}).get("accepted"),
                  "newAccepted": (status or {}).get("newAccepted"),
                  "failed": (status or {}).get("failed"),
                  "retainedPrevious": (status or {}).get("retainedPrevious"),
                  "discoveryProvider": (status or {}).get("discoveryProvider"),
                  "sogouScanned": (status or {}).get("sogouScanned"),
                  "sogouResolved": (status or {}).get("sogouResolved"),
                  "query": (status or {}).get("query"),
                  "queryAttempts": (status or {}).get("queryAttempts"),
                  "error": (status or {}).get("error"),
              }
              hrow = {
                  "id": source_id,
                  "lastStatus": (h or {}).get("lastStatus"),
                  "scanned": (h or {}).get("scanned"),
                  "accepted": (h or {}).get("accepted"),
                  "consecutiveFailures": (h or {}).get("consecutiveFailures"),
                  "consecutiveSuccesses": (h or {}).get("consecutiveSuccesses"),
                  "recoverySuccesses": (h or {}).get("recoverySuccesses"),
                  "alertActive": (h or {}).get("alertActive"),
                  "quarantined": (h or {}).get("quarantined"),
                  "collectionState": (h or {}).get("collectionState"),
                  "reason": (h or {}).get("reason"),
                  "lastSeenAt": (h or {}).get("lastSeenAt"),
                  "lastSuccessAt": (h or {}).get("lastSuccessAt"),
              }
              print("FINAL_WECHAT_STATUS " + json.dumps(srow, ensure_ascii=False, sort_keys=True))
              print("FINAL_WECHAT_HEALTH " + json.dumps(hrow, ensure_ascii=False, sort_keys=True))

          if missing:
              raise SystemExit("Missing sourceStatus rows: " + ", ".join(missing))
          PY