name: One-time source governance endpoint verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-source-governance-validation.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect Sogou account-search result structure
        run: |
          python - <<'PY'
          import html
          import json
          import re
          from urllib.parse import quote
          from tools import wechat_sogou_index as sogou

          for publisher in ["高工机器人", "电池中国", "量子位"]:
              url = (
                  "https://weixin.sogou.com/weixin?"
                  f"type=1&s_from=input&query={quote(publisher)}&ie=utf8"
              )
              try:
                  body = sogou._request(url)
              except Exception as exc:
                  print(f"ACCOUNT_SEARCH_ERROR publisher={publisher} error={type(exc).__name__}: {exc}")
                  continue

              title = re.search(r'(?is)<title[^>]*>(.*?)</title>', body)
              print(
                  "ACCOUNT_SEARCH_META "
                  + json.dumps(
                      {
                          "publisher": publisher,
                          "bytes": len(body),
                          "title": re.sub(r"\s+", " ", html.unescape(title.group(1))).strip() if title else "",
                          "antispider": "antispider" in body.casefold(),
                          "captcha": "验证码" in body,
                          "accountBoxes": len(re.findall(r"sogou_vr_11002301_box_\d+", body)),
                          "articleLinks": len(re.findall(r"/link\?", body)),
                      },
                      ensure_ascii=False,
                      sort_keys=True,
                  )
              )

              anchors = re.findall(r'(?is)<a\b([^>]*)>(.*?)</a>', body)
              for attrs, inner in anchors:
                  text = re.sub(r'(?is)<[^>]+>', ' ', inner)
                  text = re.sub(r'\s+', ' ', html.unescape(text)).strip()
                  href_match = re.search(r'''href\s*=\s*["']([^"']+)["']''', attrs, flags=re.I)
                  href = html.unescape(href_match.group(1)) if href_match else ""
                  hay = f"{attrs} {text} {href}"
                  if (
                      publisher in hay
                      or "/link?" in href
                      or "sogou_vr_11002301" in attrs
                      or "account" in attrs.casefold()
                  ):
                      print(
                          "ACCOUNT_ANCHOR "
                          + json.dumps(
                              {
                                  "publisher": publisher,
                                  "text": text[:300],
                                  "href": href[:700],
                                  "attrs": re.sub(r"\s+", " ", attrs).strip()[:700],
                              },
                              ensure_ascii=False,
                              sort_keys=True,
                          )
                      )

              for pattern in [
                  r'(?is)<li[^>]+id="sogou_vr_11002301_box_\d+".*?</li>',
                  r'(?is)<div[^>]+class="[^"]*txt-box[^"]*".*?</div>\s*</div>',
              ]:
                  blocks = re.findall(pattern, body)
                  if blocks:
                      print(
                          "ACCOUNT_BLOCK "
                          + json.dumps(
                              {
                                  "publisher": publisher,
                                  "html": re.sub(r"\s+", " ", blocks[0])[:12000],
                              },
                              ensure_ascii=False,
                          )
                      )
                      break
          PY