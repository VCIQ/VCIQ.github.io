name: One-time source governance endpoint verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-source-governance-validation.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare Sogou discovery
        run: |
          python - <<'PY'
          import json
          from tools import wechat_sogou_index as sogou

          publishers = [
              "高工机器人", "机器人大讲堂", "集微网", "半导体行业观察", "半导体技术",
              "芯潮IC", "与非网", "高工锂电", "电池中国",
              "量子位", "机器之心", "DeepTech深科技",
          ]
          for publisher in publishers:
              spec = {
                  "name": publisher,
                  "expectedAccounts": [publisher],
                  "queryIdentity": publisher,
                  "sector": "人工智能" if publisher in {"量子位", "机器之心", "DeepTech深科技"} else "半导体",
                  "keywords": ["机器人", "芯片", "产业"],
              }
              try:
                  rows, meta = sogou.discover(spec)
                  print("SOGOU_META " + json.dumps({"publisher": publisher, **meta}, ensure_ascii=False, sort_keys=True))
                  for row in rows[:3]:
                      print("SOGOU_ROW " + json.dumps({
                          "publisher": publisher,
                          "title": row.get("title"),
                          "account": row.get("account"),
                          "resultUrl": row.get("url"),
                          "directUrl": row.get("directUrl"),
                      }, ensure_ascii=False, sort_keys=True))
              except Exception as exc:
                  print(f"SOGOU_EXCEPTION publisher={publisher} error={type(exc).__name__}: {exc}")
          PY