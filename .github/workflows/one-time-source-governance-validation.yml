name: One-time source governance full-path trace

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-source-governance-validation.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trace one recent article through the full production stack
        run: |
          python - <<'PY'
          import json
          from tools import crawl_with_wechat_registry as app
          from tools import wechat_source_registry

          base = app.base
          crawler = base.tracking.crawler

          # Exact production installation order through the WeChat adapters.
          app.core_official_adapters.install(crawler)
          app.http_policy_bridge.install(crawler)
          app.search_index_feed_redirects.install(crawler)
          app.wechat_fetch_compat.install(app.wechat_public_sources)
          app.wechat_registry_bridge.install(app.wechat_public_sources)
          app.wechat_original_redirect_bridge.install(app.wechat_public_sources, app.wechat_registry_bridge)
          app.wechat_index_context_guard.install(app.wechat_registry_bridge)
          app.wechat_index_record_fallback.install(app.wechat_public_sources, app.wechat_registry_bridge)
          app.wechat_sogou_redirect_compat.install(app.wechat_sogou_index)
          app.wechat_sogou_link_compat.install(app.wechat_sogou_index)
          app.wechat_public_aggregator.install(app.wechat_sogou_index)
          app.wechat_sogou_bridge.install(app.wechat_public_sources)

          tracking_config = base.tracking.load_tracking()
          tracks = base.tracking._enabled_tracks(tracking_config)
          specs = app.wechat_public_sources.generated_wechat_sources(tracks, base.tracking)
          spec = next(s for s in specs if s.get("id") == "user-track-wechat-robospeak-robotics")

          rows, meta = app.wechat_sogou_index.discover(spec)
          print("META " + json.dumps(meta, ensure_ascii=False, sort_keys=True))
          recent_rows = [
              row for row in rows
              if row.get("directUrl") and app.wechat_sogou_bridge._is_recent(
                  row.get("publishedAt"), int(spec.get("maxArticleAgeDays", 45)), crawler
              )
          ]
          print("RECENT_ROWS " + json.dumps([
              {"title": r.get("title"), "publishedAt": r.get("publishedAt"), "directUrl": r.get("directUrl"), "account": r.get("account")}
              for r in recent_rows
          ], ensure_ascii=False, sort_keys=True))
          if not recent_rows:
              raise SystemExit("No recent row available for full-path trace")

          row = recent_rows[0]
          direct = str(row["directUrl"])
          body = app.wechat_public_sources.fetch_public_wechat_page(direct)
          parser = app.wechat_public_sources.WeChatPageParser()
          parser.feed(body or "")
          observed = parser.account or app.wechat_public_sources._js_value(
              body or "", ("nickname", "profile_nickname", "account_name")
          )
          print("FETCH " + json.dumps({
              "directUrl": direct,
              "bodyChars": len(body),
              "observedAccount": observed,
              "accountMatch": wechat_source_registry.account_matches(spec, observed),
              "pageTitle": parser.title,
              "contentChars": len(parser.content),
          }, ensure_ascii=False, sort_keys=True))

          article = app.wechat_public_sources.parse_wechat_article(
              spec,
              direct,
              body,
              crawler,
              fallback_title=str(row.get("title") or ""),
              fallback_summary=str(row.get("summary") or ""),
              fallback_date=str(row.get("publishedAt") or "") or None,
          )
          print("PARSE_RESULT " + json.dumps({
              "isNone": article is None,
              "title": (article or {}).get("title"),
              "publishedAt": (article or {}).get("publishedAt"),
              "wechatAccount": (article or {}).get("wechatAccount"),
              "wechatContentMode": (article or {}).get("wechatContentMode"),
              "source": (article or {}).get("source"),
              "companies": (article or {}).get("companies"),
              "people": (article or {}).get("people"),
              "keywords": (article or {}).get("keywords"),
          }, ensure_ascii=False, sort_keys=True))
          if article is None:
              raise SystemExit("Full production parse rejected the known-good recent row")
          PY