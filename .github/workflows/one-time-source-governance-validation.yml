name: One-time source governance endpoint verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-source-governance-validation.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect public metadata for original ids
        run: |
          python - <<'PY'
          import re
          from urllib.error import HTTPError
          from urllib.request import HTTPRedirectHandler, Request, build_opener, urlopen

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          details = ["McBR6khl8D", "9IpnSXWyyd", "T2X1uYMP8k"]
          patterns = [
              r'__biz[^\"\'<>\s]{0,160}', r'\bbiz\b[^\"\'<>\s]{0,160}',
              r'\bmid\b[^\"\'<>\s]{0,160}', r'\bidx\b[^\"\'<>\s]{0,160}',
              r'\bsn\b[^\"\'<>\s]{0,200}', r'mp\.weixin\.qq\.com[^\"\'<>\s]{0,300}',
              r'/t_snapshot/[A-Za-z0-9_-]+', r'original[^\n]{0,300}',
          ]
          for token in details:
              url = f"https://www.jintiankansha.com/t/{token}"
              req = Request(url, headers={"User-Agent": UA, "Accept-Language": "zh-CN,zh;q=0.9"})
              with urlopen(req, timeout=18) as response:
                  body = response.read(1_500_000).decode(response.headers.get_content_charset() or "utf-8", errors="replace")
              print(f"DETAIL_META token={token} bytes={len(body)}")
              for pattern in patterns:
                  values = re.findall(pattern, body, flags=re.I)
                  if values:
                      print(f"PATTERN {pattern!r} -> {values[:20]!r}")
              for snapshot in [f"https://www.jintiankansha.com/t_snapshot/{token}"]:
                  try:
                      req = Request(snapshot, headers={"User-Agent": UA, "Accept-Language": "zh-CN,zh;q=0.9", "Referer": url})
                      with urlopen(req, timeout=18) as response:
                          snap = response.read(1_500_000).decode(response.headers.get_content_charset() or "utf-8", errors="replace")
                          print(f"SNAPSHOT token={token} status={response.status} final={response.geturl()} bytes={len(snap)}")
                          for pattern in patterns[:-2]:
                              values = re.findall(pattern, snap, flags=re.I)
                              if values:
                                  print(f"SNAP_PATTERN {pattern!r} -> {values[:20]!r}")
                  except HTTPError as exc:
                      print(f"SNAPSHOT_HTTP_ERROR token={token} status={exc.code} location={exc.headers.get('Location')}")
                  except Exception as exc:
                      print(f"SNAPSHOT_EXCEPTION token={token} error={type(exc).__name__}: {exc}")
          PY