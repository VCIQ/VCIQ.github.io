name: One-time source governance endpoint verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-source-governance-validation.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect Sogou identity and redirect
        run: |
          python - <<'PY'
          import html
          import re
          from urllib.parse import quote
          from tools import wechat_sogou_index as sogou

          publisher = "量子位"
          url = f"https://weixin.sogou.com/weixin?type=2&s_from=input&query={quote(publisher)}&ie=utf8"
          body = sogou._request(url)
          blocks = sogou._result_blocks(body)
          rows = sogou.parse_search_results(body, url)
          print(f"RESULTS blocks={len(blocks)} rows={len(rows)}")
          if blocks:
              block = re.sub(r'\s+', ' ', blocks[0])
              print("FIRST_BLOCK " + repr(block[:12000]))
              for pattern in [r'uigs="article_account_\d+"', r'class="[^"]*account[^"]*"', r'account[^<]{0,300}', r'account-name[^<]{0,300}']:
                  print(f"ACCOUNT_PATTERN {pattern!r} count={len(re.findall(pattern, blocks[0], flags=re.I))}")
          if rows:
              row = rows[0]
              print(f"FIRST_ROW title={row.get('title')!r} account={row.get('account')!r} url={row.get('url')!r}")
              try:
                  direct = sogou.resolve_result_url(row['url'], url)
                  print(f"DIRECT_RESULT {direct!r}")
              except Exception as exc:
                  print(f"DIRECT_ERROR {type(exc).__name__}: {exc}")
          PY