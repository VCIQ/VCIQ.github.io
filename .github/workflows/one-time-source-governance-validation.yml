name: One-time source governance aggregator verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-source-governance-validation.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect public aggregator coverage for target accounts
        run: |
          python - <<'PY'
          import json
          from tools import crawl_with_wechat_registry as app
          from tools import wechat_public_aggregator

          app.wechat_registry_bridge.install(app.wechat_public_sources)
          tracking_config = app.base.tracking.load_tracking()
          tracks = app.base.tracking._enabled_tracks(tracking_config)
          specs = app.wechat_public_sources.generated_wechat_sources(tracks, app.base.tracking)
          targets = {
              "user-track-wechat-cbea-battery-energy",
              "user-track-wechat-chiptrend-ic-semiconductor",
              "user-track-wechat-eefocus-semiconductor",
              "user-track-wechat-gg-lithium-energy",
              "user-track-wechat-gg-robot-robotics",
              "user-track-wechat-icbank-semiconductor",
              "user-track-wechat-ijiwei-semiconductor",
              "user-track-wechat-robospeak-robotics",
              "user-track-wechat-semiconductor-technology-semiconductor",
          }
          selected = [s for s in specs if s.get("id") in targets]
          print("SELECTED_COUNT", len(selected))
          for spec in selected:
              try:
                  rows, meta = wechat_public_aggregator.discover(spec)
                  print("AGGREGATOR_RESULT " + json.dumps({
                      "id": spec.get("id"),
                      "name": spec.get("name"),
                      "meta": meta,
                      "count": len(rows),
                      "dates": [r.get("publishedAt") for r in rows],
                      "titles": [r.get("title") for r in rows[:5]],
                      "urls": [r.get("directUrl") for r in rows[:3]],
                  }, ensure_ascii=False, sort_keys=True))
              except Exception as exc:
                  print("AGGREGATOR_ERROR " + json.dumps({
                      "id": spec.get("id"), "name": spec.get("name"),
                      "error": f"{type(exc).__name__}: {exc}",
                  }, ensure_ascii=False, sort_keys=True))
          PY