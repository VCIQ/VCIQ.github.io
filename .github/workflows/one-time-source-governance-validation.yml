name: One-time source governance endpoint verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-source-governance-validation.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Print raw WeChat crawl statuses
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          targets = {
              "user-track-wechat-cbea-battery-energy",
              "user-track-wechat-chiptrend-ic-semiconductor",
              "user-track-wechat-eefocus-semiconductor",
              "user-track-wechat-gg-lithium-energy",
              "user-track-wechat-gg-robot-robotics",
              "user-track-wechat-icbank-semiconductor",
              "user-track-wechat-ijiwei-semiconductor",
              "user-track-wechat-robospeak-robotics",
              "user-track-wechat-semiconductor-technology-semiconductor",
          }
          payload = json.loads(Path("public/data/articles.json").read_text(encoding="utf-8"))
          statuses = payload.get("sourceStatus", [])
          for entry in statuses:
              if not isinstance(entry, dict) or entry.get("id") not in targets:
                  continue
              print("RAW_WECHAT_STATUS " + json.dumps(entry, ensure_ascii=False, sort_keys=True))
          PY