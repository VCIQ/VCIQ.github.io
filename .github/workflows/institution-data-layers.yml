name: Build institution data layers

on:
  push:
    branches: [main]
    paths:
      - config/institution_rankings.json
      - config/institution_entity_aliases.json
      - config/star_market_investor_reviews.json
      - lib/catalog-data.ts
      - lib/institution-ranking-data.ts
      - lib/institution-entity-registry.ts
      - lib/star-market-investor-data.ts
      - lib/star-market-investor-review.ts
      - public/data/articles.json
      - public/data/star_market_investors.json
      - scripts/build-institution-data-layers.ts
      - .github/workflows/institution-data-layers.yml
  # GITHUB_TOKEN-authored data commits do not reliably fan out into another
  # workflow run. Keep an independent twice-weekly checkpoint comfortably inside
  # the 168-hour freshness SLA.
  schedule:
    - cron: "40 7 * * 1,4"
      timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: vciq-repository-writer-${{ github.ref }}
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate audited institution layers
        run: node --import tsx scripts/build-institution-data-layers.ts

      - name: Validate layer consistency
        run: |
          node --import tsx --test \
            tests/institution-entity-registry.test.ts \
            tests/institution-data-layers.test.ts
          npx tsc --noEmit
          npm run lint

      - name: Commit changed institution layers
        shell: bash
        run: |
          set -euo pipefail
          DATA_PATHS=(
            public/data/institution_entities.json
            public/data/institution_events.json
            public/data/institution_equity_relationships.json
          )
          git add "${DATA_PATHS[@]}"
          if git diff --cached --quiet; then
            echo "No institution data layer changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh audited institution layers"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            node --import tsx scripts/build-institution-data-layers.ts
            node --import tsx --test \
              tests/institution-entity-registry.test.ts \
              tests/institution-data-layers.test.ts
            git add "${DATA_PATHS[@]}"
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done

      - name: Refresh Research Agent after institution checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run research-agent-v1.yml --ref main --repo "$GITHUB_REPOSITORY"
