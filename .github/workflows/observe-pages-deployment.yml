name: Observe Pages deployment

on:
  workflow_run:
    workflows:
      - Build and deploy GitHub Pages
    types: [completed]
  workflow_dispatch:
  # Independent reconciliation also covers missed/chained workflow_run events.
  schedule:
    - cron: "17,47 * * * *"
  # Bootstrap the observer fix on merge, never on its diagnostic-only commits.
  push:
    branches: [main]
    paths:
      - ".github/workflows/observe-pages-deployment.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: vciq-pages-observer
  cancel-in-progress: false

jobs:
  record:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record latest Pages run and real deployment outcome
        id: observe
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          echo "recorded=false" >> "$GITHUB_OUTPUT"
          RUN_JSON="${RUNNER_TEMP:-/tmp}/pages-observer-run.json"

          # Record the latest completed attempt, not merely the event that
          # happened to wake this job. Do not hide a newer failure by asking
          # only for successful runs. In-progress runs are not deployments.
          RUN_ID="$(gh run list --workflow pages.yml --branch main --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$RUN_ID" ]; then
            echo "No completed Pages run is available; preserving the diagnostic."
            exit 0
          fi
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          if [ -n "$EVENT_RUN_ID" ] && [ "$EVENT_RUN_ID" != "$RUN_ID" ]; then
            echo "Reconciling latest completed run $RUN_ID instead of delayed event $EVENT_RUN_ID."
          fi

          gh run view "$RUN_ID" \
            --json databaseId,status,conclusion,createdAt,updatedAt,headSha,url,event,workflowName,jobs \
            > "$RUN_JSON"
          jq -e --argjson runId "$RUN_ID" \
            '.databaseId == $runId and .status == "completed" and (.jobs | type) == "array"' \
            "$RUN_JSON" > /dev/null

          # A delayed event/API response must never move the snapshot backward.
          # Creation time dominates update time: rerunning an old run is not a
          # newer publication. For one run, reject older attempt observations.
          if [ -s diagnostics/pages-latest-status.json ]; then
            if jq -e --slurpfile previous diagnostics/pages-latest-status.json \
              '[.createdAt // "", .databaseId // 0, .updatedAt // ""] <
               [$previous[0].createdAt // "", $previous[0].databaseId // 0, $previous[0].updatedAt // ""]' \
              "$RUN_JSON" > /dev/null; then
              echo "Preserving a newer Pages diagnostic."
              exit 0
            fi
          fi

          BUILD_CONCLUSION="$(jq -r '[.jobs[] | select(.name == "build") | .conclusion][0] // "missing"' "$RUN_JSON")"
          DEPLOY_CONCLUSION="$(jq -r '[.jobs[] | select(.name == "deploy") | .conclusion][0] // "missing"' "$RUN_JSON")"
          BUILD_JOB_ID="$(jq -r '[.jobs[] | select(.name == "build") | .databaseId][0] // ""' "$RUN_JSON")"
          RUN_CONCLUSION="$(jq -r '.conclusion // ""' "$RUN_JSON")"

          deployment_status="incomplete"
          if [ "$DEPLOY_CONCLUSION" = "success" ]; then
            deployment_status="deployed"
          elif [ "$RUN_CONCLUSION" = "failure" ]; then
            deployment_status="failed"
          elif [ "$DEPLOY_CONCLUSION" = "skipped" ]; then
            deployment_status="deferred"
          fi

          deferred_reason=""
          if [ "$deployment_status" = "deferred" ] && [ -n "$BUILD_JOB_ID" ]; then
            BUILD_LOG="$(gh run view "$RUN_ID" --job "$BUILD_JOB_ID" --log 2>/dev/null || true)"
            if printf '%s\n' "$BUILD_LOG" | grep -Fq "tracking configuration is newer than the article snapshot"; then
              deferred_reason="tracking_snapshot_refresh"
            elif printf '%s\n' "$BUILD_LOG" | grep -Fq "entity resolution reconciliation is not at a fixed point"; then
              deferred_reason="entity_reconciliation"
            else
              deferred_reason="publication_readiness"
            fi
          fi

          jq \
            --arg buildConclusion "$BUILD_CONCLUSION" \
            --arg deployConclusion "$DEPLOY_CONCLUSION" \
            --arg deploymentStatus "$deployment_status" \
            --arg deferredReason "$deferred_reason" \
            'del(.jobs) + {
              buildConclusion: $buildConclusion,
              deployConclusion: $deployConclusion,
              deploymentStatus: $deploymentStatus,
              deferredReason: (if $deferredReason == "" then null else $deferredReason end)
            }' \
            "$RUN_JSON" \
            > diagnostics/pages-latest-status.json

          if [ "$RUN_CONCLUSION" = "failure" ]; then
            gh run view "$RUN_ID" --log-failed > diagnostics/pages-latest-failure.txt 2>&1 || true
          else
            : > diagnostics/pages-latest-failure.txt
          fi
          echo "recorded=true" >> "$GITHUB_OUTPUT"
          echo "Recorded Pages run $RUN_ID: $deployment_status."

      - name: Recover a deferred stale-tracking publication
        if: steps.observe.outputs.recorded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          # Periodic/bootstrap reconciliation is diagnostic-only. A delayed
          # event must not dispatch recovery for a different, newer run.
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            if [ "$EVENT_NAME" != "workflow_run" ] || [ "$EVENT_RUN_ID" != "$(jq -r '.databaseId' diagnostics/pages-latest-status.json)" ]; then
              echo "Diagnostic-only reconciliation; no recovery dispatch."
              exit 0
            fi
          fi
          deployment_status="$(jq -r '.deploymentStatus // ""' diagnostics/pages-latest-status.json)"
          deferred_reason="$(jq -r '.deferredReason // ""' diagnostics/pages-latest-status.json)"

          if [ "$deployment_status" != "deferred" ] || [ "$deferred_reason" != "tracking_snapshot_refresh" ]; then
            echo "No stale-tracking recovery is required."
            exit 0
          fi

          echo "Pages was deferred because tracking inputs are newer than the article snapshot."
          echo "Dispatching a current full refresh; the refresh workflow owns serialization and currentness checks."
          gh workflow run scheduled-sync.yml \
            --ref main \
            --repo "$GITHUB_REPOSITORY"

      - name: Publish diagnostic snapshot
        if: steps.observe.outputs.recorded == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/pages-latest-status.json diagnostics/pages-latest-failure.txt
          if git diff --cached --quiet; then
            echo "Pages diagnostic is already current."
            exit 0
          fi
          git commit -m "ci: record latest Pages deployment status"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
