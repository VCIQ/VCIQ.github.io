name: Generate clean Batch 2 activation diff

on:
  push:
    branches:
      - config/activate-new-tracks-batch2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: config/activate-new-tracks-batch2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply validated Batch 2 proposal
        run: python tools/apply_new_track_proposal.py --in-place
      - name: Verify production-shaped additions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('config/user_tracking.json').read_text(encoding='utf-8'))
          tracks = {x.get('slug'): x for x in p.get('tracks', []) if isinstance(x, dict)}
          assert tracks['cyber-insurtech']['name'] == '网络安全与保险科技'
          assert tracks['public-markets']['name'] == '上市公司与资本运作'
          rows = [x for x in p.get('listedCompanies', []) if isinstance(x, dict)]
          h = [x for x in rows if x.get('ticker') == '300605' and x.get('market') == 'A股']
          assert len(h) == 1
          assert h[0].get('name') == '恒锋信息'
          assert h[0].get('sector') == '上市公司与资本运作'
          print('Batch 2 activation shape verified: 2 tracks + 恒锋信息 300605')
          PY
          python -m unittest tests.test_listed_company_disclosures
      - name: Commit only the clean production diff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/user_tracking.json tests/test_listed_company_disclosures.py
          git rm config/user_tracking.new_tracks.batch2.json tools/apply_new_track_proposal.py .github/workflows/apply-new-tracks-batch2.yml
          git commit -m 'config: activate VCIQ new tracks batch 2'
          git push origin HEAD:config/activate-new-tracks-batch2
