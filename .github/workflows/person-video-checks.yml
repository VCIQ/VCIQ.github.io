name: Person video checks

on:
  pull_request:
    paths:
      - "tools/person_video_discovery.py"
      - "tools/wechat_channel_card_discovery.py"
      - "tools/refresh_people_profiles_with_video.py"
      - "tools/person_research_agent.py"
      - "tools/person_research_scheduler.py"
      - "tools/person_research_outcomes.py"
      - "tests/test_person_video_discovery.py"
      - "tests/test_wechat_channel_card_discovery.py"
      - "tests/test_refresh_people_profiles_with_video.py"
      - "tests/test_person_research_scheduler.py"
      - "tests/test_person_research_outcomes.py"
      - "tests/test_person_research_daily_budget.py"
      - ".github/workflows/person-video-checks.yml"
  push:
    branches:
      - main
    paths:
      - "tools/person_video_discovery.py"
      - "tools/wechat_channel_card_discovery.py"
      - "tools/refresh_people_profiles_with_video.py"
      - "tools/person_research_agent.py"
      - "tools/person_research_scheduler.py"
      - "tools/person_research_outcomes.py"
      - "tests/test_person_video_discovery.py"
      - "tests/test_wechat_channel_card_discovery.py"
      - "tests/test_refresh_people_profiles_with_video.py"
      - "tests/test_person_research_scheduler.py"
      - "tests/test_person_research_outcomes.py"
      - "tests/test_person_research_daily_budget.py"
      - ".github/workflows/person-video-checks.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run person video regressions
        run: >-
          python -m unittest -v
          tests.test_person_video_discovery
          tests.test_wechat_channel_card_discovery
          tests.test_refresh_people_profiles_with_video
          tests.test_person_research_scheduler
          tests.test_person_research_outcomes
          tests.test_person_research_daily_budget
