name: Apply audited tracking compound history repair

on:
  push:
    branches:
      - fix/tracking-compound-entity-history-data
    paths:
      - .github/workflows/repair-tracking-compound-history-data.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/tracking-compound-entity-history-data
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Audit historical compound inventory
        run: npm run repair:tracking-compound-entities

      - name: Apply audited repair
        run: npm run repair:tracking-compound-entities -- --write

      - name: Verify repair scope and idempotence
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "config/user_tracking.json" ]]; then
            printf 'Unexpected repair diff:\n'
            printf '  %s\n' "${changed[@]}"
            exit 1
          fi
          npm run repair:tracking-compound-entities
          git diff --check

      - name: Commit repaired tracking data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/user_tracking.json
          git diff --cached --quiet && exit 0
          git commit -m "data: repair historical compound tracking entities"
          git push origin HEAD:fix/tracking-compound-entity-history-data
