name: Temporary Next lockfile generator

on:
  push:
    branches:
      - security/next-16-3-4-20260908

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/next-16-3-4-20260908
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Generate lockfile from manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git commit -m "chore: refresh lockfile for Next security update"
          git push origin HEAD:security/next-16-3-4-20260908
