name: One-time apply WeChat cross-platform config

on:
  push:
    branches:
      - fix/wechat-crossplatform-20260830

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wechat-crossplatform-20260830
          fetch-depth: 0

      - name: Apply endpoint registry and compatibility install
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          endpoints = {
              'qbitai': {
                  'publisher': '量子位',
                  'kinds': ['wechat-original', 'official-website'],
                  'hosts': ['qbitai.com'],
                  'indexes': ['https://www.qbitai.com/2026/'],
              },
              'jiqizhixin': {
                  'publisher': '机器之心',
                  'kinds': ['wechat-original', 'official-website'],
                  'hosts': ['jiqizhixin.com', 'pro.jiqizhixin.com'],
                  'indexes': ['https://www.jiqizhixin.com/industry'],
              },
              'aitopics': {
                  'publisher': '新智元',
                  'kinds': ['wechat-original', 'official-website'],
                  'hosts': ['aiera.com.cn'],
                  'indexes': ['https://aiera.com.cn/'],
              },
              'aitechuang': {
                  'publisher': 'AI科技评论',
                  'kinds': ['wechat-original', 'official-crosspost'],
                  'hosts': ['leiphone.com', 'm.leiphone.com'],
                  'labels': {
                      'leiphone.com': '雷峰网认证作者页',
                      'm.leiphone.com': '雷峰网认证作者页',
                  },
                  'indexes': ['https://www.leiphone.com/author/AI科技评论'],
              },
              'gg-robot': {
                  'publisher': '高工机器人',
                  'kinds': ['wechat-original', 'official-website'],
                  'hosts': ['gg-robot.com'],
                  'indexes': ['https://www.gg-robot.com/'],
              },
              'icbank': {
                  'publisher': '半导体行业观察',
                  'kinds': ['wechat-original', 'official-website'],
                  'hosts': ['semi-insights.com'],
                  'indexes': ['https://www.semi-insights.com/'],
              },
              'ijiwei': {
                  'publisher': '集微网',
                  'kinds': ['wechat-original', 'official-website'],
                  'hosts': ['ijiwei.com'],
                  'indexes': ['https://www.ijiwei.com/'],
              },
              'icsmart': {
                  'publisher': '芯智讯',
                  'kinds': ['wechat-original', 'official-crosspost'],
                  'hosts': ['m.sohu.com', 'sohu.com'],
                  'indexes': ['https://m.sohu.com/media/128469'],
              },
              'zhidx': {
                  'publisher': '芯东西',
                  'kinds': ['wechat-original', 'official-website'],
                  'hosts': ['zhidx.com'],
                  'indexes': ['https://zhidx.com/aichip001'],
              },
              'chipmaster': {
                  'publisher': '芯师爷',
                  'kinds': ['wechat-original', 'official-website'],
                  'hosts': ['gsi24.com'],
                  'indexes': ['https://www.gsi24.com/'],
              },
              'gg-lithium': {
                  'publisher': '高工锂电',
                  'kinds': ['wechat-original', 'official-website'],
                  'hosts': ['gg-lb.com'],
                  'indexes': ['https://www.gg-lb.com/'],
              },
              'cbea-battery': {
                  'publisher': '电池中国',
                  'kinds': ['wechat-original', 'official-website'],
                  'hosts': ['cbea.com'],
                  'indexes': ['https://www.cbea.com/'],
              },
              'deeptechchina': {
                  'publisher': 'DeepTech深科技',
                  'kinds': ['wechat-original', 'official-website'],
                  'hosts': ['deeptechchina.com'],
                  'indexes': ['https://www.deeptechchina.com/'],
              },
          }

          registry_path = Path('config/wechat_sources.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          active = []
          for account in registry.get('accounts', []):
              if not isinstance(account, dict) or account.get('enabled', True) is False:
                  continue
              source_id = str(account.get('id') or '')
              active.append(source_id)
              cfg = endpoints.get(source_id)
              if not cfg:
                  raise SystemExit(f'active WeChat source missing endpoint config: {source_id}')
              account['publisherEntity'] = cfg['publisher']
              account['acceptedSourceKinds'] = cfg['kinds']
              account['officialCrosspostHosts'] = cfg['hosts']
              if cfg.get('labels'):
                  account['officialPlatformLabels'] = cfg['labels']
              else:
                  account.pop('officialPlatformLabels', None)

          if set(active) != set(endpoints):
              raise SystemExit(f'endpoint config mismatch: active={active}, configured={list(endpoints)}')
          registry_path.write_text(
              json.dumps(registry, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          indexes_path = Path('config/wechat_public_indexes.json')
          indexes = json.loads(indexes_path.read_text(encoding='utf-8'))
          accounts = indexes.setdefault('accounts', {})
          for source_id, cfg in endpoints.items():
              existing = accounts.get(source_id, [])
              merged = []
              for value in [*cfg['indexes'], *existing]:
                  if value not in merged:
                      merged.append(value)
              accounts[source_id] = merged
          indexes_path.write_text(
              json.dumps(indexes, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          runner_path = Path('tools/crawl_with_wechat_registry.py')
          runner = runner_path.read_text(encoding='utf-8')
          replacements = [
              (
                  '    from . import wechat_original_redirect_bridge\n',
                  '    from . import wechat_official_index_bridge\n    from . import wechat_original_redirect_bridge\n',
              ),
              (
                  '    import wechat_original_redirect_bridge\n',
                  '    import wechat_official_index_bridge\n    import wechat_original_redirect_bridge\n',
              ),
              (
                  '    wechat_registry_bridge.install(wechat_public_sources)\n',
                  '    wechat_registry_bridge.install(wechat_public_sources)\n    wechat_official_index_bridge.install(wechat_registry_bridge)\n',
              ),
          ]
          for old, new in replacements:
              if runner.count(old) != 1:
                  raise SystemExit(f'runner patch anchor count != 1: {old!r}')
              runner = runner.replace(old, new, 1)
          runner_path.write_text(runner, encoding='utf-8')

          test_path = Path('tests/test_wechat_official_index_bridge.py')
          test_text = test_path.read_text(encoding='utf-8')
          old = '''        self.assertIsInstance(labels, dict)\n'''
          new = '''        self.assertEqual(labels.get("leiphone.com"), "雷峰网认证作者页")\n        self.assertEqual(labels.get("m.leiphone.com"), "雷峰网认证作者页")\n'''
          if test_text.count(old) != 1:
              raise SystemExit('focused test patch anchor missing')
          test_path.write_text(test_text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate focused registry contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit

          registry = json.loads(Path('config/wechat_sources.json').read_text(encoding='utf-8'))
          indexes = json.loads(Path('config/wechat_public_indexes.json').read_text(encoding='utf-8')).get('accounts', {})
          active = [row for row in registry.get('accounts', []) if isinstance(row, dict) and row.get('enabled', True) is not False]
          if len(active) != 13:
              raise SystemExit(f'expected 13 active WeChat entities, got {len(active)}')
          for row in active:
              source_id = row['id']
              allowed = {str(host).lower().removeprefix('www.') for host in row.get('officialCrosspostHosts', [])}
              if not allowed:
                  raise SystemExit(f'{source_id}: no officialCrosspostHosts')
              official_indexes = [
                  url for url in indexes.get(source_id, [])
                  if (urlsplit(url).hostname or '').lower().removeprefix('www.') in allowed
              ]
              if not official_indexes:
                  raise SystemExit(f'{source_id}: no whitelisted cross-platform index')
          print('13 active WeChat entities have explicit whitelisted cross-platform index candidates')
          PY
          python3 -m unittest tests.test_wechat_official_index_bridge

      - name: Commit config and remove one-time workflow
        run: |
          rm .github/workflows/one-time-apply-wechat-crossplatform-config.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            config/wechat_sources.json \
            config/wechat_public_indexes.json \
            tools/crawl_with_wechat_registry.py \
            tests/test_wechat_official_index_bridge.py \
            .github/workflows/one-time-apply-wechat-crossplatform-config.yml
          git commit -m "feat(sources): configure existing WeChat cross-platform endpoints"
          git push origin HEAD:fix/wechat-crossplatform-20260830
