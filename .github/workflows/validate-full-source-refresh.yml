name: Validate full-source refresh

on:
  pull_request:
    paths:
      - .maintenance/full-source-refresh-validation.md
      - tools/prepare_full_refresh.py
      - tools/finalize_full_refresh.py
      - tools/validate_full_refresh.py
      - tools/professional_media_sources.py
      - tools/source_portfolio.py
      - tools/source_evidence.py
      - tools/article_publication_gate.py
      - tools/core_official_adapters.py
      - tools/tracking_seed_governance.py
      - tools/validate_professional_media_snapshot.py
      - tools/crawl_with_wechat_registry.py
      - tools/snapshot_retention.py
      - tools/refresh_article_quality_gate.py
      - tools/update_source_health.py
      - tools/source_health_summary.py
      - tools/tracking_source_governance.py
      - public/data/source_health.json
      - tests/test_professional_media_sources.py
      - tests/test_source_portfolio.py
      - tests/test_source_evidence.py
      - tests/test_article_publication_gate.py
      - tests/test_core_official_adapters.py
      - tests/test_tracking_seed_governance.py
      - tests/test_source_health_summary.py
      - tests/test_scheduled_sync_workflow.py
      - .github/workflows/scheduled-sync.yml
      - .github/workflows/validate-full-source-refresh.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source adapters and health contracts
        run: |
          python -m py_compile \
            tools/professional_media_sources.py \
            tools/source_portfolio.py \
            tools/source_evidence.py \
            tools/article_publication_gate.py \
            tools/core_official_adapters.py \
            tools/tracking_seed_governance.py \
            tools/validate_professional_media_snapshot.py \
            tools/crawl_with_wechat_registry.py \
            tools/validate_full_refresh.py \
            tools/refresh_article_quality_gate.py \
            tools/update_source_health.py \
            tools/source_health_summary.py \
            tools/tracking_source_governance.py
          python -m unittest \
            tests.test_professional_media_sources \
            tests.test_source_portfolio \
            tests.test_source_evidence \
            tests.test_article_publication_gate \
            tests.test_core_official_adapters \
            tests.test_tracking_seed_governance \
            tests.test_source_health_summary \
            tests.test_scheduled_sync_workflow
          python tools/source_health_summary.py --check
          python tools/tracking_source_governance.py --check
      - name: Start clean source ledger
        run: python tools/prepare_full_refresh.py
      - name: Crawl every configured public source family
        env:
          SEC_USER_AGENT: "LizeRoadOne/3.0 contact=No1Lize@users.noreply.github.com (+https://github.com/No1Lize/No1Lize.github.io)"
        run: python tools/crawl_with_wechat_registry.py --source all
      - name: Require attempted professional media and original-domain articles
        run: python tools/validate_professional_media_snapshot.py --require-articles
      - name: Crawl all official company sources
        env:
          SEC_USER_AGENT: "LizeRoadOne/3.0 contact=No1Lize@users.noreply.github.com (+https://github.com/No1Lize/No1Lize.github.io)"
        run: python tools/eastmoney_transport.py
      - name: Refresh dependent public datasets and source health
        run: |
          python tools/refresh_market_profiles_enriched.py
          python tools/migrate_article_entities.py
          python tools/refine_eastmoney_snapshot.py
          python tools/enrich_tracking_snapshot.py
          python tools/refresh_people_profiles_with_video.py
          python tools/snapshot_retention.py
          python tools/finalize_full_refresh.py
          python tools/update_source_health.py
          python tools/source_health_summary.py
          python tools/tracking_source_governance.py
          python tools/enrich_tracking_snapshot.py
          python tools/snapshot_retention.py
          python tools/refresh_article_quality_gate.py
          python tools/finalize_full_refresh.py
      - name: Validate the complete refresh
        run: |
          python tools/source_health_summary.py --check
          python tools/tracking_source_governance.py --check
          python tools/snapshot_retention.py --check
          python tools/validate_professional_media_snapshot.py --require-articles
          python tools/crawl_articles.py --validate-only
          python tools/validate_full_refresh.py
          python tools/validate_eastmoney_snapshot.py
          python tools/validate_user_source_coverage.py
          python tools/validate_market_profiles.py
          python tools/refresh_people_profiles_with_video.py --offline --validate-only
      - name: Upload refreshed snapshot for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-source-refresh-snapshot
          path: public/data/articles.json
          if-no-files-found: error
