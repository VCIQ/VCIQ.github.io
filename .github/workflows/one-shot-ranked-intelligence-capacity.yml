name: One-shot ranked intelligence capacity patch

on:
  push:
    branches:
      - feat/manual-ranked-intelligence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/manual-ranked-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply edits
        run: python .github/scripts/ranked-intelligence-capacity-patch.py
      - name: Validate projection contract
        run: |
          python -m unittest tests.test_ranked_intelligence_projection tests.test_ranked_intelligence_capacity
      - name: Commit generated patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: raise ranked intelligence projection cap to 36"
          git push origin HEAD:feat/manual-ranked-intelligence
