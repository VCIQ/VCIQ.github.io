name: Publish validated data updates

on:
  workflow_run:
    workflows:
      - Refresh public intelligence every two hours
      - Refresh public intelligence
      - Refresh venture profiles
      - Refresh all listed-company research PDFs
      - Refresh institution rankings
      - Refresh STAR Market investors
      - Monthly source performance review
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: vciq-pages-dispatch
  queue: max

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Record the validated writer run
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            "workflow=${{ github.event.workflow_run.name }}" \
            "run_id=${{ github.event.workflow_run.id }}" \
            "event=${{ github.event.workflow_run.event }}" \
            "head_branch=${{ github.event.workflow_run.head_branch }}" \
            "head_sha=${{ github.event.workflow_run.head_sha }}" \
            "conclusion=${{ github.event.workflow_run.conclusion }}"

      - name: Decide whether Research Agent needs a post-deploy run
        id: research-handoff
        if: github.event_name == 'workflow_run'
        env:
          SOURCE_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_research=false
          case "${SOURCE_WORKFLOW_NAME:-}" in
            "Refresh public intelligence every two hours"|\
            "Refresh public intelligence"|\
            "Refresh venture profiles"|\
            "Refresh all listed-company research PDFs"|\
            "Refresh institution rankings"|\
            "Refresh STAR Market investors")
              changed_paths="$(
                gh api \
                  -H 'Accept: application/vnd.github+json' \
                  "repos/${GH_REPO}/compare/${SOURCE_HEAD_SHA}...main" \
                  --jq '.files[].filename' \
                  || true
              )"
              printf '%s\n' "$changed_paths"
              if printf '%s\n' "$changed_paths" | grep -Eq '^public/data/(articles|venture_profiles|institution_entities|market_profiles|people|institution_events|listed_company_disclosures)\.json$'; then
                run_research=true
              fi
              ;;
          esac
          echo "run_research=$run_research" >> "$GITHUB_OUTPUT"
          echo "Research Agent post-deploy handoff: $run_research"

      - name: Dispatch one Pages build from the latest main
        env:
          RUN_RESEARCH_AFTER_DEPLOY: ${{ steps.research-handoff.outputs.run_research }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUN_RESEARCH_AFTER_DEPLOY:-false}" = "true" ]; then
            gh workflow run pages.yml --ref main -f run_research_after_deploy=true
          else
            gh workflow run pages.yml --ref main
          fi
