name: Patch Research Agent tier parity clean

on:
  push:
    branches:
      - fix/research-agent-publication-tier-parity-clean-20260913

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/research-agent-publication-tier-parity-clean-20260913
          fetch-depth: 0

      - name: Apply shared core-object publication tier semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/research_agent.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if dataset in {"person", "ventureCompany"} and any(\n        _is_verified_source(source) for source in supporting\n    ):\n        return "verified_change"\n'''
          new = '''    if dataset in {"person", "ventureCompany", "track", "technology"} and any(\n        _is_verified_source(source) for source in supporting\n    ):\n        return "verified_change"\n'''
          if old not in text:
              raise SystemExit('base publication tier anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_research_agent_research_objects.py')
          test_text = test_path.read_text(encoding='utf-8')
          old_test = '''        with mock.patch.object(target, "_AGENT", agent):\n            self.assertEqual(target.publication_tier("technology", [official]), "verified_change")\n            self.assertEqual(target.publication_tier("track", [media]), "candidate")\n'''
          new_test = '''        with mock.patch.object(target, "_AGENT", agent):\n            self.assertEqual(target.publication_tier("technology", [official]), "verified_change")\n            self.assertEqual(target.publication_tier("track", [media]), "candidate")\n        self.assertEqual(agent._publication_tier("technology", [official]), "verified_change")\n        self.assertEqual(agent._publication_tier("track", [official]), "verified_change")\n        self.assertEqual(agent._publication_tier("technology", [media]), "candidate")\n        self.assertEqual(agent._publication_tier("track", [media]), "candidate")\n'''
          if old_test not in test_text:
              raise SystemExit('core object tier test anchor not found')
          test_path.write_text(test_text.replace(old_test, new_test, 1), encoding='utf-8')
          PY

      - name: Run focused parity regressions
        run: |
          python -m unittest tests.test_research_agent_research_objects
          python -m unittest tests.test_research_agent_event_history
          python -m unittest tests.test_research_agent tests.test_research_agent_workflow

      - name: Commit clean parity fix and remove bootstrap workflow
        shell: bash
        run: |
          rm .github/workflows/patch-research-agent-tier-parity-clean.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/research_agent.py tests/test_research_agent_research_objects.py .github/workflows/patch-research-agent-tier-parity-clean.yml
          git commit -m "fix: align core research-object publication tiers"
          git push origin HEAD:fix/research-agent-publication-tier-parity-clean-20260913
