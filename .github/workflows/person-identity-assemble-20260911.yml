name: Assemble hash-checked person planner fix
on:
  push:
    branches: [fix/person-research-planner-identity-parity-20260911]
    paths: [.github/workflows/person-identity-assemble-20260911.yml]
permissions:
  contents: write
jobs:
  assemble:
    if: github.ref == 'refs/heads/fix/person-research-planner-identity-parity-20260911'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble and verify exact tested content
        run: python tools/_assemble_person_identity_fix_20260911.py
      - name: Run focused planner and workstream tests
        run: python -m unittest tests.test_person_identity_contract tests.test_person_research_agent tests.test_person_research_scheduler tests.test_person_research_workstreams tests.test_full_refresh_input_guard
      - name: Commit only to the isolated fix branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/person-research-planner-identity-parity-20260911
          git rm -- .github/workflows/person-identity-source-audit-20260911.yml .github/workflows/person-identity-assemble-20260911.yml .github/person-identity-parity-20260911.patch.zlib.b64 tools/_assemble_person_identity_fix_20260911.py
          git add -- .github/workflows/scheduled-sync.yml lib/person-identity-policy.json lib/person-identity-validation.ts lib/person-name-normalization.ts tests/fixtures/person-identity-contract.json tests/person-identity-parity.test.ts tests/test_person_identity_contract.py tools/full_refresh_input_guard.py tools/person_identity_contract.py tools/person_research_agent.py tools/person_research_scheduler.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: enforce shared person identity before planning and scheduling'
          git push origin HEAD:refs/heads/fix/person-research-planner-identity-parity-20260911
