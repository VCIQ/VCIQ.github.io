name: Refresh public intelligence every two hours

on:
  schedule:
  # Lightweight user-visible intelligence checks. The 06:17 run is omitted,
  # and the runtime due check also protects the full-refresh window in case a
  # scheduled run is delayed by GitHub Actions and arrives near 06:30.
  - cron: "17 0,2,4,8,10,12,14,16,18,20,22 * * *"
    timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: vciq-repository-writer-${{ github.ref }}
  queue: max

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Scheduled runs can wait behind a full repository writer. Resolve
          # main only after the lock is acquired so the due check sees the
          # newly published snapshot rather than the schedule event's old SHA.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check whether a real news crawl is due
        id: due
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python tools/frequent_refresh_due.py
      - name: Explain lightweight refresh skip
        if: steps.due.outputs.due != 'true'
        run: |
          echo "Lightweight refresh skipped: ${{ steps.due.outputs.reason }}"
          echo "last news crawl: ${{ steps.due.outputs.last_news_crawl_at }}"
          echo "last full refresh: ${{ steps.due.outputs.last_full_refresh_at }}"
      - name: Validate lightweight crawler entry points
        if: steps.due.outputs.due == 'true'
        run: |
          python -m py_compile \
            tools/crawl_with_wechat_registry.py \
            tools/prepare_frequent_refresh.py \
            tools/finalize_frequent_refresh.py \
            tools/frequent_refresh_due.py \
            tools/migrate_article_entities.py \
            tools/enrich_tracking_snapshot.py \
            tools/snapshot_retention.py \
            tools/run_pipeline.py \
            tools/build_pipeline_health.py
          python -m unittest \
            tests.test_professional_media_sources \
            tests.test_snapshot_retention \
            tests.test_frequent_refresh_workflow \
            tests.test_frequent_refresh_audit \
            tests.test_frequent_refresh_due \
            tests.test_pipeline_control
      - name: Record the pre-refresh article baseline
        if: steps.due.outputs.due == 'true'
        run: python tools/prepare_frequent_refresh.py
      - name: Crawl news, tracking, professional media, X and WeChat sources
        if: steps.due.outputs.due == 'true'
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python tools/crawl_with_wechat_registry.py --source news
      - name: Apply deterministic article enrichment and retention
        if: steps.due.outputs.due == 'true'
        run: |
          python tools/migrate_article_entities.py
          python tools/enrich_tracking_snapshot.py
          python tools/snapshot_retention.py
      - name: Validate the lightweight article snapshot
        if: steps.due.outputs.due == 'true'
        run: |
          python tools/validate_professional_media_snapshot.py --require-articles
          python tools/snapshot_retention.py --check
          python tools/crawl_articles.py --validate-only
          python tools/validate_user_source_coverage.py
      - name: Stamp the successful frequent refresh
        if: steps.due.outputs.due == 'true'
        run: python tools/finalize_frequent_refresh.py
      - name: Commit the checked intelligence snapshot
        id: data-update
        if: steps.due.outputs.due == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATA_PATHS=(public/data/articles.json)
          CONTROL_PATHS=(
            public/data/data_lineage.json
            public/data/pipeline_health.json
          )
          SEMANTIC_JSON=$(python tools/semantic_data_diff.py --base HEAD "${DATA_PATHS[@]}")
          echo "$SEMANTIC_JSON"
          SEMANTIC_CHANGED=$(printf '%s' "$SEMANTIC_JSON" | python -c 'import json,sys; print(str(json.load(sys.stdin)["changed"]).lower())')
          if [ "$SEMANTIC_CHANGED" != "true" ]; then
            echo "No semantic article changes; publishing the completed source-crawl audit."
          fi

          python tools/run_pipeline.py finalize \
            public-intelligence-frequent-refresh \
            --quality-gate passed

          git add "${DATA_PATHS[@]}" "${CONTROL_PATHS[@]}"
          if git diff --cached --quiet; then
            echo "No crawl-audit or intelligence changes to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: refresh public intelligence (two-hour check)"

          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main
            python tools/migrate_article_entities.py
            python tools/enrich_tracking_snapshot.py
            python tools/snapshot_retention.py
            python tools/validate_professional_media_snapshot.py --require-articles
            python tools/snapshot_retention.py --check
            python tools/crawl_articles.py --validate-only
            python tools/validate_user_source_coverage.py
            python tools/run_pipeline.py finalize \
              public-intelligence-frequent-refresh \
              --quality-gate passed
            git add "${DATA_PATHS[@]}" "${CONTROL_PATHS[@]}"
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Reconcile derived entity state before publication
        if: steps.data-update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "A real news crawl was published; refresh derived entity and candidate state before Pages."
          gh workflow run company-candidate-discovery.yml --ref main
