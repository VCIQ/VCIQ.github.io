name: iOS checks

on:
  pull_request:
    paths:
      - "ios/VCIQReader/**"
      - ".github/workflows/ios-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate Info.plist
        working-directory: ios/VCIQReader
        run: plutil -lint VCIQReader/Info.plist

      - name: Generate Xcode project
        working-directory: ios/VCIQReader
        run: xcodegen generate

      - name: Compile iOS Simulator app
        working-directory: ios/VCIQReader
        run: |
          set -o pipefail
          xcodebuild \
            -project VCIQReader.xcodeproj \
            -scheme VCIQReader \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/VCIQDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Launch simulator smoke test
        id: simulator_smoke
        env:
          APP_PATH: ${{ runner.temp }}/VCIQDerivedData/Build/Products/Debug-iphonesimulator/VCIQ.app
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location --max-time 20 \
            --output /dev/null https://vciq.github.io/

          SIMULATOR_UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin).get("devices", {})
          choices = []
          for runtime, devices in data.items():
              if "SimRuntime.iOS-" not in runtime:
                  continue
              nums = tuple(int(x) for x in re.findall(r"\d+", runtime.split("SimRuntime.iOS-")[-1]))
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      choices.append((nums, device.get("name", ""), device["udid"]))
          if not choices:
              raise SystemExit("No available iPhone Simulator found")
          choices.sort(reverse=True)
          print(choices[0][2])
          ')"

          echo "udid=$SIMULATOR_UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"

          {
            echo "Simulator: $SIMULATOR_UDID"
            echo "App: $APP_PATH"
            echo "Launch:"
            xcrun simctl launch "$SIMULATOR_UDID" io.vciq.reader
          } | tee "$RUNNER_TEMP/vciq-simulator-info.txt"

          sleep 12
          xcrun simctl io "$SIMULATOR_UDID" screenshot "$RUNNER_TEMP/vciq-home.png"
          test -s "$RUNNER_TEMP/vciq-home.png"

      - name: Upload simulator smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-smoke
          path: |
            ${{ runner.temp }}/vciq-home.png
            ${{ runner.temp }}/vciq-simulator-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Shutdown simulator
        if: always() && steps.simulator_smoke.outputs.udid != ''
        run: |
          xcrun simctl shutdown "${{ steps.simulator_smoke.outputs.udid }}" 2>/dev/null || true
