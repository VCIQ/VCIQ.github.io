name: One-time tracking clean-state gate wiring

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  wire:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/tracking-compound-entity-clean-state-gate-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/tracking-compound-entity-clean-state-gate-v2
          fetch-depth: 0

      - name: Wire the zero-compound hard gate into every repository writer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(
                      f"refusing to patch {path}: expected {expected} exact matches, found {actual}"
                  )
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              ".github/workflows/tracking-discovery.yml",
              "          commit_current_config() {\n",
              "          commit_current_config() {\n"
              "            npm run validate:tracking-entities\n",
          )

          for workflow in (
              ".github/workflows/manual-tracking.yml",
              ".github/workflows/manual-tracking-batch.yml",
          ):
              replace_exact(
                  workflow,
                  "          npm run validate:tracking\n"
                  "          npm run validate:taxonomy\n",
                  "          npm run validate:tracking\n"
                  "          npm run validate:tracking-entities\n"
                  "          npm run validate:taxonomy\n",
              )
              replace_exact(
                  workflow,
                  "          git config user.name \"github-actions[bot]\"\n",
                  "          npm run validate:tracking-entities\n\n"
                  "          git config user.name \"github-actions[bot]\"\n",
              )
          PY

      - name: Commit only the permanent gate wiring and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/tracking-discovery.yml \
            .github/workflows/manual-tracking.yml \
            .github/workflows/manual-tracking-batch.yml
          git rm .github/workflows/apply-tracking-clean-state-gates.yml
          printf 'Staged paths:\n'
          git diff --cached --name-only
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/apply-tracking-clean-state-gates.yml .github/workflows/manual-tracking-batch.yml .github/workflows/manual-tracking.yml .github/workflows/tracking-discovery.yml "
          git commit -m 'tracking: hard-gate every repository writer on clean state'
          git push origin HEAD:fix/tracking-compound-entity-clean-state-gate-v2
