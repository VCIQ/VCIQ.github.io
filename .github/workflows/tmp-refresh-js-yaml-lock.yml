name: Temporary js-yaml security lock refresher

on:
  push:
    branches:
      - security/next-16-3-4-20260908

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/next-16-3-4-20260908
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Refresh js-yaml override and lockfile
        shell: bash
        run: |
          npm pkg set 'overrides.js-yaml=4.3.2'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "js-yaml override and lockfile are already current"
            exit 0
          fi
          git commit -m "fix: update js-yaml override for new advisory"
          git push origin HEAD:security/next-16-3-4-20260908
