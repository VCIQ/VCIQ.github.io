name: Regenerate fast-uri lockfile

on:
  push:
    branches:
      - security/fast-uri-3-1-6
    paths:
      - package.json
      - .github/workflows/regenerate-fast-uri-lock.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out security branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile from the pinned override
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify the patched dependency
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (pkg.overrides?.['fast-uri'] !== '3.1.6') {
            throw new Error('package.json does not pin fast-uri 3.1.6');
          }
          if (lock.packages?.['node_modules/fast-uri']?.version !== '3.1.6') {
            throw new Error('package-lock.json does not resolve fast-uri 3.1.6');
          }
          NODE

      - name: Commit the generated lockfile and remove this bootstrap workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/regenerate-fast-uri-lock.yml
          git commit -m "security: refresh fast-uri lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}
