name: Read-only repository writer queue audit v2

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  actions: read

jobs:
  audit:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'audit/writer-queue-current-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Measure current writer queue latency
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json, math, os, re, urllib.parse, urllib.request
          from collections import Counter
          from datetime import UTC, datetime, timedelta
          from pathlib import Path

          workflows_dir = Path('.github/workflows')
          marker = 'vciq-repository-writer-$' + '{{ github.ref }}'
          repo = os.environ['GH_REPO']
          token = os.environ['GH_TOKEN']
          now = datetime.now(UTC)
          cutoff = now - timedelta(days=14)

          def parse_dt(value):
              return datetime.fromisoformat(value.replace('Z', '+00:00')) if value else None

          def delta(a, b):
              return max(0.0, (a - b).total_seconds()) if a and b else None

          def api(path):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/{path}',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'vciq-writer-queue-audit',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def pct(values, q):
              if not values:
                  return None
              values = sorted(values)
              index = max(0, min(len(values) - 1, math.ceil(q * len(values)) - 1))
              return values[index]

          def job_specs(text):
              if '\njobs:' not in text:
                  return []
              jobs = text.split('\njobs:', 1)[1]
              headers = list(re.finditer(r'^  ([A-Za-z0-9_-]+):\s*$', jobs, re.MULTILINE))
              result = []
              for i, match in enumerate(headers):
                  block = jobs[match.end() : headers[i + 1].start() if i + 1 < len(headers) else len(jobs)]
                  if marker not in block:
                      continue
                  name = re.search(r'^    name:\s*(.+?)\s*$', block, re.MULTILINE)
                  result.append((match.group(1), name.group(1).strip(' "\'') if name else match.group(1)))
              return result

          specs = []
          for path in sorted(workflows_dir.glob('*.yml')):
              text = path.read_text(encoding='utf-8')
              if marker not in text:
                  continue
              top = text.split('\njobs:', 1)[0]
              specs.append({
                  'file': path.name,
                  'level': 'workflow' if marker in top else 'job',
                  'writerJobs': job_specs(text),
              })

          rows = []
          for spec in specs:
              workflow_id = urllib.parse.quote(spec['file'], safe='')
              payload = api(f'actions/workflows/{workflow_id}/runs?branch=main&per_page=100')
              runs = [
                  run for run in payload.get('workflow_runs', [])
                  if parse_dt(run.get('created_at')) and parse_dt(run.get('created_at')) >= cutoff
              ]
              waits, durations, writer_latencies, queued_ages = [], [], [], []
              events, conclusions = Counter(), Counter()
              samples = []
              writer_queued_now = 0

              for index, run in enumerate(runs):
                  created = parse_dt(run.get('created_at'))
                  started = parse_dt(run.get('run_started_at'))
                  updated = parse_dt(run.get('updated_at'))
                  wait = delta(started, created)
                  duration = delta(updated, started)
                  if wait is not None:
                      waits.append(wait)
                  if duration is not None and run.get('status') == 'completed':
                      durations.append(duration)
                  if run.get('status') == 'queued' and created:
                      queued_ages.append((now - created).total_seconds())
                  events[run.get('event') or 'unknown'] += 1
                  conclusions[run.get('conclusion') or run.get('status') or 'unknown'] += 1

                  writer_latency = None
                  writer_status = None
                  if spec['level'] == 'job' and spec['writerJobs'] and index < 30:
                      jobs = api(f"actions/runs/{run['id']}/jobs?per_page=100").get('jobs', [])
                      names = {name for pair in spec['writerJobs'] for name in pair}
                      target = [job for job in jobs if str(job.get('name') or '') in names]
                      if target:
                          writer = target[0]
                          writer_status = writer.get('status')
                          writer_latency = delta(parse_dt(writer.get('started_at')), created)
                          if writer_latency is not None:
                              writer_latencies.append(writer_latency)
                          if writer_status == 'queued':
                              writer_queued_now += 1

                  if len(samples) < 10:
                      samples.append({
                          'id': run['id'],
                          'event': run.get('event'),
                          'status': run.get('status'),
                          'conclusion': run.get('conclusion'),
                          'createdAt': run.get('created_at'),
                          'startedAt': run.get('run_started_at'),
                          'startWaitSeconds': wait,
                          'writerJobStartLatencySeconds': writer_latency,
                          'writerJobStatus': writer_status,
                          'durationSeconds': duration,
                          'displayTitle': run.get('display_title'),
                      })

              rows.append({
                  **spec,
                  'runs14d': len(runs),
                  'queuedNow': sum(run.get('status') == 'queued' for run in runs),
                  'inProgressNow': sum(run.get('status') == 'in_progress' for run in runs),
                  'writerJobsQueuedNowObserved': writer_queued_now,
                  'events': dict(events),
                  'conclusions': dict(conclusions),
                  'workflowStartWaitSeconds': {
                      'p50': pct(waits, .5), 'p90': pct(waits, .9), 'max': max(waits) if waits else None,
                  },
                  'writerJobStartLatencySeconds': {
                      'p50': pct(writer_latencies, .5), 'p90': pct(writer_latencies, .9), 'max': max(writer_latencies) if writer_latencies else None,
                  },
                  'completedDurationSeconds': {
                      'p50': pct(durations, .5), 'p90': pct(durations, .9), 'max': max(durations) if durations else None,
                  },
                  'oldestQueuedAgeSeconds': max(queued_ages) if queued_ages else None,
                  'recentSamples': samples,
              })

          report = {
              'generatedAt': now.isoformat(),
              'windowDays': 14,
              'writerWorkflowCount': len(rows),
              'workflows': rows,
          }
          print('WRITER_QUEUE_AUDIT_V2=' + json.dumps(report, ensure_ascii=False, sort_keys=True))
          if not rows:
              raise SystemExit('writer workflow inventory unexpectedly empty')
          PY
