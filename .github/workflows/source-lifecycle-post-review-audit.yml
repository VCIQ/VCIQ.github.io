name: Persist post-review Source lifecycle audit

on:
  push:
    branches:
      - audit/source-lifecycle-post-review-20260903
    paths:
      - tests/source-lifecycle-post-review-audit.test.ts
      - .github/workflows/source-lifecycle-post-review-audit.yml

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[audit-result]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run read-only lifecycle audit
        run: |
          set -o pipefail
          node --import tsx --test tests/source-lifecycle-post-review-audit.test.ts \
            | tee /tmp/source-lifecycle-post-review-audit.log

      - name: Persist structured audit result
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          log = Path('/tmp/source-lifecycle-post-review-audit.log').read_text(encoding='utf-8')
          prefix = 'SOURCE_LIFECYCLE_POST_REVIEW_AUDIT='
          payloads = [line.split(prefix, 1)[1] for line in log.splitlines() if prefix in line]
          if not payloads:
              raise SystemExit('missing structured audit output')

          data = json.loads(payloads[-1])
          output = Path('audit-results/source-lifecycle-post-review-audit.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate and commit result
        run: |
          set -euo pipefail
          python -m json.tool audit-results/source-lifecycle-post-review-audit.json >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-results/source-lifecycle-post-review-audit.json
          git rm .github/workflows/source-lifecycle-post-review-audit.yml
          git commit -m "audit: persist post-review lifecycle result [audit-result]"
          git push origin HEAD:${GITHUB_REF_NAME}
