name: Ops refresh tracking snapshot

on:
  push:
    branches:
      - ops/refresh-tracking-snapshot
    paths:
      - .github/workflows/ops-refresh-tracking-snapshot.yml

permissions:
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only the feature-triggered PDF refresh before commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: "33251977840"
        shell: bash
        run: |
          set -euo pipefail
          status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}" --jq .status)
          echo "PDF refresh ${TARGET_RUN_ID} status=${status}"
          case "$status" in
            queued|pending|in_progress|waiting|requested)
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/cancel"
              echo "cancel requested before PDF archive commit"
              ;;
            *)
              echo "PDF refresh is already terminal; no action required"
              ;;
          esac
