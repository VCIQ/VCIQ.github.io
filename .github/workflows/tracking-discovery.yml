name: Tracking entity discovery

# Expands tracking from public web sources and the site's verified company and
# institution datasets. The venture-capital lane directly references the full
# investment-institution directory; verified institution teams then provide
# people and public team/account sources. Owner-deleted automatic entries remain
# tombstoned and are never silently restored. Automatic seeds carry provenance,
# confidence and expiry metadata and must pass lifecycle governance before use.

on:
  push:
    branches: [main]
    paths:
      # A rollout of seed-governance code/policy gets one governance-only pass on
      # current main. The config commit itself does not match these paths, so this
      # cannot recurse. Normal entity expansion remains scheduled/manual.
      - tools/tracking_seed_governance.py
      - .github/workflows/tracking-discovery.yml
  schedule:
    # Discover entities before the next daily full refresh consumes them.
    - cron: "0 3 * * 0"
      timezone: "Asia/Taipei"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = team/social/channel discovery + entity rotation; seed-only = team/social/channel discovery + new tracks"
        default: "full"
        type: choice
        options: [full, seed-only]

permissions:
  contents: write

concurrency:
  group: vciq-repository-writer-${{ github.ref }}
  queue: max

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked project dependencies
        run: npm ci

      - name: Validate institution, sample-company and public-channel discovery
        run: |
          node --import tsx scripts/sync-tracking-institution-directory.ts --dry-run
          python -m py_compile tools/tracking_seed_governance.py
          python -m py_compile tools/tracking_source_governance.py
          python -m py_compile tools/enrich_tracking_institutions.py
          python -m py_compile tools/enrich_tracking_people_from_sample_companies.py
          python -m py_compile tools/enrich_tracking_person_channels.py
          python -m unittest \
            tests.test_tracking_seed_governance \
            tests.test_tracking_source_governance \
            tests.test_tracking_institution_people \
            tests.test_tracking_sample_company_people \
            tests.test_tracking_person_channels

      - name: Govern tracking seeds before discovery
        id: seed-governance-before
        shell: bash
        run: |
          set -euo pipefail
          python tools/tracking_seed_governance.py | tee /tmp/seed-governance-before.json
          CHANGED=$(python -c "import json;print(str(json.load(open('/tmp/seed-governance-before.json'))['changed']).lower())")
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Normalize automatic sources before discovery
        id: source-governance-before
        shell: bash
        run: |
          set -euo pipefail
          python tools/tracking_source_governance.py | tee /tmp/source-governance-before.json
          CHANGED=$(python -c "import json;print(str(json.load(open('/tmp/source-governance-before.json'))['changed']).lower())")
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Expand tracking entities from public web sources
        id: expand
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          MODE="full"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          fi
          echo "mode=$MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = "seed-only" ]; then
            python tools/expand_tracking_entities.py --seed-new-only | tee /tmp/discovery.json
          else
            python tools/expand_tracking_entities.py \
              --max-tracks 12 \
              --max-requests 240 | tee /tmp/discovery.json
          fi
          CHANGED=$(python -c "import json;print(str(json.load(open('/tmp/discovery.json'))['changed']).lower())")
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Reference the complete investment-institution directory
        id: directory
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/sync-tracking-institution-directory.ts \
            | tee /tmp/institution-directory-sync.json
          CHANGED=$(node -e "const fs=require('fs');console.log(String(JSON.parse(fs.readFileSync('/tmp/institution-directory-sync.json','utf8')).changed))")
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Reuse verified institution teams and public accounts
        id: institutions
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.enrich_tracking_institutions \
            --max-requests 50 | tee /tmp/institution-discovery.json
          CHANGED=$(python -c "import json;print(str(json.load(open('/tmp/institution-discovery.json'))['changed']).lower())")
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Discover founders, core team and public social accounts
        id: team
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          python tools/enrich_tracking_people_from_sample_companies.py \
            --max-tracks 20 \
            --max-requests 70 | tee /tmp/team-discovery.json
          CHANGED=$(python -c "import json;print(str(json.load(open('/tmp/team-discovery.json'))['changed']).lower())")
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Register public communities and media columns
        id: channels
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          python tools/enrich_tracking_person_channels.py \
            --max-tracks 20 | tee /tmp/channel-discovery.json
          CHANGED=$(python -c "import json;print(str(json.load(open('/tmp/channel-discovery.json'))['changed']).lower())")
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Govern tracking seeds after discovery
        id: seed-governance-after
        shell: bash
        run: |
          set -euo pipefail
          python tools/tracking_seed_governance.py | tee /tmp/seed-governance-after.json
          CHANGED=$(python -c "import json;print(str(json.load(open('/tmp/seed-governance-after.json'))['changed']).lower())")
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Normalize automatic sources after discovery
        id: source-governance-after
        shell: bash
        run: |
          set -euo pipefail
          python tools/tracking_source_governance.py | tee /tmp/source-governance-after.json
          CHANGED=$(python -c "import json;print(str(json.load(open('/tmp/source-governance-after.json'))['changed']).lower())")
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Consolidate discovery changes
        id: changes
        shell: bash
        run: |
          if [ "${{ steps.seed-governance-before.outputs.changed }}" = "true" ] || \
             [ "${{ steps.source-governance-before.outputs.changed }}" = "true" ] || \
             [ "${{ steps.expand.outputs.changed }}" = "true" ] || \
             [ "${{ steps.directory.outputs.changed }}" = "true" ] || \
             [ "${{ steps.institutions.outputs.changed }}" = "true" ] || \
             [ "${{ steps.team.outputs.changed }}" = "true" ] || \
             [ "${{ steps.channels.outputs.changed }}" = "true" ] || \
             [ "${{ steps.seed-governance-after.outputs.changed }}" = "true" ] || \
             [ "${{ steps.source-governance-after.outputs.changed }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate the expanded config before committing
        if: steps.changes.outputs.changed == 'true'
        run: |
          python tools/tracking_seed_governance.py --check
          python tools/tracking_source_governance.py --check
          npm run validate:tracking
          node --import tsx scripts/validate-new-tracking-entities.ts --base-ref HEAD
          npm run validate:taxonomy

      - name: Commit expanded tracking config
        if: steps.changes.outputs.changed == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPAND_MODE: ${{ steps.expand.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          DISCOVERY_MODE="$EXPAND_MODE"
          if [ "$EVENT_NAME" = "push" ]; then
            DISCOVERY_MODE="govern-only"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_current_config() {
            git add \
              config/user_tracking.json \
              config/tracking_auto_discovery.json \
              public/data/source_health.json
            if git diff --cached --quiet; then
              return 1
            fi
            if [ "$DISCOVERY_MODE" = "govern-only" ]; then
              git commit -m "config: govern automatic tracking seed lifecycle"
            else
              git commit -m "config: expand tracking entities from public web sources [auto-discovery]"
            fi
          }

          regenerate_from_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            python tools/tracking_seed_governance.py \
              | tee /tmp/seed-governance-before-replay.json
            python tools/tracking_source_governance.py \
              | tee /tmp/source-governance-before-replay.json

            if [ "$DISCOVERY_MODE" != "govern-only" ]; then
              if [ "$DISCOVERY_MODE" = "seed-only" ]; then
                python tools/expand_tracking_entities.py --seed-new-only \
                  | tee /tmp/discovery-replay.json
              else
                python tools/expand_tracking_entities.py \
                  --max-tracks 12 \
                  --max-requests 240 | tee /tmp/discovery-replay.json
              fi
              node --import tsx scripts/sync-tracking-institution-directory.ts \
                | tee /tmp/institution-directory-sync-replay.json
              python -m tools.enrich_tracking_institutions \
                --max-requests 50 | tee /tmp/institution-discovery-replay.json
              python tools/enrich_tracking_people_from_sample_companies.py \
                --max-tracks 20 \
                --max-requests 70 | tee /tmp/team-discovery-replay.json
              python tools/enrich_tracking_person_channels.py \
                --max-tracks 20 | tee /tmp/channel-discovery-replay.json
              python tools/tracking_seed_governance.py \
                | tee /tmp/seed-governance-after-replay.json
              python tools/tracking_source_governance.py \
                | tee /tmp/source-governance-after-replay.json
            fi

            python tools/tracking_seed_governance.py --check
            python tools/tracking_source_governance.py --check
            npm run validate:tracking
            node --import tsx scripts/validate-new-tracking-entities.ts --base-ref HEAD
            npm run validate:taxonomy
          }

          if ! commit_current_config; then
            echo "nothing to commit"
            exit 0
          fi

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "main advanced; replaying discovery from latest main (attempt $((attempt + 1))/3)"
            regenerate_from_latest_main
            if ! commit_current_config; then
              echo "latest main already contains all discovery changes"
              exit 0
            fi
          done
