name: One-shot priority vs channel semantics

on:
  push:
    branches: [fix/priority-filter-not-channel]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/priority-filter-not-channel
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply channel semantics contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          feed_path = Path('components/homepage-news-feed.tsx')
          feed = feed_path.read_text(encoding='utf-8')
          marker = 'const CHANNELS: ReadonlyArray<{\n'
          replacement = '// Homepage channels answer “what topic/object do I want to read?”. Priority (P0/P1/P2)\n// stays orthogonal as ranking/filter metadata and must not become a top-level channel.\nconst CHANNELS: ReadonlyArray<{\n'
          if marker not in feed:
              raise SystemExit('CHANNELS marker not found')
          if 'Priority (P0/P1/P2)' not in feed:
              feed = feed.replace(marker, replacement, 1)
          feed = feed.replace('aria-label="情报频道"', 'aria-label="情报频道（主题与对象；优先级不作为频道）"', 1)
          feed_path.write_text(feed, encoding='utf-8')

          test_path = Path('tests/homepage-action-semantics.test.ts')
          tests = test_path.read_text(encoding='utf-8')
          block = '''\n\ntest("homepage keeps P0/P1/P2 as priority metadata rather than top-level channels", async () => {\n  const feed = await source("components/homepage-news-feed.tsx");\n  assert.match(feed, /情报频道（主题与对象；优先级不作为频道）/u);\n  assert.match(feed, /label: "AI \\/ AGI"/u);\n  assert.match(feed, /label: "人物"/u);\n  assert.match(feed, /label: "公司"/u);\n  assert.doesNotMatch(feed, /\\{ id: "p[012]", label: "P[012]"/u);\n  assert.doesNotMatch(feed, /label: "P0"|label: "P1"|label: "P2"/u);\n});\n'''
          if 'homepage keeps P0/P1/P2 as priority metadata rather than top-level channels' not in tests:
              tests += block
          test_path.write_text(tests, encoding='utf-8')
          PY
          rm .github/workflows/one-shot-priority-channel-semantics.yml
      - name: Install and targeted test
        run: |
          npm ci
          node --import tsx --test tests/homepage-action-semantics.test.ts
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/homepage-news-feed.tsx tests/homepage-action-semantics.test.ts .github/workflows/one-shot-priority-channel-semantics.yml
          git commit -m "test: keep priority orthogonal to homepage channels"
          git push origin HEAD:fix/priority-filter-not-channel
