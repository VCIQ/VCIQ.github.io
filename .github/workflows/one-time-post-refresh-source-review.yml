name: One-time post-refresh source review

on:
  workflow_run:
    workflows:
      - Refresh public intelligence
    types:
      - completed

permissions:
  contents: write
  issues: write

concurrency:
  group: one-time-post-refresh-source-review
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require a refresh that includes the evidence pipeline
        id: guard
        env:
          REFRESH_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          REQUIRED_SHA="6c49fe69f7a2f6f81c5c4d118a14bb629a406965"
          if git merge-base --is-ancestor "$REQUIRED_SHA" "$REFRESH_HEAD_SHA"; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "Using post-#432 refresh $REFRESH_HEAD_SHA."
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Ignoring pre-#432 refresh $REFRESH_HEAD_SHA; the one-time workflow remains installed."
          fi

      - name: Validate source performance and manual review rules
        if: steps.guard.outputs.eligible == 'true'
        run: |
          python -m py_compile \
            tools/source_performance.py \
            tools/source_quality_reviews.py \
            tools/source_performance_review.py \
            tools/source_quality_review_queue.py \
            tools/update_source_health.py
          python -m unittest \
            tests.test_source_performance \
            tests.test_source_quality_reviews \
            tests.test_source_performance_review \
            tests.test_source_quality_review_queue \
            tests.test_source_health_performance
          python - <<'PY'
          from tools.source_quality_reviews import load_review_manifest
          load_review_manifest()
          PY

      - name: Generate post-refresh review queue
        if: steps.guard.outputs.eligible == 'true'
        run: |
          python tools/source_performance_review.py
          python tools/source_performance_review.py --check
          python tools/source_quality_review_queue.py
          python tools/source_quality_review_queue.py --check

      - name: Commit review outputs and remove this one-time workflow
        if: steps.guard.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/data/source_performance_review.json \
            public/data/source_quality_review_queue.json \
            docs/source-performance-review.md \
            docs/source-quality-review-queue.md
          git rm --ignore-unmatch .github/workflows/one-time-post-refresh-source-review.yml
          git commit -m "data: generate post-refresh source review queue"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            python tools/source_performance_review.py
            python tools/source_performance_review.py --check
            python tools/source_quality_review_queue.py
            python tools/source_quality_review_queue.py --check
            git add \
              public/data/source_performance_review.json \
              public/data/source_quality_review_queue.json \
              docs/source-performance-review.md \
              docs/source-quality-review-queue.md
            git rm --ignore-unmatch .github/workflows/one-time-post-refresh-source-review.yml
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done

      - name: Sync monthly review issue
        if: steps.guard.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE='[月度审查] 信源效能与降级建议'
          ISSUE_BODY="$RUNNER_TEMP/source-review-issue.md"
          cat docs/source-performance-review.md > "$ISSUE_BODY"
          cat >> "$ISSUE_BODY" <<'EOF'

          ## 记录级人工抽样

          具体待审 record ID、原始 URL 与 `sampleDigest` 见 [信源人工质量抽样队列](https://github.com/VCIQ/VCIQ.github.io/blob/main/docs/source-quality-review-queue.md)。人工判断完成后，仍按现有 schema 将汇总计数写入 `config/source_quality_reviews.json`；不要自动生成误归属结论。
          EOF
          ISSUE_NUMBER=$(gh issue list \
            --state open \
            --search "$TITLE in:title" \
            --json number,title \
            --jq '.[] | select(.title == "[月度审查] 信源效能与降级建议") | .number' \
            | head -n 1)
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --body-file "$ISSUE_BODY"
          else
            gh issue create --title "$TITLE" --body-file "$ISSUE_BODY"
          fi
