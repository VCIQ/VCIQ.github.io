name: Research channel visual QA

on:
  pull_request:
    paths:
      - "app/technologies/**"
      - "app/people/**"
      - "app/companies/**"
      - "app/sources/**"
      - "components/channel-split-layout*"
      - "components/research-synergy-strip*"
      - ".github/workflows/research-channel-visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked project dependencies
        run: npm ci
      - name: Rebuild tracking-derived snapshot for candidate PR config
        run: python tools/enrich_tracking_snapshot.py
      - name: Build static Pages candidate
        run: npm run build:pages
      - name: Install Chromium for visual QA
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Serve candidate
        shell: bash
        run: |
          python3 -m http.server 4173 --directory out > /tmp/vciq-visual-qa-server.log 2>&1 &
          echo $! > /tmp/vciq-visual-qa-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/technologies/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vciq-visual-qa-server.log
          exit 1
      - name: Capture first-screen screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-qa/candidate visual-qa/production
          routes=(technologies people companies sources)
          for route in "${routes[@]}"; do
            npx --yes playwright@1.55.0 screenshot \
              --browser chromium \
              --viewport-size "1440,900" \
              --wait-for-timeout 1000 \
              "http://127.0.0.1:4173/${route}/" \
              "visual-qa/candidate/${route}-desktop.png"
            npx --yes playwright@1.55.0 screenshot \
              --browser chromium \
              --viewport-size "390,844" \
              --wait-for-timeout 1000 \
              "http://127.0.0.1:4173/${route}/" \
              "visual-qa/candidate/${route}-mobile.png"

            if curl --fail --silent --location "https://vciq.github.io/${route}/" >/dev/null; then
              npx --yes playwright@1.55.0 screenshot \
                --browser chromium \
                --viewport-size "1440,900" \
                --wait-for-timeout 1000 \
                "https://vciq.github.io/${route}/" \
                "visual-qa/production/${route}-desktop.png" || true
              npx --yes playwright@1.55.0 screenshot \
                --browser chromium \
                --viewport-size "390,844" \
                --wait-for-timeout 1000 \
                "https://vciq.github.io/${route}/" \
                "visual-qa/production/${route}-mobile.png" || true
            fi
          done
          printf '%s\n' \
            "Candidate merge commit: ${GITHUB_SHA}" \
            "Desktop viewport: 1440x900" \
            "Mobile viewport: 390x844" \
            "Purpose: first-screen hierarchy comparison only" \
            > visual-qa/README.txt
      - name: Upload visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-channel-visual-qa
          path: visual-qa
          retention-days: 3
          if-no-files-found: error
