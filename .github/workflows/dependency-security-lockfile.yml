name: Generate dependency security lockfile

on:
  push:
    branches:
      - fix/next-sharp-security-20260908

permissions:
  contents: write

jobs:
  update-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Update patched dependencies and lockfile
        run: |
          npm pkg set 'dependencies.next=16.3.4'
          npm pkg set 'devDependencies.eslint-config-next=16.3.4'
          npm pkg set 'overrides.sharp=0.35.4'
          npm pkg set 'overrides.js-yaml=4.3.2'
          npm install --package-lock-only --ignore-scripts

      - name: Verify dependency audit
        run: node scripts/audit-dependencies.mjs

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency changes generated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix: patch Next.js, sharp, and js-yaml advisories [lockfile-generated]'
          git push origin HEAD:${{ github.ref_name }}
