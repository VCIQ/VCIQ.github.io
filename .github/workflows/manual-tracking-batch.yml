name: Internal manual tracking batch
run-name: ${{ inputs.dispatch_token != '' && format('VCIQ durable apply {0} {1}', inputs.dispatch_token, inputs.dispatch_digest) || '' }}

# Authenticated batch companion to manual-tracking.yml. The input JSON and job
# summaries are visible because this repository is public; never submit secrets,
# private URLs, personal data, or confidential investment notes.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Validate previews the transaction; apply writes it to main"
        required: true
        default: validate
        type: choice
        options: [validate, apply]
      invalid_policy:
        description: "strict rejects the whole batch; skip may omit invalid automatic/manual-confirmed candidates; direct manual stays fail-closed"
        required: true
        default: strict
        type: choice
        options: [strict, skip]
      batch_json:
        description: "Up to 20 normalized requests per atomic writer transaction; background reconciliation is separate"
        required: true
        type: string

      dispatch_token:
        description: "Optional random UUIDv4 transport correlation; never an actor or private operation ID"
        required: false
        default: ""
        type: string
      dispatch_digest:
        description: "Optional SHA256 of v1 LF policy LF exact public batch_json UTF-8 bytes"
        required: false
        default: ""
        type: string

permissions: {}

env:
  EXPECTED_REPOSITORY: VCIQ/VCIQ.github.io

jobs:
  authorize:
    name: Authorize internal operator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require the canonical repository and main branch
        env:
          ACTUAL_REPOSITORY: ${{ github.repository }}
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ACTUAL_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$ACTUAL_REF" = "refs/heads/main"
          test "$ACTUAL_EVENT" = "workflow_dispatch"

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Require both initiator and rerun actor to be allowlisted
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          admins = json.loads(Path("config/tracking_admins.json").read_text(encoding="utf-8"))
          allowed = {
              str(actor).strip().casefold()
              for actor in admins.get("actors", [])
              if str(actor).strip()
          }
          checked = {
              "github.actor": os.environ.get("ACTOR", "").strip(),
              "github.triggering_actor": os.environ.get("TRIGGERING_ACTOR", "").strip(),
          }
          denied = [label for label, actor in checked.items() if actor.casefold() not in allowed]
          if denied:
            raise SystemExit("manual tracking actor is not allowlisted: " + ", ".join(denied))
          print("authorized actors: " + ", ".join(checked.values()))
          PY

      - name: Validate durable dispatch correlation v1
        env:
          DISPATCH_TOKEN: ${{ inputs.dispatch_token }}
          DISPATCH_DIGEST: ${{ inputs.dispatch_digest }}
          OPERATION: ${{ inputs.operation }}
          INVALID_POLICY: ${{ inputs.invalid_policy }}
          BATCH_JSON: ${{ inputs.batch_json }}
        run: python tools/manual_tracking_correlation.py

  validate:
    name: Validate batch manual tracking request
    needs: authorize
    if: inputs.operation == 'validate'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: tracking-admin
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate the full batch as one transaction
        env:
          BATCH_JSON: ${{ inputs.batch_json }}
          INVALID_POLICY: ${{ inputs.invalid_policy }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/manual_tracking.py \
            tools/manual_tracking_batch.py \
            tools/manual_tracking_keyword_support.py \
            tools/manual_tracking_batch_entrypoint.py \
            tools/tracking_manual_feedback.py \
            tools/expand_tracking_entities.py \
            tools/strict_tracking_config.py
          python tools/manual_tracking_batch_entrypoint.py \
            --mode validate \
            --invalid-policy "$INVALID_POLICY" \
            --batch-json "$BATCH_JSON" \
            --actor "$ACTOR" \
            --triggering-actor "$TRIGGERING_ACTOR" \
            | tee /tmp/manual-tracking-batch-preview.json
          {
            echo "## Manual tracking batch validation"
            echo
            echo '```json'
            cat /tmp/manual-tracking-batch-preview.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply batch manual tracking request
    needs: authorize
    if: inputs.operation == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: tracking-admin
    concurrency:
      group: vciq-repository-writer-${{ github.ref }}
      queue: max
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.manual.outputs.changed }}
      config_changed: ${{ steps.manual.outputs.config_changed }}
      review_queued: ${{ steps.manual.outputs.review_queued }}
      intents_changed: ${{ steps.manual.outputs.intents_changed }}
      has_company: ${{ steps.manual.outputs.has_company }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Capture the exact main revision being edited
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Apply the authorized batch atomically
        id: manual
        env:
          BATCH_JSON: ${{ inputs.batch_json }}
          INVALID_POLICY: ${{ inputs.invalid_policy }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/manual_tracking.py \
            tools/manual_tracking_batch.py \
            tools/manual_tracking_keyword_support.py \
            tools/manual_tracking_batch_entrypoint.py \
            tools/tracking_manual_feedback.py \
            tools/expand_tracking_entities.py \
            tools/strict_tracking_config.py
          python tools/manual_tracking_batch_entrypoint.py \
            --mode apply \
            --invalid-policy "$INVALID_POLICY" \
            --batch-json "$BATCH_JSON" \
            --actor "$ACTOR" \
            --triggering-actor "$TRIGGERING_ACTOR" \
            | tee /tmp/manual-tracking-batch-result.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          try:
              report = json.loads(Path("/tmp/manual-tracking-batch-result.json").read_text(encoding="utf-8"))
          except json.JSONDecodeError as exc:
              raise SystemExit("manual_tracking_batch_entrypoint.py did not emit one JSON report") from exc
          if not isinstance(report, dict) or "ok" not in report or "changed" not in report:
              raise SystemExit("manual tracking batch report is missing top-level status fields")
          output_names = {
              "changed": "changed",
              "config_changed": "configChanged",
              "intents_changed": "intentsChanged",
              "review_queued": "reviewQueued",
          }
          has_company = any(
              isinstance(item, dict)
              and isinstance(item.get("request"), dict)
              and item["request"].get("kind") == "company"
              for item in report.get("items", [])
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for output_name, report_name in output_names.items():
                  value = str(bool(report.get(report_name, False))).lower()
                  output.write(f"{output_name}={value}\n")
              output.write(f"has_company={str(has_company).lower()}\n")
          PY

      - name: Validate changed tracking configuration
        if: steps.manual.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          python -m unittest \
            tests.test_manual_tracking \
            tests.test_manual_tracking_batch \
            tests.test_manual_tracking_keyword \
            tests.test_manual_tracking_workflow \
            tests.test_tracking_manual_feedback \
            tests.test_expand_tracking_entities
          npm run validate:tracking
          npm run validate:taxonomy
          python tools/tracking_source_governance.py --check

      - name: Commit and push only approved configuration files
        if: steps.manual.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "main advanced while the batch was running; refusing to replay or overwrite it"
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            config/tracking_intents.json \
            config/user_tracking.json \
            config/tracking_capture_inbox.json
          git diff --cached --quiet && {
            echo "batch writer reported a change but no approved file changed"
            exit 1
          }
          git commit -m "config: apply authenticated manual tracking batch"

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "main advanced before push; refusing to rebase, force, or overwrite it"
            exit 1
          }
          gh auth setup-git
          local_sha="$(git rev-parse HEAD)"
          max_push_attempts=3
          push_attempt=1
          while true; do
            push_log="$(mktemp)"
            if git push origin HEAD:main >"$push_log" 2>&1; then
              cat "$push_log"
              rm -f "$push_log"
              break
            fi
            push_status=$?
            cat "$push_log" >&2

            # A transport error can happen after GitHub accepted the commit but
            # before the runner received the success response. Resolve that
            # uncertainty before deciding whether a retry is safe.
            git fetch origin main
            remote_sha="$(git rev-parse origin/main)"
            if [ "$remote_sha" = "$local_sha" ]; then
              echo "push response was unsuccessful, but main already contains the exact local commit"
              rm -f "$push_log"
              break
            fi
            if [ "$remote_sha" != "$BASE_SHA" ]; then
              echo "main advanced after a failed push; refusing to replay, rebase, force, or overwrite it"
              rm -f "$push_log"
              exit 1
            fi

            if [ "$push_attempt" -ge "$max_push_attempts" ]; then
              echo "push failed after $push_attempt attempts"
              rm -f "$push_log"
              exit "$push_status"
            fi
            if ! grep -Eqi 'Internal Server Error|HTTP[^0-9]*(500|502|503|504)|remote:.*(500|502|503|504)|RPC failed.*(500|502|503|504)|connection reset|timed? out|temporar(il)?y unavailable' "$push_log"; then
              echo "push failed with a non-transient error; not retrying"
              rm -f "$push_log"
              exit "$push_status"
            fi

            rm -f "$push_log"
            delay=$((push_attempt * 5))
            push_attempt=$((push_attempt + 1))
            echo "transient GitHub push failure; retrying attempt $push_attempt/$max_push_attempts after ${delay}s"
            sleep "$delay"
          done

      - name: Summarize the public audit record
        if: always() && steps.manual.outcome != 'skipped'
        shell: bash
        run: |
          {
            echo "## Manual tracking batch apply"
            echo
            echo "> This repository is public. Inputs, logs, and committed audit records are not confidential."
            echo
            echo '```json'
            cat /tmp/manual-tracking-batch-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  handoff:
    name: Defer heavy tracking reconciliation
    needs: apply
    if: needs.apply.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Record deferred reconciliation policy
        shell: bash
        run: |
          {
            echo "## Deferred tracking reconciliation"
            echo
            echo "The atomic batch write is complete."
            echo "Heavy discovery and full refresh are intentionally not started from this interactive workflow."
            echo "Multiple manual batches can accumulate and are coalesced by the low-priority reconciliation workflow; this job only nudges that cheap coordinator immediately."
            echo "The 20-object limit remains a per-transaction safety boundary, not a background throughput limit."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Nudge the coalesced reconciliation coordinator
        run: gh workflow run manual-tracking-reconciliation.yml --ref main --repo "$GITHUB_REPOSITORY"
