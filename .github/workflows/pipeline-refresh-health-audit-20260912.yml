name: Read-only refresh health audit 20260912
on:
  push:
    branches: [audit/pipeline-refresh-health-20260912]
    paths: [.github/workflows/pipeline-refresh-health-audit-20260912.yml]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect recent runs and exact production clocks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/refresh-health-audit
          python - <<'PY'
          import datetime, json, pathlib, re, subprocess, urllib.request
          root = pathlib.Path.cwd()
          out = pathlib.Path('/tmp/refresh-health-audit')
          repo = 'VCIQ/VCIQ.github.io'
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True, timeout=60))
          def load(path):
              return json.loads((root/path).read_text())
          report = {'generatedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'sourceSha': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()}
          report['health'] = load('public/data/pipeline_health.json')
          report['lineage'] = load('public/data/data_lineage.json')
          report['articleRefreshAudit'] = load('public/data/articles.json').get('refreshAudit')
          report['workflows'] = {}
          names = ['frequent-intelligence-refresh.yml','tracking-discovery.yml','star-market-investor-refresh.yml']
          run_keys = ['id','name','event','status','conclusion','created_at','updated_at','run_started_at','run_attempt','head_sha','html_url']
          for name in names:
              base = f'repos/{repo}/actions/workflows/{name}'
              metadata = api(base)
              result = {'metadata': {k:metadata.get(k) for k in ['id','name','state','path','updated_at']}, 'runs': []}
              for i, run in enumerate(api(base + '/runs?branch=main&per_page=10').get('workflow_runs', [])):
                  row = {k: run.get(k) for k in run_keys}
                  if i < 4:
                      jobs = api(f'repos/{repo}/actions/runs/{run["id"]}/jobs?per_page=100').get('jobs', [])
                      row['jobs'] = []
                      for job in jobs:
                          j = {k: job.get(k) for k in ['id','name','status','conclusion','started_at','completed_at','steps']}
                          if job['status'] == 'completed' and i < 3:
                              p = subprocess.run(['gh','run','view',str(run['id']),'--repo',repo,'--job',str(job['id']),'--log'], capture_output=True, text=True, timeout=90)
                              lines = p.stdout.splitlines()
                              interesting = [line for line in lines if re.search(r'(due\"|ageMinutes|lastNewsCrawlAt|lastFullRefreshAt|Lightweight refresh skipped|last news crawl:|last full refresh:|\bError\b|::error|\[error\]|Traceback|FAILED|quality.gate|No .*changes|Nothing to commit|finalize|jobId\"|rejected|non-fast-forward|-> main|workflow run|\[main |runStatus|discovery.*failed)', line, re.I)]
                              j['logSignals'] = [re.sub(r'(https?://[^\s?]+)\?[^\s]+', r'\1?[redacted]', x) for x in interesting[-160:]]
                              j['logReadStatus'] = p.returncode
                          row['jobs'].append(j)
                  result['runs'].append(row)
              report['workflows'][name] = result
          report['activeRuns'] = []
          for status in ['in_progress','queued']:
              for row in api(f'repos/{repo}/actions/runs?branch=main&status={status}&per_page=30').get('workflow_runs', []):
                  report['activeRuns'].append({k:row.get(k) for k in run_keys})
          for path in ['build-provenance.json','data/pipeline_health.json']:
              try:
                  req = urllib.request.Request('https://vciq.github.io/'+path, headers={'Cache-Control':'no-cache','User-Agent':'VCIQ-read-only-health-audit'})
                  with urllib.request.urlopen(req,timeout=30) as response:
                      report['live.'+path] = json.load(response)
              except Exception as exc:
                  report['live.'+path] = {'error': str(exc)}
          report['openIssues'] = api(f'search/issues?q=repo:{repo}+is:issue+is:open&per_page=50').get('items', [])
          report['openIssues'] = [{k:r.get(k) for k in ['number','title','body','html_url']} for r in report['openIssues']]
          (out/'audit.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          summary = {k:report[k] for k in ['generatedAt','sourceSha','articleRefreshAudit','activeRuns']}
          summary['workflows'] = {n: {'metadata':w['metadata'], 'runs':[{k:r.get(k) for k in run_keys} for r in w['runs']]} for n,w in report['workflows'].items()}
          (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(summary,ensure_ascii=False))
          PY
          git archive --format=tar.gz --output=/tmp/refresh-health-audit/source.tar.gz HEAD tools tests config .github/workflows lib package.json package-lock.json tsconfig.json
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-health-audit-20260912
          path: /tmp/refresh-health-audit
          retention-days: 14
