name: Publish reviewed company candidates

on:
  push:
    branches: [main]
    paths:
      - config/company_candidate_decisions.json
      - config/company_candidate_review_queue.json
      - config/company_registry.json
      - config/official_company_sources.json
      - config/tracking_capture_inbox.json
      - tools/company_official_source_discovery.py
      - tools/prepare_company_candidate_onboarding.py
      - tools/prepare_company_candidate_onboarding_v2.py
      - tools/onboard_company_candidates.py
      - tools/company_registry.py
      - tools/build_company_candidates.py
      - tools/research_agent.py
      - lib/company-registry.ts
      - lib/company-candidate-onboarding.ts
      - tests/test_company_official_source_discovery.py
      - tests/test_prepare_company_candidate_onboarding.py
      - .github/workflows/company-candidate-onboarding.yml
  workflow_dispatch:
    inputs:
      post_onboarding_handoff:
        description: Next publication stage after verified onboarding
        required: false
        type: choice
        default: none
        options:
          - none
          - refresh
          - publish-with-research

permissions:
  contents: write
  actions: write

concurrency:
  # Only equivalent onboarding requests may collapse. A refresh or terminal
  # publish-with-research handoff has a distinct key and cannot be evicted by none.
  group: vciq-candidate-onboarding-${{ github.ref }}-${{ inputs.post_onboarding_handoff || 'none' }}
  queue: single

jobs:
  onboard:
    concurrency:
      # The actual repository mutation path remains serialized with every writer.
      group: vciq-repository-writer-${{ github.ref }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_QUEUE: config/company_candidate_review_queue.json
      ONBOARDING_STATE: config/company_candidate_onboarding_state.json
      POST_ONBOARDING_HANDOFF: ${{ inputs.post_onboarding_handoff }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate onboarding modules
        run: |
          python -m py_compile \
            tools/company_registry.py \
            tools/company_official_source_discovery.py \
            tools/prepare_company_candidate_onboarding.py \
            tools/prepare_company_candidate_onboarding_v2.py \
            tools/onboard_company_candidates.py \
            tools/build_company_candidates.py \
            tools/ensure_venture_profile_coverage.py \
            tools/research_agent.py
          python -m unittest \
            tests.test_company_registry \
            tests.test_company_official_source_discovery \
            tests.test_prepare_company_candidate_onboarding \
            tests.test_onboard_company_candidates \
            tests.test_company_candidates \
            tests.test_ensure_venture_profile_coverage
          node --import tsx --test \
            tests/company-candidate-onboarding.test.ts \
            tests/company-candidate-review.test.ts
          python tools/company_registry.py --check

      - name: Prepare verified automatic company profiles
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          SILICONFLOW_BASE_URL: https://api.siliconflow.cn/v1
          SILICONFLOW_MODEL: deepseek-ai/DeepSeek-V4-Flash
          AUTO_COMPANY_PROFILE_REASONING_EFFORT: medium
          AUTO_COMPANY_PROFILE_API_TIMEOUT: "120"
          AUTO_COMPANY_PROFILE_API_RETRIES: "1"
        shell: bash
        run: |
          set -euo pipefail
          python tools/prepare_company_candidate_onboarding_v2.py \
            --candidates "$CANDIDATE_QUEUE" \
            --limit 6 \
            | tee /tmp/company-auto-profile-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('/tmp/company-auto-profile-report.json')
              .read_text(encoding='utf-8')
              .splitlines()[-1]
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          discovery = report.get('sourceDiscovery', {})
          print(
              'verified evidence-linked official sites:',
              discovery.get('verifiedCount', 0),
          )
          for hold in report.get('holds', []):
              print(
                  f"::notice title=Company auto-onboarding held::"
                  f"{hold.get('candidateKey', '?')}: {hold.get('reason', 'unknown reason')}"
              )
          PY

      - name: Apply reviewed onboarding and merge decisions
        id: onboarding
        shell: bash
        run: |
          set -euo pipefail
          python tools/onboard_company_candidates.py \
            --candidates "$CANDIDATE_QUEUE" \
            --report "$ONBOARDING_STATE" \
            | tee /tmp/company-onboarding-report.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path('/tmp/company-onboarding-report.json')
              .read_text(encoding='utf-8')
              .splitlines()[-1]
          )
          if report.get('failedCount'):
              raise SystemExit(json.dumps(report, ensure_ascii=False))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(
                  'published_slugs=' + ' '.join(report.get('publishedSlugs', [])) + '\n'
              )
              output.write(
                  'published_count=' + str(int(report.get('publishedCount', 0))) + '\n'
              )
              output.write(
                  'merged_count=' + str(int(report.get('mergedCount', 0))) + '\n'
              )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Crawl and validate newly published company profiles
        if: steps.onboarding.outputs.published_count != '0'
        env:
          PUBLISHED_SLUGS: ${{ steps.onboarding.outputs.published_slugs }}
          VENTURE_PROFILE_USER_AGENT: ${{ vars.VENTURE_PROFILE_USER_AGENT }}
        shell: bash
        run: |
          set -euo pipefail
          for slug in $PUBLISHED_SLUGS; do
            echo "Building first formal profile for $slug"
            python tools/crawl_venture_profiles.py \
              --kind company \
              --slug "$slug" \
              --workers 1 \
              --max-pages 6
          done
          python tools/ensure_venture_profile_coverage.py --check
          python tools/crawl_venture_profiles.py --validate-only
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          slugs = [slug for slug in os.environ['PUBLISHED_SLUGS'].split() if slug]
          snapshot = json.loads(Path('public/data/venture_profiles.json').read_text())
          companies = snapshot.get('companies', {})
          registry = json.loads(Path('config/company_registry.json').read_text())
          registry_by_slug = {
              row.get('slug'): row for row in registry.get('companies', []) if isinstance(row, dict)
          }
          for slug in slugs:
              profile = companies.get(slug)
              company = registry_by_slug.get(slug)
              assert isinstance(profile, dict), slug
              assert isinstance(company, dict), slug
              assert profile.get('name') == company.get('name'), (slug, profile.get('name'), company.get('name'))
              assert profile.get('status') in {'ok', 'retained', 'fallback'}, profile
              assert profile.get('background') or profile.get('projectBackground'), profile
              official_host = (
                  urlsplit(str(company.get('source', {}).get('url', ''))).hostname or ''
              ).lower()
              sources = profile.get('sources', [])
              assert sources, profile
              profile_hosts = {
                  (urlsplit(str(source.get('url', ''))).hostname or '').lower()
                  for source in sources
                  if isinstance(source, dict)
              }
              assert any(
                  host == official_host
                  or host.endswith('.' + official_host)
                  or official_host.endswith('.' + host)
                  for host in profile_hosts
                  if host and official_host
              ), (slug, official_host, profile_hosts)
          PY

      - name: Rebuild private candidate status snapshot
        run: |
          python tools/build_company_candidates.py --output "$CANDIDATE_QUEUE"
          python tools/build_company_candidates.py \
            --output "$CANDIDATE_QUEUE" \
            --check
          python tools/company_registry.py --check
          python tools/onboard_company_candidates.py \
            --candidates "$CANDIDATE_QUEUE" \
            --report "$ONBOARDING_STATE" \
            --check

      - name: Validate application and static routes
        run: |
          npm run lint
          npm run test:unit
          npx tsc --noEmit
          python tools/enrich_tracking_snapshot.py
          ALLOW_INCOMPLETE_TRACKING_COVERAGE=true npm run build:pages
          git restore public/data/articles.json

      - name: Commit published profiles and continue the requested handoff
        env:
          PUBLISHED_COUNT: ${{ steps.onboarding.outputs.published_count }}
          MERGED_COUNT: ${{ steps.onboarding.outputs.merged_count }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            config/company_registry.json \
            config/company_candidate_decisions.json \
            config/company_candidate_review_queue.json \
            config/company_candidate_onboarding_state.json \
            config/official_company_sources.json \
            public/data/venture_profiles.json

          pushed=false
          if git diff --cached --quiet; then
            echo "No candidate onboarding changes."
          else
            git commit -m "data: publish reviewed company candidates"
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin main
              python tools/company_registry.py --check
              python tools/build_company_candidates.py \
                --output "$CANDIDATE_QUEUE" \
                --check
              python tools/onboard_company_candidates.py \
                --candidates "$CANDIDATE_QUEUE" \
                --report "$ONBOARDING_STATE" \
                --check
              npx tsc --noEmit
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
            done
          fi

          public_changed=false
          if [ "${PUBLISHED_COUNT:-0}" -gt 0 ] || [ "${MERGED_COUNT:-0}" -gt 0 ]; then
            public_changed=true
          fi

          handoff="${POST_ONBOARDING_HANDOFF:-none}"
          case "$handoff" in
            refresh)
              echo "Verified onboarding finished; refresh the public snapshot from the committed company state."
              gh workflow run scheduled-sync.yml --ref main
              ;;
            publish-with-research)
              echo "Verified onboarding finished at the terminal fixed point; publish Pages, then generate research."
              gh workflow run pages.yml --ref main \
                -f run_research_after_deploy=true
              ;;
            none|"")
              if [ "$pushed" = "true" ] && [ "$public_changed" = "true" ]; then
                echo "Onboarding changed public company profiles; publish the terminal Pages snapshot and regenerate research."
                gh workflow run pages.yml --ref main \
                  -f run_research_after_deploy=true
              elif [ "$pushed" = "true" ]; then
                echo "Only private candidate/onboarding metadata changed; no Pages dispatch required."
              fi
              ;;
            *)
              echo "Unsupported post_onboarding_handoff=$handoff" >&2
              exit 1
              ;;
          esac
