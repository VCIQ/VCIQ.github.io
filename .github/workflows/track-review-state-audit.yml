name: Audit track review state

on:
  push:
    branches: [fix/vc-track-review-reconciliation]
    paths:
      - .github/workflows/track-review-state-audit.yml
      - tools/reconcile_manual_institution_intents.py
      - tools/manual_institution_identity.py
      - tools/manual_tracking.py
      - tests/test_manual_institution_intents.py
  workflow_dispatch:
    inputs:
      track:
        description: Track slug to inspect without changing data
        default: track-1ccjq49
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect reviewed automatic candidates without changing data
        env:
          AUDIT_TRACK: ${{ inputs.track || 'track-1ccjq49' }}
        run: |
          python - <<'PY'
          import json, os, re, unicodedata
          from datetime import datetime
          from pathlib import Path
          def load(path): return json.loads(Path(path).read_text(encoding='utf-8'))
          def norm(value): return re.sub(r'[^a-z0-9\u3400-\u9fff]+', '', unicodedata.normalize('NFKC', str(value or '')).lower())
          def field(kind): return {'company':'sampleCompanies','companies':'sampleCompanies','person':'people','technology':'keywords','topic':'keywords','keyword':'keywords'}.get(kind,kind)
          def key(track,kind,value):
              kind=field(kind)
              value=re.sub(r'\s+@[^\s]+$','',str(value)) if kind=='people' else value
              identity=re.sub(r'[^a-z0-9\u3400-\u9fff+#./]+','',unicodedata.normalize('NFKC',str(value or '')).lower()) if kind=='keywords' else norm(value)
              return track,kind,identity
          def stamp(value):
              try: return datetime.fromisoformat(str(value).replace('Z','+00:00')).timestamp()
              except (ValueError,TypeError): return 0
          def emit(label,value): print(label+'='+json.dumps(value,ensure_ascii=False,sort_keys=True))
          slug=os.environ['AUDIT_TRACK']
          config=load('config/user_tracking.json'); intents=load('config/tracking_intents.json'); ledger=load('config/tracking_auto_discovery.json')
          track=next(r for r in config['tracks'] if r.get('slug')==slug)
          entities={r['id']:r for r in intents['entities']}
          buckets={'active':set(),'review':set(),'blocked':set()}; bykey={}
          for m in intents['memberships']:
              if m.get('trackId')!='track:'+slug: continue
              e=entities.get(m['entityId'],{}); state=m.get('state')
              bucket='active' if state in ('active','confirmed','applied') else 'blocked' if state in ('held','rejected','disabled','removed','ignored') else 'review'
              for value in [e.get('name'),*e.get('aliases',[])]:
                  if not value: continue
                  k=key(slug,e.get('kind'),value); buckets[bucket].add(k); bykey[k]=(e,m)
          latest={}
          for state in ('added','removed'):
              for r in ledger.get(state,[]):
                  if r.get('track')!=slug or field(r.get('kind')) not in ('keywords','people','sampleCompanies'): continue
                  k=key(slug,r.get('kind'),r.get('value')); t=stamp(r.get('addedAt') if state=='added' else r.get('removedAt',r.get('updatedAt')))
                  if k not in latest or t>=latest[k][0]: latest[k]=(t,state,r)
          active={k:v[2] for k,v in latest.items() if v[1]=='added'}
          reviewing=[]; automatic=[]
          for k,r in active.items():
              if k in buckets['review']:
                  e,m=bykey[k]
                  reviewing.append({'name':r['value'],'entityId':e.get('id'),'state':m.get('state'),'pinned':m.get('pinned'),'resolutionSource':e.get('resolutionSource'),'resolutionStatus':e.get('resolutionStatus'),'origins':[{'origin':o.get('origin'),'at':o.get('at'),'evidenceUrl':o.get('evidenceUrl')} for o in m.get('origins',[])][-2:]})
              elif k not in buckets['active'] and k not in buckets['blocked']: automatic.append(r)
          fixed={kind:sum(key(slug,kind,v) not in buckets['blocked'] and (key(slug,kind,v) not in active or key(slug,kind,v) in buckets['active']) for v in dict.fromkeys(track.get(kind,[]))) for kind in ('keywords','people','sampleCompanies')}
          emit('AUDIT_REVISION',os.environ['GITHUB_SHA']);emit('PROJECTED_FIXED_COUNTS',fixed)
          emit('REVIEWED_AUTOMATIC_COUNT',len(reviewing)); emit('REVIEWED_AUTOMATIC',reviewing)
          emit('UNREVIEWED_AUTOMATIC_COUNT',len(automatic));emit('UNREVIEWED_NAMES',[r['value'] for r in automatic])
          emit('DIRECTORY_DATE_EXAMPLES',[{k:r.get(k) for k in ('value','addedAt','expiresAt')} for r in automatic if 'shared-directory-reference' in r.get('evidence',[])][:3])
          PY
      - name: Retain reproducible public repository source
        run: |
          git archive --format=tar.gz --output=/tmp/track-source.tar.gz HEAD tools tests config lib scripts .github package.json package-lock.json tsconfig.json public/data
      - uses: actions/upload-artifact@v4
        with:
          name: track-investigation-source
          path: /tmp/track-source.tar.gz
          retention-days: 1
