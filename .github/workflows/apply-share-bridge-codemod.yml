name: Apply homepage Share preference bridge

on:
  push:
    branches:
      - feature/recommendation-product-semantics-20260908

permissions:
  contents: write

jobs:
  apply-bridge:
    if: ${{ !contains(github.event.head_commit.message, '[share-bridge-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Apply narrow homepage codemod
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('components/homepage-news-feed.tsx')
          text = path.read_text()

          replacements = [
              (
                  'import { canonicalHotnessKey, metricsByHref, recordArticleShare } from "@/lib/hotness";\nimport { buildResearchInvestigationHref } from "@/lib/research-workspace-handoff";',
                  'import { canonicalHotnessKey, metricsByHref, recordArticleShare } from "@/lib/hotness";\nimport { buildResearchInvestigationHref } from "@/lib/research-workspace-handoff";\nimport { flushPendingSharePreferences, syncSharePreference } from "@/lib/share-preference-sync";',
              ),
              (
                  '    channelLabel: "首页推荐",\n  });\n  window.dispatchEvent(',
                  '    channelLabel: "首页推荐",\n  });\n  void syncSharePreference(homepageFeedFavoriteInput(item));\n  window.dispatchEvent(',
              ),
              (
                  '  }, []);\n\n  const favoriteProfile = useMemo(',
                  '  }, []);\n\n  useEffect(() => {\n    void flushPendingSharePreferences();\n  }, []);\n\n  const favoriteProfile = useMemo(',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one replacement target, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit bridge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/homepage-news-feed.tsx
          git commit -m 'feat: sync homepage shares into preference learning [share-bridge-generated]'
          git push origin HEAD:${{ github.ref_name }}
