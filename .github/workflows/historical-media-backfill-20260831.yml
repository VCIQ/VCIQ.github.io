name: One-time reviewed historical media backfill

# One-time migration generated from the read-only Feedback Ledger audit.
# It is intentionally triggered only when this workflow file itself lands on main.
# Subsequent config commits do not match the paths filter, so the batch cannot loop.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/historical-media-backfill-20260831.yml"

permissions: {}

env:
  EXPECTED_REPOSITORY: VCIQ/VCIQ.github.io

jobs:
  backfill:
    name: Apply four reviewed historical media actions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: tracking-admin
    concurrency:
      group: vciq-repository-writer-main
      queue: max
    permissions:
      contents: write
      actions: write
    steps:
      - name: Require canonical main push and allowlisted operator
        env:
          ACTUAL_REPOSITORY: ${{ github.repository }}
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ACTUAL_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$ACTUAL_REF" = "refs/heads/main"
          test "$ACTUAL_EVENT" = "push"

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Require actor allowlist and capture exact base revision
        id: base
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          admins = json.loads(Path("config/tracking_admins.json").read_text(encoding="utf-8"))
          allowed = {
              str(actor).strip().casefold()
              for actor in admins.get("actors", [])
              if str(actor).strip()
          }
          checked = {
              "github.actor": os.environ.get("ACTOR", "").strip(),
              "github.triggering_actor": os.environ.get("TRIGGERING_ACTOR", "").strip(),
          }
          denied = [label for label, actor in checked.items() if actor.casefold() not in allowed]
          if denied:
              raise SystemExit("historical media backfill actor is not allowlisted: " + ", ".join(denied))
          print("authorized actors: " + ", ".join(checked.values()))
          PY
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compile governed writer
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/manual_tracking.py \
            tools/manual_tracking_keyword_support.py \
            tools/manual_tracking_entrypoint.py \
            tools/tracking_manual_feedback.py \
            tools/expand_tracking_entities.py \
            tools/strict_tracking_config.py

      - name: Validate the exact reviewed batch
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        shell: bash
        run: |
          set -euo pipefail
          run_request() {
            local name="$1" tracks="$2" url="$3" note="$4"
            python tools/manual_tracking_entrypoint.py \
              --mode validate \
              --kind source \
              --name "$name" \
              --tracks "$tracks" \
              --keywords "" \
              --source-url "$url" \
              --source-category media \
              --region 中国 \
              --reasons "个人研究兴趣" \
              --note "$note" \
              --actor "$ACTOR" \
              --triggering-actor "$TRIGGERING_ACTOR"
          }

          run_request "搜狐网" "AI / AGI|AI网络通信" "https://sohu.com/" \
            "历史媒体候选回溯：搜狐域名累计 11 个独立 track 事件；现有 Tracking Source 仅补充审计确认的缺失赛道关系。"
          run_request "新浪财经" "AI网络通信" "https://finance.sina.com.cn/" \
            "历史媒体候选回溯：新浪财经累计 10 个独立 track 事件；现有 Tracking Source 仅补充审计确认的 AI网络通信关系。"
          run_request "网易科技" "AI / AGI|AI网络通信" "https://tech.163.com/" \
            "历史媒体候选回溯：网易域名累计 5 个独立 track 事件；媒体质量复核通过，仅纳入网易科技频道，不纳入 163.com 全站。"
          run_request "虎嗅网" "AI / AGI|风险投资" "https://www.huxiu.com/" \
            "历史媒体候选回溯：虎嗅累计 3 个独立 track 事件；媒体质量复核通过，作为 discovery-only 专业媒体来源纳入。"

      - name: Apply the exact reviewed batch
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/media-backfill
          index=0
          run_request() {
            local name="$1" tracks="$2" url="$3" note="$4"
            index=$((index + 1))
            python tools/manual_tracking_entrypoint.py \
              --mode apply \
              --kind source \
              --name "$name" \
              --tracks "$tracks" \
              --keywords "" \
              --source-url "$url" \
              --source-category media \
              --region 中国 \
              --reasons "个人研究兴趣" \
              --note "$note" \
              --actor "$ACTOR" \
              --triggering-actor "$TRIGGERING_ACTOR" \
              | tee "/tmp/media-backfill/${index}.json"
          }

          run_request "搜狐网" "AI / AGI|AI网络通信" "https://sohu.com/" \
            "历史媒体候选回溯：搜狐域名累计 11 个独立 track 事件；现有 Tracking Source 仅补充审计确认的缺失赛道关系。"
          run_request "新浪财经" "AI网络通信" "https://finance.sina.com.cn/" \
            "历史媒体候选回溯：新浪财经累计 10 个独立 track 事件；现有 Tracking Source 仅补充审计确认的 AI网络通信关系。"
          run_request "网易科技" "AI / AGI|AI网络通信" "https://tech.163.com/" \
            "历史媒体候选回溯：网易域名累计 5 个独立 track 事件；媒体质量复核通过，仅纳入网易科技频道，不纳入 163.com 全站。"
          run_request "虎嗅网" "AI / AGI|风险投资" "https://www.huxiu.com/" \
            "历史媒体候选回溯：虎嗅累计 3 个独立 track 事件；媒体质量复核通过，作为 discovery-only 专业媒体来源纳入。"

          python - <<'PY'
          import json
          from pathlib import Path

          reports = []
          for path in sorted(Path("/tmp/media-backfill").glob("*.json")):
              report = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(report, dict) or report.get("ok") is not True:
                  raise SystemExit(f"backfill report failed: {path}")
              reports.append(report)
          if len(reports) != 4:
              raise SystemExit(f"expected 4 apply reports, got {len(reports)}")
          print(json.dumps({"requests": 4, "changed": sum(bool(r.get('changed')) for r in reports)}, ensure_ascii=False))
          PY

      - name: Assert only the reviewed source-track projections exist
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("config/user_tracking.json").read_text(encoding="utf-8"))
          sources = [row for row in payload.get("sources", []) if isinstance(row, dict)]

          expected = {
              ("https://sohu.com/", "AI / AGI"),
              ("https://sohu.com/", "AI网络通信"),
              ("https://finance.sina.com.cn/", "AI网络通信"),
              ("https://tech.163.com/", "AI / AGI"),
              ("https://tech.163.com/", "AI网络通信"),
              ("https://www.huxiu.com/", "AI / AGI"),
              ("https://www.huxiu.com/", "风险投资"),
          }
          present = {(str(row.get("url") or ""), str(row.get("sector") or "")) for row in sources}
          missing = sorted(expected - present)
          if missing:
              raise SystemExit("reviewed source-track projections missing: " + repr(missing))

          forbidden_hosts = {"myzaker.com", "80aj.com"}
          forbidden_urls = [
              str(row.get("url") or "")
              for row in sources
              if any(host in str(row.get("url") or "").casefold() for host in forbidden_hosts)
              or "blog.csdn.net" in str(row.get("url") or "").casefold()
          ]
          if forbidden_urls:
              raise SystemExit("unreviewed/blocked historical candidates unexpectedly entered sources: " + repr(forbidden_urls))
          print("reviewed historical media projection assertions passed")
          PY

      - name: Validate changed tracking configuration
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          python -m unittest \
            tests.test_manual_tracking \
            tests.test_manual_tracking_keyword \
            tests.test_manual_tracking_workflow \
            tests.test_tracking_manual_feedback \
            tests.test_expand_tracking_entities
          npm run validate:tracking
          npm run validate:taxonomy
          python tools/tracking_source_governance.py --check

      - name: Commit and push only governed tracking files
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "main advanced while the backfill was running; refusing to overwrite it"
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            config/tracking_intents.json \
            config/user_tracking.json \
            config/tracking_capture_inbox.json
          git diff --cached --quiet && {
            echo "reviewed historical batch produced no config change"
            exit 1
          }
          git commit -m "config: backfill reviewed historical media candidates"

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "main advanced before push; refusing to rebase, force, or overwrite it"
            exit 1
          }
          gh auth setup-git
          git push origin HEAD:main

      - name: Trigger normal tracking reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run scheduled-sync.yml --ref main

      - name: Summarize the one-time audit record
        if: always()
        shell: bash
        run: |
          {
            echo "## Reviewed historical media backfill"
            echo
            echo "Only four pre-reviewed media actions were eligible for this one-time batch."
            echo
            echo "- 搜狐网: AI / AGI + AI网络通信"
            echo "- 新浪财经: AI网络通信"
            echo "- 网易科技: AI / AGI + AI网络通信 (tech.163.com only)"
            echo "- 虎嗅网: AI / AGI + 风险投资"
            echo
            echo "Explicitly excluded/held: ZAKER, 80aj, CSDN博客, 天脉财经, 生物通."
          } >> "$GITHUB_STEP_SUMMARY"
