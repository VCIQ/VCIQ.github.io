name: Refresh STAR Market investors

on:
  push:
    branches: [main]
    paths:
      - tools/crawl_star_market_investors.py
      - tools/crawl_star_market_investors_legacy.py
      - tools/star_market_prospectus_parser.py
      - tools/star_investor_quality.py
      - tools/review_star_market_investors.py
      - config/star_market_investor_sources.json
      - config/star_market_investor_reviews.json
      - requirements-star-investors.txt
      - lib/star-market-investor-data.ts
      - lib/star-market-investor-review.ts
      - components/star-market-investor-directory.tsx
      - components/star-market-investor-directory.module.css
      - app/institutions/star-market/**
      - app/institutions/page.tsx
      - app/institutions/page.module.css
      - tests/test_star_market_investors.py
      - tests/test_star_market_prospectus_parser.py
      - tests/test_star_market_strict_review.py
      - tests/test_review_star_market_investors.py
      - tests/star-market-investor-data.test.ts
      - tests/star-market-investor-review.test.ts
      - .github/workflows/star-market-investor-refresh.yml
  schedule:
  - cron: "10 3 * * 1"
    timezone: "Asia/Taipei"
  workflow_dispatch:
    inputs:
      listing:
        description: "Optional 688xxx ticker or catalog slug"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: vciq-repository-writer-${{ github.ref }}
  queue: max

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-star-investors.txt

      - name: Install pinned prospectus parser
        run: python -m pip install --disable-pip-version-check -r requirements-star-investors.txt

      - name: Validate strict crawler, review gate and human manifest before network access
        run: |
          python -m py_compile \
            tools/crawl_star_market_investors.py \
            tools/crawl_star_market_investors_legacy.py \
            tools/star_market_prospectus_parser.py \
            tools/star_investor_quality.py \
            tools/review_star_market_investors.py \
            tools/cninfo_structured_disclosures.py \
            tools/crawl_listed_company_disclosures.py
          python -m unittest \
            tests.test_star_market_investors \
            tests.test_star_market_prospectus_parser \
            tests.test_star_market_strict_review \
            tests.test_review_star_market_investors
          python - <<'PY'
          from tools.review_star_market_investors import load_review_manifest
          load_review_manifest()
          PY

      - name: Refresh official prospectus investor directory
        env:
          LISTING_FILTER: ${{ inputs.listing || '' }}
        run: |
          args=(--require-companies)
          if [ -n "$LISTING_FILTER" ]; then
            args+=(--listing "$LISTING_FILTER")
          fi
          python tools/crawl_star_market_investors.py "${args[@]}"

      - name: Apply evidence and human-review gates
        run: python tools/review_star_market_investors.py

      - name: Validate privacy, official-source and review constraints
        run: |
          python tools/crawl_star_market_investors.py --check --require-companies
          python tools/review_star_market_investors.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Run deterministic site gates
        run: |
          npm run lint
          npm run test:unit
          npm run test:crawler
          ALLOW_INCOMPLETE_TRACKING_COVERAGE=true npm run build:pages

      - name: Finalize automation control plane
        run: python tools/run_pipeline.py finalize star-market-investor-refresh

      - name: Commit prospectus directory and heartbeat
        id: data-update
        shell: bash
        run: |
          set -euo pipefail
          DATA_PATHS=(
            public/data/star_market_investors.json
            public/data/data_lineage.json
            public/data/pipeline_health.json
          )
          git add "${DATA_PATHS[@]}"
          if git diff --cached --quiet; then
            echo "No STAR Market investor or control-plane changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh STAR Market prospectus investors"

          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main
            python tools/review_star_market_investors.py
            python tools/crawl_star_market_investors.py --check --require-companies
            python tools/review_star_market_investors.py --check
            python -m unittest \
              tests.test_star_market_investors \
              tests.test_star_market_prospectus_parser \
              tests.test_star_market_strict_review \
              tests.test_review_star_market_investors
            npm run test:unit
            ALLOW_INCOMPLETE_TRACKING_COVERAGE=true npm run build:pages
            python tools/run_pipeline.py finalize star-market-investor-refresh
            git add "${DATA_PATHS[@]}"
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
