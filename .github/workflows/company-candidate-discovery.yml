name: Discover candidate companies

on:
  schedule:
    - cron: "45 7 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:
    inputs:
      publish_after_reconciliation:
        description: Publish Pages after reconciliation reaches a fixed point
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - tools/apply_manual_company_trust.py
      - tools/build_company_candidates.py
      - tools/build_resolved_company_candidates.py
      - tools/entity_resolution.py
      - tools/reconcile_entity_resolution.py
      - tools/resolved_company_captures.py
      - tools/resolve_company_entities.py
      - tools/tracking_entity_integrity.py
      - config/company_candidate_decisions.json
      - config/entity_resolution_decisions.json
      - config/official_company_sources.json
      - config/tracking_capture_inbox.json
      - config/user_tracking.json
      - tests/test_company_candidates.py
      - tests/test_manual_company_trust.py
      - tests/test_entity_resolution.py
      - tests/test_entity_resolution_workflow.py
      - tests/test_resolved_company_candidates.py
      - .github/workflows/company-candidate-discovery.yml

permissions:
  contents: write
  actions: write

concurrency:
  # Schedule/manual requests may collapse only within the same trigger semantics.
  # Push runs keep their commit SHA because this workflow later uses that push's
  # exact before→sha delta to decide whether a public tracking refresh is required.
  group: vciq-candidate-discovery-${{ github.ref }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || inputs.publish_after_reconciliation || 'false' }}
  queue: single

jobs:
  discover:
    concurrency:
      # Actual repository mutation remains serialized with every other writer.
      group: vciq-repository-writer-${{ github.ref }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANDIDATE_QUEUE: config/company_candidate_review_queue.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate entity resolution and candidate discovery
        run: |
          python -m py_compile \
            tools/apply_manual_company_trust.py \
            tools/build_company_candidates.py \
            tools/build_resolved_company_candidates.py \
            tools/entity_resolution.py \
            tools/reconcile_entity_resolution.py \
            tools/resolved_company_captures.py \
            tools/tracking_entity_integrity.py
          python -m unittest \
            tests.test_company_candidates \
            tests.test_manual_company_trust \
            tests.test_entity_resolution \
            tests.test_entity_resolution_workflow \
            tests.test_resolved_company_candidates
      - name: Detect pushed tracking inputs
        id: push-inputs
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tracking_inputs_changed=false
          if git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- \
            config/user_tracking.json \
            config/tracking_capture_inbox.json \
            config/official_company_sources.json \
            | grep -q .; then
            tracking_inputs_changed=true
          fi
          echo "changed=$tracking_inputs_changed" >> "$GITHUB_OUTPUT"
      - name: Reconcile entities, auto-trust manual additions and build private review snapshot
        run: |
          python tools/reconcile_entity_resolution.py
          python tools/build_resolved_company_candidates.py --output "$CANDIDATE_QUEUE"
          python tools/apply_manual_company_trust.py --candidates "$CANDIDATE_QUEUE"
          python tools/build_resolved_company_candidates.py --output "$CANDIDATE_QUEUE"
          python tools/reconcile_entity_resolution.py --check
          python tools/tracking_entity_integrity.py
          python tools/apply_manual_company_trust.py \
            --candidates "$CANDIDATE_QUEUE" \
            --check
          python tools/build_resolved_company_candidates.py \
            --output "$CANDIDATE_QUEUE" \
            --check
      - name: Commit resolved tracking and private candidate evidence
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          changed_paths=(
            config/user_tracking.json
            config/tracking_capture_inbox.json
            config/company_candidate_decisions.json
            "$CANDIDATE_QUEUE"
          )
          if git diff --quiet -- "${changed_paths[@]}"; then
            echo "No semantic entity-resolution, trust-policy or candidate changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "tracking_changed=false" >> "$GITHUB_OUTPUT"
            echo "candidate_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python tools/tracking_entity_integrity.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${changed_paths[@]}"
          git commit -m "data: reconcile captured entities and private company candidates"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main
            python tools/reconcile_entity_resolution.py
            python tools/build_resolved_company_candidates.py --output "$CANDIDATE_QUEUE"
            python tools/apply_manual_company_trust.py --candidates "$CANDIDATE_QUEUE"
            python tools/build_resolved_company_candidates.py --output "$CANDIDATE_QUEUE"
            python tools/reconcile_entity_resolution.py --check
            python tools/tracking_entity_integrity.py
            python tools/apply_manual_company_trust.py \
              --candidates "$CANDIDATE_QUEUE" \
              --check
            python tools/build_resolved_company_candidates.py \
              --output "$CANDIDATE_QUEUE" \
              --check
            git add "${changed_paths[@]}"
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            if git push origin HEAD:main; then
              tracking_changed=false
              candidate_changed=false
              if git diff-tree --no-commit-id --name-only -r HEAD -- config/user_tracking.json \
                | grep -qx 'config/user_tracking.json'; then
                tracking_changed=true
              fi
              if git diff-tree --no-commit-id --name-only -r HEAD -- \
                config/company_candidate_review_queue.json \
                config/company_candidate_decisions.json \
                | grep -q .; then
                candidate_changed=true
              fi
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "tracking_changed=$tracking_changed" >> "$GITHUB_OUTPUT"
              echo "candidate_changed=$candidate_changed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
      - name: Continue private review, refresh or publication after reconciliation
        if: steps.publish.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKING_CHANGED: ${{ steps.publish.outputs.tracking_changed }}
          CANDIDATE_CHANGED: ${{ steps.publish.outputs.candidate_changed }}
          PUSH_TRACKING_INPUTS_CHANGED: ${{ steps.push-inputs.outputs.changed }}
          PUBLISH_AFTER_RECONCILIATION: ${{ inputs.publish_after_reconciliation }}
        shell: bash
        run: |
          set -euo pipefail
          tracking_refresh_required=false
          if [ "${TRACKING_CHANGED:-false}" = "true" ] || [ "${PUSH_TRACKING_INPUTS_CHANGED:-false}" = "true" ]; then
            tracking_refresh_required=true
          fi

          if [ "${CANDIDATE_CHANGED:-false}" = "true" ]; then
            if [ "$tracking_refresh_required" = "true" ]; then
              echo "Candidate and tracking state changed; onboard first, then refresh from the committed company state."
              gh workflow run company-candidate-onboarding.yml --ref main \
                -f post_onboarding_handoff=refresh
            elif [ "${PUBLISH_AFTER_RECONCILIATION:-false}" = "true" ]; then
              echo "Candidate state changed at the terminal fixed point; onboard before terminal Pages and research."
              gh workflow run company-candidate-onboarding.yml --ref main \
                -f post_onboarding_handoff=publish-with-research
            else
              echo "Private candidate state changed; continue verified onboarding."
              gh workflow run company-candidate-onboarding.yml --ref main
            fi
          elif [ "$tracking_refresh_required" = "true" ]; then
            echo "Tracking inputs changed; rebuild the public article snapshot before Pages."
            gh workflow run scheduled-sync.yml --ref main
          elif [ "${PUBLISH_AFTER_RECONCILIATION:-false}" = "true" ]; then
            echo "Entity reconciliation reached a fixed point; publish first, then generate research from that terminal snapshot."
            gh workflow run pages.yml --ref main \
              -f run_research_after_deploy=true
          else
            echo "No public tracking input changed; private review state does not require a Pages deployment."
          fi
