name: Refresh NanoID security lockfile

on:
  push:
    branches:
      - security/nanoid-3-3-18
    paths:
      - .github/workflows/security-nanoid-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/nanoid-3-3-18
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile from the reviewed override
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify NanoID is fixed and lockfile is installable
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json')
          const installed = lock.packages?.['node_modules/nanoid']?.version
          if (installed !== '3.3.18') {
            throw new Error(`expected nanoid 3.3.18 in lockfile, got ${installed || 'missing'}`)
          }
          NODE
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/audit-dependencies.mjs

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches the reviewed override."
            exit 0
          fi
          git commit -m "security: refresh lockfile for nanoid 3.3.18"
          git push origin HEAD:security/nanoid-3-3-18
