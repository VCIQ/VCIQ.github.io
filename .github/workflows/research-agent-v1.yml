name: Generate Research Agent v1

on:
  workflow_call:
  # Implementation-only push trigger: regenerate immediately after Research Agent
  # code/policy changes, without reacting to its own generated data commits.
  push:
    branches: [main]
    paths:
      - tools/research_agent.py
      - tools/research_agent_runtime.py
      - tools/research_agent_evidence_policy.py
      - tools/research_agent_enhanced_runtime.py
      - .github/workflows/research-agent-v1.yml
  # Keep a daily research checkpoint even when the full-refresh/Pages handoff has
  # no semantic data commit to dispatch. The shared writer queue still serializes
  # publication with every other repository producer.
  schedule:
    - cron: "30 21 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: vciq-repository-writer-${{ github.ref }}
  # Research is a repository writer. Preserve the active writer and allow the
  # newest explicit research request to supersede stale pending research work.
  queue: max

jobs:
  research-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Research Agent implementation
        run: |
          python -m py_compile \
            tools/research_agent.py \
            tools/research_agent_runtime.py \
            tools/research_agent_evidence_policy.py \
            tools/research_agent_enhanced_runtime.py \
            tools/run_pipeline.py \
            tools/build_pipeline_health.py
          python -m unittest tests.test_research_agent tests.test_research_agent_workflow
          python -m unittest tests.test_research_agent_runtime
          python -m unittest tests.test_research_agent_evidence_policy
          python -m unittest tests.test_pipeline_control
          python tools/run_pipeline.py check

      - name: Generate evidence-linked daily research
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          SILICONFLOW_BASE_URL: https://api.siliconflow.cn/v1
          SILICONFLOW_MODEL: deepseek-ai/DeepSeek-V4-Flash
          RESEARCH_AGENT_REASONING_EFFORT: high
          RESEARCH_AGENT_TIMEZONE: Asia/Taipei
          RESEARCH_AGENT_API_TIMEOUT: "180"
          RESEARCH_AGENT_API_RETRIES: "1"
          RESEARCH_AGENT_MODEL_CHANGE_LIMIT: "16"
        run: python tools/research_agent_enhanced_runtime.py --bootstrap-git-ref HEAD^

      - name: Report model execution status
        id: research-status
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path("public/data/research_agent_daily.json").read_text(encoding="utf-8")
          )
          status = str(report.get("runStatus") or "unknown")
          methodology = report.get("methodology")
          reason = ""
          if isinstance(methodology, dict):
              reason = str(methodology.get("fallbackReason") or "")
          history = report.get("history")
          fallback_streak = 0
          if isinstance(history, list):
              for row in reversed(history):
                  row_status = str(row.get("runStatus") or "") if isinstance(row, dict) else ""
                  if not row_status.endswith("-fallback"):
                      break
                  fallback_streak += 1

          health_status = "degraded" if status.endswith("-fallback") else "success"
          change_summary = report.get("changeSummary")
          external_candidates = 0
          quality_rejected = 0
          if isinstance(change_summary, dict):
              external_candidates = int(change_summary.get("externalCandidates") or 0)
              quality_rejected = int(change_summary.get("qualityRejected") or 0)
          gate_rejected_all = (
              external_candidates >= 3 and quality_rejected >= external_candidates
          )
          health_reason = reason
          if gate_rejected_all and health_status == "success":
              health_status = "degraded"
              health_reason = (
                  f"evidence gate rejected all {external_candidates} external candidates"
              )

          print(f"Research Agent runStatus={status} fallbackReason={reason or '-'}")
          print(
              f"Research Agent healthStatus={health_status} "
              f"fallbackStreak={fallback_streak} qualityRejected={quality_rejected}/"
              f"{external_candidates}"
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"run_status={status}\n")
              output.write(f"health_status={health_status}\n")
              output.write(f"fallback_streak={fallback_streak}\n")
              output.write(f"fallback_reason={reason or 'unknown reason'}\n")
              output.write(f"health_reason={health_reason or 'healthy'}\n")
          if health_status == "degraded":
              print(
                  f"::warning title=Research Agent degraded::"
                  f"{health_reason or 'Research Agent health contract degraded.'}"
              )
          PY

      - name: Validate published research contract
        run: python tools/research_agent.py --check

      - name: Commit generated research data
        id: publish
        shell: bash
        env:
          RESEARCH_HEALTH_STATUS: ${{ steps.research-status.outputs.health_status }}
        run: |
          set -euo pipefail
          RESEARCH_PATHS=(
            public/data/research_agent_daily.json
            public/data/research_agent_snapshot.json
          )
          CONTROL_PATHS=(
            public/data/data_lineage.json
            public/data/pipeline_health.json
          )
          git add "${RESEARCH_PATHS[@]}"
          if git diff --cached --quiet; then
            echo "Research Agent produced no repository changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python tools/run_pipeline.py finalize \
            research-agent-daily \
            --quality-gate passed \
            --status "$RESEARCH_HEALTH_STATUS"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${CONTROL_PATHS[@]}"
          git commit -m "data: publish daily research agent brief"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            git pull --rebase -X theirs origin main
            python tools/research_agent.py --check
            python tools/run_pipeline.py finalize \
              research-agent-daily \
              --quality-gate passed \
              --status "$RESEARCH_HEALTH_STATUS"
            git add "${RESEARCH_PATHS[@]}" "${CONTROL_PATHS[@]}"
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
          done

      - name: Sync persistent Research Agent degradation issue
        if: always() && steps.research-status.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH_STATUS: ${{ steps.research-status.outputs.health_status }}
          FALLBACK_STREAK: ${{ steps.research-status.outputs.fallback_streak }}
          FALLBACK_REASON: ${{ steps.research-status.outputs.fallback_reason }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE='[自动告警] Research Agent 连续规则降级'
          ISSUE_NUMBER=$(gh issue list \
            --state open \
            --search "$TITLE in:title" \
            --json number,title \
            --jq '.[] | select(.title == "[自动告警] Research Agent 连续规则降级") | .number' \
            | head -n 1)

          if [ "${FALLBACK_STREAK:-0}" -ge 3 ]; then
            BODY="Research Agent 已连续 ${FALLBACK_STREAK} 轮退化为规则摘要。最近原因：${FALLBACK_REASON:-unknown reason}。运行：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue edit "$ISSUE_NUMBER" --body "$BODY"
            else
              gh issue create --title "$TITLE" --body "$BODY"
            fi
          elif [ "$HEALTH_STATUS" = "success" ] && [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --body '模型研判已恢复，自动关闭连续降级告警。'
            gh issue close "$ISSUE_NUMBER" --reason completed
          fi

      - name: Deploy published research data
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
