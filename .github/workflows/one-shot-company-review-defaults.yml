name: One-shot private company review defaults

on:
  push:
    branches:
      - fix/company-review-safe-defaults
    paths:
      - .github/workflows/one-shot-company-review-defaults.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/company-review-safe-defaults
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Move CLI defaults to private control-plane paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("tools/build_company_candidates.py"): [
                  (
                      'OUTPUT_PATH = ROOT / "public" / "data" / "company_candidates.json"',
                      'OUTPUT_PATH = ROOT / "config" / "company_candidate_review_queue.json"',
                  ),
              ],
              Path("tools/apply_manual_company_trust.py"): [
                  (
                      'CANDIDATES_PATH = ROOT / "public" / "data" / "company_candidates.json"',
                      'CANDIDATES_PATH = ROOT / "config" / "company_candidate_review_queue.json"',
                  ),
              ],
              Path("tools/prepare_company_candidate_onboarding.py"): [
                  (
                      'CANDIDATES_PATH = ROOT / "public" / "data" / "company_candidates.json"',
                      'CANDIDATES_PATH = ROOT / "config" / "company_candidate_review_queue.json"',
                  ),
              ],
              Path("tools/onboard_company_candidates.py"): [
                  (
                      'CANDIDATES_PATH = ROOT / "public" / "data" / "company_candidates.json"',
                      'CANDIDATES_PATH = ROOT / "config" / "company_candidate_review_queue.json"',
                  ),
                  (
                      'REPORT_PATH = ROOT / "public" / "data" / "company_candidate_onboarding.json"',
                      'REPORT_PATH = ROOT / "config" / "company_candidate_onboarding_state.json"',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{path}: expected one replacement for {old!r}, found {count}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          test = Path("tests/test_company_review_path_defaults.py")
          test.write_text('''from __future__ import annotations\n\nimport unittest\nfrom pathlib import Path\n\nfrom tools import apply_manual_company_trust\nfrom tools import build_company_candidates\nfrom tools import onboard_company_candidates\nfrom tools import prepare_company_candidate_onboarding\n\n\nROOT = Path(__file__).resolve().parents[1]\nPRIVATE_QUEUE = ROOT / "config" / "company_candidate_review_queue.json"\nPRIVATE_ONBOARDING = ROOT / "config" / "company_candidate_onboarding_state.json"\n\n\nclass CompanyReviewPathDefaultsTest(unittest.TestCase):\n    def test_candidate_cli_defaults_use_private_review_queue(self) -> None:\n        self.assertEqual(build_company_candidates.OUTPUT_PATH, PRIVATE_QUEUE)\n        self.assertEqual(apply_manual_company_trust.CANDIDATES_PATH, PRIVATE_QUEUE)\n        self.assertEqual(prepare_company_candidate_onboarding.CANDIDATES_PATH, PRIVATE_QUEUE)\n        self.assertEqual(onboard_company_candidates.CANDIDATES_PATH, PRIVATE_QUEUE)\n\n    def test_onboarding_cli_default_uses_private_state(self) -> None:\n        self.assertEqual(onboard_company_candidates.REPORT_PATH, PRIVATE_ONBOARDING)\n\n    def test_private_defaults_cannot_recreate_retired_public_review_files(self) -> None:\n        retired = {\n            ROOT / "public" / "data" / "company_candidates.json",\n            ROOT / "public" / "data" / "company_candidate_onboarding.json",\n        }\n        defaults = {\n            build_company_candidates.OUTPUT_PATH,\n            apply_manual_company_trust.CANDIDATES_PATH,\n            prepare_company_candidate_onboarding.CANDIDATES_PATH,\n            onboard_company_candidates.CANDIDATES_PATH,\n            onboard_company_candidates.REPORT_PATH,\n        }\n        self.assertTrue(defaults.isdisjoint(retired))\n        for path in defaults:\n            self.assertTrue(path.is_relative_to(ROOT / "config"), path)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8")
          PY

          python -m py_compile \
            tools/build_company_candidates.py \
            tools/apply_manual_company_trust.py \
            tools/prepare_company_candidate_onboarding.py \
            tools/onboard_company_candidates.py
          python -m unittest tests.test_company_review_path_defaults

      - name: Commit private defaults and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-company-review-defaults.yml
          git add \
            tools/build_company_candidates.py \
            tools/apply_manual_company_trust.py \
            tools/prepare_company_candidate_onboarding.py \
            tools/onboard_company_candidates.py \
            tests/test_company_review_path_defaults.py
          git commit -m "fix: keep company review CLI defaults private"
          git push origin HEAD:fix/company-review-safe-defaults
